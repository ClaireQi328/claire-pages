<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<title>个人办公工作台</title>
<style>
:root{
  --blue:#2563EB; --blue-d:#1D4ED8; --blue-l:#EFF6FF; --blue-b:#BFDBFE;
  --red:#DC2626; --red-l:#FEF2F2; --red-b:#FECACA;
  --amber:#D97706; --amber-l:#FFFBEB; --amber-b:#FDE68A;
  --green:#059669; --green-l:#ECFDF5; --green-b:#A7F3D0;
  --t1:#0F172A; --t2:#475569; --t3:#94A3B8;
  --bd:#E5E9F0; --bg:#F6F8FC; --card:#FFFFFF;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.05), 0 6px 18px rgba(15,23,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg); color:var(--t1); font-size:14px; line-height:1.55;
  display:flex; min-height:100vh;
}
button,input,select,textarea{font-family:inherit}
/* ============ 侧边导航 ============ */
.sidebar{
  width:216px; flex:0 0 216px; background:#fff; border-right:1px solid var(--bd);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:18px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563EB,#1D4ED8);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.brand b{font-size:15px;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:var(--t3);font-weight:400;letter-spacing:.5px}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;cursor:pointer;
  padding:0 12px;height:44px;border-radius:10px;color:var(--t2);font-size:14px;text-align:left;margin-bottom:2px;
}
.navitem:hover{background:#F1F5F9;color:var(--t1)}
.navitem.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.navitem .nb{margin-left:auto;font-size:11px;background:#EEF2F7;color:var(--t2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.navitem.on .nb{background:#DBEAFE;color:var(--blue-d)}
.navitem .nb.hot{background:#FEE2E2;color:var(--red)}
.side-foot{margin-top:auto;border-top:1px solid var(--bd);padding-top:12px;font-size:11px;color:var(--t3);line-height:1.7}
.side-foot b{color:var(--t2);font-weight:600}
/* ============ 主区 ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 22px 40px}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bd);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.topbar .date{font-size:12px;color:var(--t3);margin-left:2px}
.tb-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 13px;
  border-radius:9px;border:1px solid var(--bd);background:#fff;color:var(--t2);font-size:13px;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#CBD5E1;color:var(--t1);background:#F8FAFC}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.btn.dgr{color:var(--red);border-color:var(--red-b);background:var(--red-l)}
.btn.dgr:hover{background:#FEE2E2;color:var(--red)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.gh{border-color:transparent;background:transparent}
.btn.gh:hover{background:#F1F5F9}
/* 页头配图 */
.hero{position:relative;border-radius:16px;overflow:hidden;margin:18px 0 16px;box-shadow:var(--sh);background:#EAF1FE}
.hero svg{display:block;width:100%;height:auto}
.hero-txt{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:#0B2A6B}
.hero-txt h2{margin:0;font-size:19px;letter-spacing:.4px}
.hero-txt p{margin:5px 0 0;font-size:12.5px;color:#3B6BC9;max-width:44ch}
/* 提示条 */
.tip{display:none;align-items:center;gap:10px;background:var(--amber-l);border:1px solid var(--amber-b);color:#92400E;
  padding:10px 14px;border-radius:11px;margin-bottom:14px;font-size:13px}
.tip.show{display:flex;flex-wrap:wrap}
.tip .sp{margin-left:auto;display:flex;gap:8px}
/* 今天要处理 */
.today{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.today.alert{border-color:var(--red-b)}
.today-h{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#FBFCFE)}
.today.alert .today-h{background:var(--red-l);border-bottom-color:var(--red-b)}
.today-h h3{margin:0;font-size:14.5px;font-weight:650}
.today-h .cnt{font-size:12px;color:var(--t3)}
.today-b{padding:8px 10px 12px}
.trow{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-radius:10px}
.trow+.trow{border-top:1px dashed #EEF2F7}
.trow:hover{background:#FAFBFD}
.trow .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:7px;flex:0 0 8px}
.trow .dot.amber{background:var(--amber)}
.trow .tx{min-width:0;flex:1}
.trow .tx b{display:block;font-weight:600;font-size:13.5px;color:var(--t1);word-break:break-word}
.trow .tx small{display:block;color:var(--t2);font-size:12px;margin-top:2px;word-break:break-word}
.trow .ops{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.empty-ok{display:flex;align-items:center;gap:9px;padding:14px 12px;color:var(--green);font-size:13.5px}
/* 卡片/区块 */
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--bd)}
.card-h h3{margin:0;font-size:14px;font-weight:650}
.card-h .sub{font-size:12px;color:var(--t3);font-weight:400}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px 16px}
/* 表单 */
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form .fi{flex:1 1 220px;min-width:0}
label.lb{display:block;font-size:11.5px;color:var(--t3);margin-bottom:4px;letter-spacing:.3px}
input[type=text],input[type=date],input[type=search],select,textarea{
  width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--bd);border-radius:9px;background:#fff;
  font-size:16px;color:var(--t1);outline:none;transition:.15s;
}
@media (min-width:861px){input[type=text],input[type=date],input[type=search],select,textarea{font-size:13.5px}}
textarea{min-height:76px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
/* 筛选 chip */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;color:var(--t2);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:#CBD5E1;background:#F8FAFC}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.chip .n{opacity:.65;font-size:11px}
/* 任务组 */
.grp{margin-top:6px}
.grp-h{display:flex;align-items:center;gap:8px;padding:11px 4px 7px;font-size:12.5px;color:var(--t2);font-weight:650}
.grp-h .line{flex:1;height:1px;background:var(--bd)}
.grp-h .cn{font-weight:400;color:var(--t3);font-size:11.5px}
.grp-h.today-g{color:var(--blue-d)}
.task{display:flex;align-items:flex-start;gap:11px;padding:11px 10px;border:1px solid transparent;border-radius:11px}
.task:hover{background:#FAFBFD;border-color:var(--bd)}
.task.late{background:var(--red-l);border-color:var(--red-b)}
.task.late:hover{background:#FEF0F0}
.cb{width:22px;height:22px;flex:0 0 22px;border:2px solid #CBD5E1;border-radius:7px;background:#fff;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;padding:0}
.cb:hover{border-color:var(--blue)}
.cb.done{background:var(--green);border-color:var(--green)}
.task .body{flex:1;min-width:0}
.task .tt{font-size:13.8px;color:var(--t1);word-break:break-word}
.task.done-i .tt{text-decoration:line-through;color:var(--t3)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:6px;background:#F1F5F9;color:var(--t2);border:1px solid #E2E8F0;line-height:1.7}
.tag.p0{background:#FEF2F2;color:var(--red);border-color:var(--red-b);font-weight:600}
.tag.p1{background:var(--amber-l);color:var(--amber);border-color:var(--amber-b);font-weight:600}
.tag.p2{background:#F1F5F9;color:#64748B;border-color:#E2E8F0}
.tag.prj{background:var(--blue-l);color:var(--blue-d);border-color:var(--blue-b);cursor:pointer}
.tag.late{background:#FEE2E2;color:var(--red);border-color:var(--red-b);font-weight:600}
.task .ops{display:flex;gap:5px;flex:0 0 auto;opacity:.35;transition:.15s}
.task:hover .ops,.task.late .ops{opacity:1}
/* 笔记 */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.note{border:1px solid var(--bd);border-radius:11px;padding:12px 13px;background:#fff;display:flex;flex-direction:column;gap:8px}
.note:hover{border-color:#CBD5E1;box-shadow:var(--sh)}
.note .c{font-size:13.5px;color:var(--t1);white-space:pre-wrap;word-break:break-word;flex:1}
.note .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px dashed #EEF2F7;padding-top:8px}
.note .f time{font-size:11px;color:var(--t3);margin-left:auto}
/* 项目 */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.proj{border:1px solid var(--bd);border-radius:12px;background:#fff;padding:14px}
.proj:hover{box-shadow:var(--sh)}
.proj.blocked{border-color:var(--red-b);background:linear-gradient(180deg,#FFF9F9,#fff)}
.proj-h{display:flex;align-items:flex-start;gap:11px}
.proj-h .nm{font-size:14.5px;font-weight:650;flex:1;min-width:0;word-break:break-word}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid;line-height:1.8;white-space:nowrap}
.pill.run{background:var(--blue-l);color:var(--blue-d);border-color:var(--blue-b)}
.pill.blk{background:var(--red-l);color:var(--red);border-color:var(--red-b);font-weight:600}
.pill.fin{background:var(--green-l);color:var(--green);border-color:var(--green-b)}
.kv{display:flex;gap:8px;font-size:12.5px;margin-top:9px;align-items:flex-start}
.kv i{font-style:normal;color:var(--t3);flex:0 0 46px;font-size:11.5px;padding-top:1px}
.kv span{color:var(--t2);word-break:break-word;flex:1}
.kv.blk span{color:var(--red)}
.proj-p{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed #EEF2F7}
.proj-p .txt{font-size:12px;color:var(--t2);flex:1}
.proj-p .txt b{display:block;font-size:13px;color:var(--t1)}
.mini{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.mini a{display:flex;gap:7px;font-size:12px;color:var(--t2);align-items:center}
.mini a .s{width:6px;height:6px;border-radius:50%;background:#CBD5E1;flex:0 0 6px}
.mini a .s.ok{background:var(--green)}
.mini a .s.late{background:var(--red)}
.mini a.d{color:var(--t3);text-decoration:line-through}
/* 复盘 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--bd);border-radius:11px;padding:13px 14px;background:linear-gradient(180deg,#fff,#FBFCFE)}
.kpi .l{font-size:11.5px;color:var(--t3);letter-spacing:.3px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:3px;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--t2);margin-top:2px}
.kpi.b .v{color:var(--blue-d)} .kpi.g .v{color:var(--green)} .kpi.r .v{color:var(--red)} .kpi.a .v{color:var(--amber)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.chart-box{border:1px solid var(--bd);border-radius:11px;padding:14px}
.chart-box h4{margin:0 0 12px;font-size:13px;font-weight:650;color:var(--t1)}
.lg{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--t2)}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px}
.lg .n{margin-left:auto;color:var(--t1);font-weight:600}
.lg div{display:flex;align-items:center}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.blist{display:flex;flex-direction:column;gap:9px}
.bitem .t{display:flex;font-size:12.5px;color:var(--t2);margin-bottom:4px}
.bitem .t b{margin-left:auto;color:var(--t1)}
.track{height:9px;background:#F1F5F9;border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60A5FA,#2563EB)}
.blk-list{display:flex;flex-direction:column;gap:9px}
.blk-item{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--red-l);border:1px solid var(--red-b);font-size:13px}
.blk-item.w{background:var(--amber-l);border-color:var(--amber-b)}
.blk-item b{display:block;font-size:13px;color:var(--t1)}
.blk-item small{color:var(--t2);font-size:12px}
.none{color:var(--t3);font-size:13px;padding:16px 6px;text-align:center}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;box-shadow:0 20px 50px rgba(15,23,42,.25);max-height:88vh;overflow:auto}
.modal-h{padding:15px 18px;border-bottom:1px solid var(--bd);font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#0F172A;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:.94;transform:translate(-50%,0)}
/* 移动端 */
.tabs{display:none}
@media (max-width:860px){
  body{display:block}
  .sidebar{display:none}
  .wrap{padding:0 13px 96px}
  .topbar-in{padding:9px 13px}
  .topbar h1{font-size:14px}
  .tb-actions{width:auto;margin-left:auto;gap:6px}
  .tb-actions .btn{min-width:42px;padding:0 10px;flex:0 0 auto}
  .tb-actions .btn .btxt{display:none}
  .tb-actions .btn svg{display:block;margin:0}
  .topbar h1{font-size:14px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hero{margin:12px 0 14px;border-radius:13px}
  .hero-txt{left:16px}
  .hero-txt h2{font-size:16px}
  .hero-txt p{font-size:11px;max-width:22ch}
  .card-b{padding:12px 12px}
  .card-h{padding:12px 13px}
  .btn{min-height:42px;padding:0 15px;font-size:13.5px}
  .btn.sm{min-height:38px;font-size:12.5px;padding:0 12px}
  .cb{width:26px;height:26px;flex:0 0 26px}
  .chip{min-height:38px;padding:6px 14px}
  .task .ops{opacity:1}
  .trow{flex-wrap:wrap}
  .trow .ops{width:100%;padding-left:18px}
  .notes,.projs{grid-template-columns:1fr}
  .tabs{
    display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--bd);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;min-height:52px;color:var(--t3);font-size:11px;cursor:pointer;border-radius:10px;position:relative}
  .tabs button.on{color:var(--blue-d);font-weight:600;background:var(--blue-l)}
  .tabs button .bdg{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;
    min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
}
@media print{.sidebar,.tabs,.topbar,.tb-actions{display:none}}
</style>
</head>
<body>

<!-- ============ 左侧导航 ============ -->
<aside class="sidebar">
  <div class="brand">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h12M3 17h7"/></svg>
    </div>
    <b>办公工作台<span>PERSONAL WORKSPACE</span></b>
  </div>
  <button class="navitem on" data-view="tasks">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M8 13l2.5 2.5L16 10"/></svg>
    今天待办<span class="nb" id="nbTasks">0</span>
  </button>
  <button class="navitem" data-view="notes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5.9 1.1 1 1.7h5.2c.1-.6.4-1.2 1-1.7A6 6 0 0 0 12 3Z"/></svg>
    灵感速记<span class="nb" id="nbNotes">0</span>
  </button>
  <button class="navitem" data-view="projects">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
    项目跟进<span class="nb" id="nbProjs">0</span>
  </button>
  <button class="navitem" data-view="review">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>
    每周复盘
  </button>
  <div class="side-foot">
    <div>数据存在本机浏览器<br>共 <b id="sfCount">0</b> 条记录</div>
    <div style="margin-top:6px">上次备份：<b id="sfBackup">从未</b></div>
  </div>
</aside>

<!-- ============ 主内容 ============ -->
<div class="main">
  <div class="topbar">
    <div class="topbar-in">
      <h1 id="viewTitle">今天待办</h1><span class="date" id="todayLabel"></span>
      <div class="tb-actions">
        <button class="btn sm" id="btnExport">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span class="btxt">导出备份</span></button>
        <button class="btn sm" id="btnImport">

<script>
(function(){
"use strict";
/* ============ 基础工具 ============ */
var K={t:"wb_office_tasks",n:"wb_office_notes",p:"wb_office_projects",m:"wb_office_meta"};
var S={tasks:[],notes:[],projects:[],meta:{}};
var view="tasks", taskFilter="open", tagFilter="", noteQuery="", weekOffset=0;

function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function pad(n){return n<10?"0"+n:""+n;}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return fmt(new Date());}
function dObj(s){return new Date(s+"T00:00:00");}
function addDays(s,n){var d=dObj(s);d.setDate(d.getDate()+n);return fmt(d);}
function wd(s){return "日一二三四五六".charAt(dObj(s).getDay());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(msg){var e=$("#toast");e.textContent=msg;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on");},1900);}
function weekStart(off){var d=new Date();var i=(d.getDay()+6)%7;d.setDate(d.getDate()-i+off*7);return fmt(d);}

/* ============ 存储 ============ */
function load(){
  try{
    S.tasks=JSON.parse(localStorage.getItem(K.t)||"[]");
    S.notes=JSON.parse(localStorage.getItem(K.n)||"[]");
    S.projects=JSON.parse(localStorage.getItem(K.p)||"[]");
    S.meta=JSON.parse(localStorage.getItem(K.m)||"null");
  }catch(e){ S.tasks=[];S.notes=[];S.projects=[];S.meta=null; }
  if(!S.meta){ seed(); S.meta={created:today(),nextTipAt:20,lastBackup:""}; save(); }
}
function save(){
  try{
    localStorage.setItem(K.t,JSON.stringify(S.tasks));
    localStorage.setItem(K.n,JSON.stringify(S.notes));
    localStorage.setItem(K.p,JSON.stringify(S.projects));
    localStorage.setItem(K.m,JSON.stringify(S.meta));
  }catch(e){ toast("保存失败：浏览器存储可能已满"); }
}
function total(){return S.tasks.length+S.notes.length+S.projects.length;}

/* ============ 示例数据 ============ */
function seed(){
  var t=today();
  var p1={id:"demo-p1",name:"Q3 供应商准入优化",stage:"方案评审中（3/5 轮）",next:"约业务方对齐准入口径",blocker:"",status:"run",demo:true,createdAt:t};
  var p2={id:"demo-p2",name:"报价数据看板搭建",stage:"需求已确认，等开发排期",next:"催 IT 给出排期反馈",blocker:"IT 资源被占用，排期未定",status:"blocked",demo:true,createdAt:t};
  var p3={id:"demo-p3",name:"月度成本复盘材料",stage:"数据已拉取",next:"输出结论页并配图",blocker:"",status:"run",demo:true,createdAt:t};
  S.projects=[p1,p2,p3];
  // 已完成示例落在「本周」内，保证复盘页一打开就有图表
  var ws=weekStart(0), lw=weekStart(-1);
  var d1=ws, d2=(addDays(ws,1)<=t?addDays(ws,1):t), d3=(addDays(ws,2)<=t?addDays(ws,2):t);
  S.tasks=[
    {id:"demo-t1",title:"补齐上月供应商报价对比表",pri:"P0",due:addDays(t,-2),origDue:addDays(t,-2),postponed:1,done:false,projectId:"demo-p1",demo:true,createdAt:addDays(t,-4)},
    {id:"demo-t2",title:"和业务方对齐准入口径（30分钟会）",pri:"P0",due:t,postponed:0,done:false,projectId:"demo-p1",demo:true,createdAt:t},
    {id:"demo-t3",title:"催 IT 反馈看板开发排期",pri:"P1",due:t,postponed:0,done:false,projectId:"demo-p2",demo:true,createdAt:t},
    {id:"demo-t4",title:"整理成本复盘结论页大纲",pri:"P1",due:addDays(t,1),postponed:0,done:false,projectId:"demo-p3",demo:true,createdAt:t},
    {id:"demo-t5",title:"周五团队例会材料",pri:"P2",due:addDays(t,3),postponed:0,done:false,projectId:"",demo:true,createdAt:t},
    {id:"demo-t6",title:"拉取近三个月采购入库数据",pri:"P1",due:d1,postponed:0,done:true,doneAt:d1,projectId:"demo-p3",demo:true,createdAt:ws},
    {id:"demo-t7",title:"完成准入流程现状梳理",pri:"P0",due:d2,postponed:0,done:true,doneAt:d2,projectId:"demo-p1",demo:true,createdAt:ws},
    {id:"demo-t8",title:"更新供应商联系人清单",pri:"P2",due:d3,postponed:0,done:true,doneAt:d3,projectId:"demo-p1",demo:true,createdAt:ws},
    {id:"demo-t9",title:"看板原型初稿评审",pri:"P1",due:addDays(lw,3),postponed:0,done:true,doneAt:addDays(lw,3),projectId:"demo-p2",demo:true,createdAt:lw}
  ];
  S.notes=[
    {id:"demo-n1",text:"报价对比表可以按「品类 + 轮次」双维度看，单看总价容易被结构掩盖差异。",tags:["采购","数据分析"],demo:true,createdAt:Date.now()-86400000*2},
    {id:"demo-n2",text:"准入流程里「资质初审」和「现场审核」其实可以并行，能省 5~7 天。",tags:["流程优化"],demo:true,createdAt:Date.now()-86400000},
    {id:"demo-n3",text:"下周试试把复盘会改成 15 分钟站会 + 一页纸结论，别再念 PPT 了。",tags:["管理","效率"],demo:true,createdAt:Date.now()-3600000*5}
  ];
}
function hasDemo(){
  var f=function(x){return x.demo;};
  return S.tasks.some(f)||S.notes.some(f)||S.projects.some(f);
}

/* ============ 自动顺延 ============ */
function rollover(){
  var t=today(),n=0;
  S.tasks.forEach(function(x){
    if(!x.done && x.due && x.due<t){
      if(!x.origDue) x.origDue=x.due;
      x.due=t; x.postponed=(x.postponed||0)+1; n++;
    }
  });
  if(n) save();
  return n;
}

/* ============ 派生查询 ============ */
function projById(id){for(var i=0;i<S.projects.length;i++){if(S.projects[i].id===id)return S.projects[i];}return null;}
function isLate(x){return !x.done && (x.postponed||0)>0;}
function overdueTasks(){return S.tasks.filter(isLate).sort(function(a,b){return (b.postponed||0)-(a.postponed||0)||priN(a.pri)-priN(b.pri);});}
function blockedProjects(){return S.projects.filter(function(p){return p.status!=="fin" && (p.status==="blocked"||(p.blocker||"").trim()!=="");});}
function priN(p){return p==="P0"?0:p==="P1"?1:2;}
function priName(p){return p==="P0"?"P0 紧急重要":p==="P1"?"P1 重要":"P2 常规";}
function dayLabel(d){
  var t=today();
  if(d===t) return "今天";
  if(d===addDays(t,1)) return "明天";
  if(d===addDays(t,2)) return "后天";
  if(d===addDays(t,-1)) return "昨天";
  return d.slice(5).replace("-","月")+"日 周"+wd(d);
}

/* ============ 渲染：今天要处理 ============ */
function renderToday(){
  var t=today();
  var late=overdueTasks();
  var blk=blockedProjects();
  var todayOpen=S.tasks.filter(function(x){return !x.done && x.due===t && !isLate(x);});
  var box=$("#todayBox"), body=$("#todayBody");
  box.classList.toggle("alert", late.length+blk.length>0);
  $("#todayCnt").textContent = late.length+blk.length>0
    ? ("逾期 "+late.length+" · 卡住 "+blk.length+" · 今日待办 "+todayOpen.length)
    : ("今日待办 "+todayOpen.length+" 条");
  var h="";
  late.forEach(function(x){
    var p=projById(x.projectId);
    h+='<div class="trow"><span class="dot"></span><div class="tx"><b>'+esc(x.title)+'</b>'+

  blk.forEach(function(p){

/* ============ 渲染：任务 ============ */
function renderTasks(){
  var t=today();
  var open=S.tasks.filter(function(x){return !x.done;});
  var late=open.filter(isLate);
  $("#tSum").textContent="未完成 "+open.length+" 条 · 逾期 "+late.length+" 条 · 已完成 "+(S.tasks.length-open.length)+" 条";
  var list=S.tasks.slice();
  if(taskFilter==="open") list=list.filter(function(x){return !x.done;});
  else if(taskFilter==="late") list=list.filter(isLate);
  else if(taskFilter==="done") list=list.filter(function(x){return x.done;});

  var h="";
  if(taskFilter==="done"){
    list.sort(function(a,b){return (b.doneAt||"").localeCompare(a.doneAt||"");});
    h+=list.length?'<div class="grp">'+list.map(taskHTML).join("")+"</div>":'<div class="none">还没有完成的任务</div>';
  }else{
    var undone=list.filter(function(x){return !x.done;});
    var doneIn=list.filter(function(x){return x.done;});
    var groups={},order=[];
    undone.sort(function(a,b){return (a.due||"9999").localeCompare(b.due||"9999")||priN(a.pri)-priN(b.pri);});
    undone.forEach(function(x){
      var k=x.due||"无日期";
      if(!groups[k]){groups[k]=[];order.push(k);}
      groups[k].push(x);
    });
    if(!order.length) h+='<div class="none">这里空空的，先加一条任务吧</div>';
    order.forEach(function(k){
      var isT=(k===t), lateN=groups[k].filter(isLate).length;
      h+='<div class="grp"><div class="grp-h'+(isT?" today-g":"")+'">'+(k==="无日期"?"无日期":dayLabel(k))+
         '<span class="cn">'+(k==="无日期"?"":k)+' · '+groups[k].length+' 条'+(lateN?'　<span style="color:#DC2626">含 '+lateN+' 条逾期顺延</span>':"")+'</span><span class="line"></span></div>'+
         groups[k].map(taskHTML).join("")+'</div>';
    });
    if(doneIn.length){
      doneIn.sort(function(a,b){return (b.doneAt||"").localeCompare(a.doneAt||"");});
      h+='<div class="grp"><div class="grp-h">已完成<span class="cn">'+doneIn.length+' 条</span><span class="line"></span></div>'+doneIn.slice(0,40).map(taskHTML).join("")+'</div>';
    }
  }
  $("#taskList").innerHTML=h;
}
function taskHTML(x){
  var p=projById(x.projectId);
  var late=isLate(x);
  return '<div class="task'+(late?" late":"")+(x.done?" done-i":"")+'">'+
    '<button class="cb'+(x.done?" done":"")+'" data-act="toggle" data-id="'+x.id+'" title="完成/取消">'+
      (x.done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>':"")+
    '</button>'+
    '<div class="body"><div class="tt">'+esc(x.title)+'</div><div class="meta">'+
      '<span class="tag '+(x.pri||"P2").toLowerCase()+'">'+esc(x.pri||"P2")+'</span>'+
      '<span class="tag">截止 '+esc(x.due||"—")+'</span>'+
      (p?'<span class="tag prj" data-act="goproj" data-id="'+p.id+'">'+esc(p.name)+'</span>':"")+
      (late?'<span class="tag late">逾期 · 已顺延 '+(x.postponed||0)+' 次</span>':"")+
      (x.done&&x.doneAt?'<span class="tag">完成于 '+esc(x.doneAt)+'</span>':"")+
    '</div></div>'+
    '<div class="ops">'+
      (x.done?"":'<button class="btn sm" data-act="tomorrow" data-id="'+x.id+'" title="顺延到明天">明天</button>')+
      '<button class="btn sm gh" data-act="delTask" data-id="'+x.id+'" title="删除">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>'+
    '</div></div>';
}

/* ============ 渲染：灵感 ============ */
function renderNotes(){
  var tags={};
  S.notes.forEach(function(n){(n.tags||[]).forEach(function(t){tags[t]=(tags[t]||0)+1;});});
  var keys=Object.keys(tags).sort(function(a,b){return tags[b]-tags[a];});
  var bar='<button class="chip'+(tagFilter===""?" on":"")+'" data-tag="">全部 <span class="n">'+S.notes.length+'</span></button>';
  keys.forEach(function(t){bar+='<button class="chip'+(tagFilter===t?" on":"")+'" data-tag="'+esc(t)+'">#'+esc(t)+' <span class="n">'+tags[t]+'</span></button>';});
  $("#tagBar").innerHTML=bar;
  var q=noteQuery.trim().toLowerCase();
  var list=S.notes.filter(function(n){
    if(tagFilter && (n.tags||[]).indexOf(tagFilter)<0) return false;
    if(q){ var s=(n.text+" "+(n.tags||[]).join(" ")).toLowerCase(); if(s.indexOf(q)<0) return false; }
    return true;
  }).sort(function(a,b){return b.createdAt-a.createdAt;});
  $("#nSum").textContent="共 "+S.notes.length+" 条 · "+keys.length+" 个标签";
  $("#noteList").innerHTML = list.length? list.map(function(n){
    return '<div class="note"><div class="c">'+esc(n.text)+'</div><div class="f">'+
      (n.tags||[]).map(function(t){return '<span class="tag prj" data-tag2="'+esc(t)+'">#'+esc(t)+'</span>';}).join("")+
      '<time>'+new Date(n.createdAt).toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"})+'</time>'+
      '<button class="btn sm gh" data-act="delNote" data-id="'+n.id+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>'+
      '</div></div>';
  }).join("") : '<div class="none">没有匹配的灵感</div>';
}

/* ============ 渲染：项目 ============ */
function ringSVG(pct){
  var r=19,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="'+r+'" fill="none" stroke="#EEF2F7" stroke-width="6"/>'+
    '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 26 26)"/>'+
    '<text x="26" y="30" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">'+pct+'%</text></svg>';
}
function renderProjects(){
  var run=S.projects.filter(function(p){return p.status==="run";}).length;
  var blk=S.projects.filter(function(p){return p.status==="blocked";}).length;
  $("#pSum").textContent="进行中 "+run+" · 卡住 "+blk+" · 已完成 "+S.projects.filter(function(p){return p.status==="fin";}).length;
  if(!S.projects.length){ $("#projList").innerHTML='<div class="none">还没有项目，先建一个吧</div>'; return; }
  $("#projList").innerHTML=S.projects.map(function(p){
    var ts=S.tasks.filter(function(x){return x.projectId===p.id;});
    var dn=ts.filter(function(x){return x.done;}).length;
    var pct=ts.length?Math.round(dn/ts.length*100):0;
    var lateN=ts.filter(isLate).length;
    var pill=p.status==="blocked"?'<span class="pill blk">卡住</span>':p.status==="fin"?'<span class="pill fin">已完成</span>':'<span class="pill run">进行中</span>';
    return '<div class="proj'+(p.status==="blocked"?" blocked":"")+'">'+
      '<div class="proj-h"><div class="nm">'+esc(p.name)+'</div>'+pill+
      '<button class="btn sm gh" data-act="editProj" data-id="'+p.id+'">编辑</button></div>'+
      '<div class="kv"><i>现在</i><span>'+esc(p.stage||"—")+'</span></div>'+
      '<div class="kv"><i>下一步</i><span>'+esc(p.next||"—")+'</span></div>'+
      (p.blocker?'<div class="kv blk"><i>卡点</i><span>'+esc(p.blocker)+'</span></div>':"")+
      '<div class="proj-p">'+ringSVG(pct)+'<div class="txt"><b>关联待办 '+dn+"/"+ts.length+' 已完成</b>'+
        (lateN?'<span style="color:#DC2626">其中 '+lateN+' 条已逾期顺延</span>':(ts.length?"进度正常":"还没有挂任务"))+'</div></div>'+
      (ts.length?'<div class="mini">'+ts.slice(0,5).map(function(x){
        return '<a class="'+(x.done?"d":"")+'"><span class="s '+(x.done?"ok":(isLate(x)?"late":""))+'"></span>'+esc(x.title)+'</a>';
      }).join("")+(ts.length>5?'<a style="color:#94A3B8">…还有 '+(ts.length-5)+' 条</a>':"")+'</div>':"")+
      '</div>';
  }).join("");
}

/* ============ 渲染：复盘 ============ */
function renderReview(){
  var ws=weekStart(weekOffset), we=addDays(ws,6);
  $("#wkRange").textContent=ws+" ~ "+we;
  var doneW=S.tasks.filter(function(x){return x.done&&x.doneAt&&x.doneAt>=ws&&x.doneAt<=we;});
  var newW=S.tasks.filter(function(x){return x.createdAt&&x.createdAt>=ws&&x.createdAt<=we;});
  var notesW=S.notes.filter(function(n){var d=fmt(new Date(n.createdAt));return d>=ws&&d<=we;});
  var rate=newW.length?Math.round(doneW.length/Math.max(newW.length,doneW.length)*100):(doneW.length?100:0);
  var activeP={}; doneW.forEach(function(x){if(x.projectId)activeP[x.projectId]=1;});
  var lateNow=overdueTasks().length;
  $("#kpis").innerHTML=
    kpi("b","本周完成任务",doneW.length,"件 · 新增 "+newW.length+" 件")+
    kpi("g","完成率",rate+"%","按本周新增/完成口径")+
    kpi("a","新增灵感",notesW.length,"条")+
    kpi("r","当前逾期",lateNow,"条待清理");

  /* 每日完成量 柱状图 */
  var days=[],maxv=1;
  for(var i=0;i<7;i++){ var d=addDays(ws,i); var c=doneW.filter(function(x){return x.doneAt===d;}).length; days.push({d:d,c:c}); if(c>maxv)maxv=c; }
  var bw=26,gap=14,W=7*bw+6*gap+24,H=140;
  var sv='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="150" style="overflow:visible">';
  [0,.5,1].forEach(function(r){ var y=18+(96*(1-r)); sv+='<line x1="14" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#EEF2F7" stroke-width="1"/>'; });
  days.forEach(function(o,i){
    var x=14+i*(bw+gap), hh=Math.round(o.c/maxv*96), y=18+96-hh;
    var isT=(o.d===today());
    sv+='<rect x="'+x+'" y="'+(hh?y:114)+'" width="'+bw+'" height="'+(hh||2)+'" rx="5" fill="'+(hh?(isT?"#1D4ED8":"#60A5FA"):"#E8EEF7")+'"/>';
    if(o.c) sv+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">'+o.c+'</text>';
    sv+='<text x="'+(x+bw/2)+'" y="130" text-anchor="middle" font-size="11" fill="'+(isT?"#1D4ED8":"#94A3B8")+'" font-weight="'+(isT?700:400)+'">周'+wd(o.d)+'</text>';
  });
  sv+='</svg>';
  $("#chDaily").innerHTML=sv;

  /* 优先级分布 环形图 */
  var pc={P0:0,P1:0,P2:0};
  doneW.forEach(function(x){ pc[x.pri||"P2"]=(pc[x.pri||"P2"]||0)+1; });
  var tot=pc.P0+pc.P1+pc.P2;
  var cols={P0:"#DC2626",P1:"#F59E0B",P2:"#60A5FA"};
  if(!tot){ $("#chPri").innerHTML='<div class="none">本周还没有完成的任务</div>'; }
  else{
    var r=48,c=2*Math.PI*r,acc=0;
    var d='<svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="'+r+'" fill="none" stroke="#F1F5F9" stroke-width="17"/>';
    ["P0","P1","P2"].forEach(function(k){
      if(!pc[k])return;
      var len=c*pc[k]/tot;
      d+='<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+cols[k]+'" stroke-width="17" stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'" transform="rotate(-90 66 66)"/>';
      acc+=len;
    });
    d+='<text x="66" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">'+tot+'</text>'+
       '<text x="66" y="80" text-anchor="middle" font-size="11" fill="#94A3B8">件已完成</text></svg>';
    var lg='<div class="lg">';
    ["P0","P1","P2"].forEach(function(k){
      lg+='<div><i style="background:'+cols[k]+'"></i>'+priName(k)+'<span class="n">'+pc[k]+' 件 · '+(tot?Math.round(pc[k]/tot*100):0)+'%</span></div>';
    });
    lg+='</div>';
    $("#chPri").innerHTML='<div class="donut-wrap">'+d+lg+'</div>';
  }

  /* 精力去向 横向条 */
  var pm={},maxp=1;
  doneW.forEach(function(x){
    var key=x.projectId||"__none";
    pm[key]=(pm[key]||0)+1; if(pm[key]>maxp)maxp=pm[key];
  });
  var ks=Object.keys(pm).sort(function(a,b){return pm[b]-pm[a];});
  $("#chProj").innerHTML = ks.length? '<div class="blist">'+ks.map(function(k){
    var p=projById(k), nm=p?p.name:"未关联项目";
    var pct=Math.round(pm[k]/maxp*100);
    return '<div class="bitem"><div class="t">'+esc(nm)+'<b>'+pm[k]+' 件 · '+Math.round(pm[k]/doneW.length*100)+'%</b></div>'+
      '<div class="track"><i style="width:'+pct+'%'+(p?"":";background:linear-gradient(90deg,#CBD5E1,#94A3B8)")+'"></i></div></div>';
  }).join("")+'</div>' : '<div class="none">本周还没有完成的任务，先去清一条待办</div>';

  /* 卡点汇总 */
  var bl=blockedProjects().map(function(p){
    return '<div class="blk-item"><div><b>'+esc(p.name)+'</b><small>卡点：'+esc(p.blocker||"未填写")+'　|　下一步：'+esc(p.next||"待定")+'</small></div></div>';
  });
  overdueTasks().filter(function(x){return (x.postponed||0)>=2;}).forEach(function(x){
    bl.push('<div class="blk-item w"><div><b>'+esc(x.title)+'</b><small>已顺延 '+(x.postponed||0)+' 次（原定 '+esc(x.origDue||x.due)+'）——要么拆小，要么砍掉</small></div></div>');
  });
  $("#blkList").innerHTML = bl.length? bl.join("") : '<div class="none">本周没有卡点，状态不错</div>';
}
function kpi(cls,l,v,d){return '<div class="kpi '+cls+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>';}

/* ============ 事件：委托操作 ============ */
document.addEventListener("click",function(e){
  var tg=e.target.closest("[data-tag]");
  if(tg && tg.closest("#tagBar")){ tagFilter=tg.dataset.tag; renderNotes(); return; }
  var tg2=e.target.closest("[data-tag2]");
  if(tg2){ tagFilter=tg2.dataset.tag2; renderNotes(); return; }
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var id=el.dataset.id, act=el.dataset.act, i;
  if(act==="toggle"||act==="done"){
    for(i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id){
      var x=S.tasks[i];
      x.done=(act==="done")?true:!x.done;
      if(x.done){ x.doneAt=today(); } else { delete x.doneAt; }
      break;
    }
    save(); renderAll(); if(act==="done") toast("搞定一条 ✓");
  }else if(act==="tomorrow"){
    for(i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id){
      var y=S.tasks[i];
      if(!y.origDue) y.origDue=y.due;
      y.due=addDays(today(),1); y.postponed=(y.postponed||0)+1; break;
    }
    save(); renderAll(); toast("已顺延到明天（顺延次数 +1）");
  }else if(act==="delTask"){
    S.tasks=S.tasks.filter(function(z){return z.id!==id;}); save(); renderAll(); toast("已删除");
  }else if(act==="delNote"){
    S.notes=S.notes.filter(function(z){return z.id!==id;}); save(); renderAll(); toast("已删除");
  }else if(act==="goproj"){
    go("projects");
    setTimeout(function(){
      var cards=$$("#projList .proj"), p=projById(id);
      cards.forEach(function(c){ if(p && c.textContent.indexOf(p.name)===0){ c.style.transition="box-shadow .3s"; c.style.boxShadow="0 0 0 3px rgba(37,99,235,.3)"; setTimeout(function(){c.style.boxShadow="";},1600); c.scrollIntoView({block:"center",behavior:"smooth"}); } });
    },80);
  }else if(act==="editProj"){
    openProjEdit(id);
  }
});

/* ============ 项目编辑 ============ */
function openProjEdit(id){
  var p=projById(id); if(!p) return;
  var html=
    '<div><label class="lb">项目名称</label><input type="text" id="epName" value="'+esc(p.name)+'"></div>'+
    '<div><label class="lb">现在到哪一步</label><input type="text" id="epStage" value="'+esc(p.stage||"")+'"></div>'+
    '<div><label class="lb">下一步做什么</label><input type="text" id="epNext" value="'+esc(p.next||"")+'"></div>'+
    '<div><label class="lb">卡在哪儿（留空表示不卡）</label><input type="text" id="epBlock" value="'+esc(p.blocker||"")+'"></div>'+
    '<div><label class="lb">状态</label><select id="epStatus">'+
      '<option value="run"'+(p.status==="run"?" selected":"")+'>进行中</option>'+
      '<option value="blocked"'+(p.status==="blocked"?" selected":"")+'>卡住</option>'+
      '<option value="fin"'+(p.status==="fin"?" selected":"")+'>已完成</option></select></div>';
  modal("编辑项目",html,[
    {t:"删除项目",cls:"dgr",fn:function(){
      closeModal();
      modal("确认删除？","<div>将删除项目「"+esc(p.name)+"」。关联任务会保留，但解除关联。此操作不可撤销。</div>",[
        {t:"取消",fn:closeModal},
        {t:"确认删除",cls:"dgr",fn:function(){
          S.projects=S.projects.filter(function(z){return z.id!==id;});
          S.tasks.forEach(function(x){ if(x.projectId===id) x.projectId=""; });
          save(); renderAll(); closeModal(); toast("项目已删除");
        }}
      ]);
    }},
    {t:"取消",fn:closeModal},
    {t:"保存",cls:"pri",fn:function(){
      p.name=$("#epName").value.trim()||p.name;
      p.stage=$("#epStage").value.trim();
      p.next=$("#epNext").value.trim();
      p.blocker=$("#epBlock").value.trim();
      p.status=$("#epStatus").value;
      if(p.blocker && p.status==="run") p.status="blocked";
      if(!p.blocker && p.status==="blocked") p.status="run";
      save(); renderAll(); closeModal(); toast("已保存");
    }}
  ]);
}

/* ============ 导出 / 导入 / 清空 ============ */
function doExport(){
  var data={app:"个人办公工作台",version:1,exportedAt:new Date().toISOString(),
    tasks:S.tasks,notes:S.notes,projects:S.projects,meta:S.meta};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="办公工作台备份_"+today().replace(/-/g,"")+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  S.meta.lastBackup=today(); bumpTip(); save(); renderAll();
  toast("备份文件已下载，换设备时导入它就行");
}
$("#btnExport").addEventListener("click",doExport);
$("#tipExport").addEventListener("click",doExport);
$("#tipLater").addEventListener("click",function(){ bumpTip(); toast("好，攒到 "+(S.meta.nextTipAt)+" 条再提醒你"); });
$("#btnImport").addEventListener("click",function(){ $("#fileIn").click(); });
$("#fileIn").addEventListener("change",function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(err){ toast("文件解析失败，不是有效的备份文件"); return; }
    if(!d||(!d.tasks&&!d.notes&&!d.projects)){ toast("备份文件里没有可识别的数据"); return; }
    var nt=(d.tasks||[]).length, nn=(d.notes||[]).length, np=(d.projects||[]).length;
    modal("导入备份","<div>识别到：任务 <b>"+nt+"</b> 条 · 灵感 <b>"+nn+"</b> 条 · 项目 <b>"+np+"</b> 个。</div>"+
      "<div style=\"color:#475569;font-size:13px\">选择「合并」会按 ID 去重并保留现有数据；选择「覆盖」会用备份完全替换当前内容。</div>",[
      {t:"取消",fn:closeModal},
      {t:"合并",fn:function(){ merge(d); closeModal(); }},
      {t:"覆盖",cls:"pri",fn:function(){
        S.tasks=d.tasks||[]; S.notes=d.notes||[]; S.projects=d.projects||[];
        if(d.meta) S.meta=d.meta;
        save(); rollover(); renderAll(); closeModal(); toast("已覆盖导入 "+(nt+nn+np)+" 条数据");
      }}
    ]);
  };
  rd.readAsText(f,"utf-8"); this.value="";
});
function merge(d){
  var add=0;
  function mg(cur,inc){
    var ids={}; cur.forEach(function(x){ids[x.id]=1;});
    (inc||[]).forEach(function(x){ if(!x.id) x.id=uid(); if(!ids[x.id]){ cur.push(x); add++; } });
  }
  mg(S.tasks,d.tasks); mg(S.notes,d.notes); mg(S.projects,d.projects);
  save(); rollover(); renderAll(); toast("已合并新增 "+add+" 条数据");
}
$("#btnDemo").addEventListener("click",function(){
  modal("清空示例内容","<div>将删除所有带「示例」标记的任务、灵感和项目，你自己添加的内容不受影响。</div>",[
    {t:"取消",fn:closeModal},
    {t:"确认清空示例",cls:"pri",fn:function(){
      S.tasks=S.tasks.filter(function(x){return !x.demo;});
      S.notes=S.notes.filter(function(x){return !x.demo;});
      S.projects=S.projects.filter(function(x){return !x.demo;});
      save(); renderAll(); closeModal(); toast("示例已清空，开始记你自己的东西吧");
    }}
  ]);
});
$("#btnWipe").addEventListener("click",function(){
  modal("清空全部数据","<div style=\"color:#DC2626;font-weight:600\">这会删掉所有任务、灵感和项目，且无法撤销。</div>"+
    "<div style=\"font-size:13px;color:#475569\">建议先点「导出备份」留一份文件再清空。</div>",[
    {t:"取消",fn:closeModal},
    {t:"先导出备份",fn:function(){ doExport(); }},
    {t:"确认清空",cls:"dgr",fn:function(){
      closeModal();
      modal("最后确认","<div>真的要清空全部 "+total()+" 条数据吗？</div>",[
        {t:"我再想想",cls:"pri",fn:closeModal},
        {t:"确认清空",cls:"dgr",fn:function(){
          S.tasks=[];S.notes=[];S.projects=[];S.meta={created:today(),nextTipAt:20,lastBackup:S.meta.lastBackup||""};
          save(); renderAll(); closeModal(); toast("已清空");
        }}
      ]);
    }}
  ]);
});
