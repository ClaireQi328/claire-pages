<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车零部件采购全流程 · 全景图</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--card:#fff;--bdr:#e2e8f0;
  --t1:#1e293b;--t2:#475569;--t3:#94a3b8;
  --blue:#3b82f6;--bl:#eff6ff;--bd:#1d4ed8;
  --orange:#f97316;--ol:#fff7ed;--od:#c2410c;
  --green:#10b981;--gl:#ecfdf5;--gd:#047857;
  --red:#ef4444;--rl:#fef2f2;--rd:#b91c1c;
  --purple:#8b5cf6;--pl:#f5f3ff;--pd:#6d28d9;
  --cyan:#06b6d4;--cl:#ecfeff;--cd:#0e7490;
  --amber:#f59e0b;--al:#fffbeb;--ad:#92400e;
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);line-height:1.5}

.hdr{background:linear-gradient(135deg,#1e3a5f,#2563eb 60%,#3b82f6);color:#fff;padding:14px 36px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(37,99,235,.2)}
.hdr h1{font-size:16px;font-weight:700}
.hdr h1 em{font-style:normal;color:rgba(255,255,255,.65);font-weight:400;font-size:11px;margin-left:8px}
.hdr-r{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.role-chip{padding:3px 10px;border-radius:10px;font-size:9px;font-weight:700;cursor:pointer;transition:.2s;border:1.5px solid transparent;opacity:.4}
.role-chip:hover{opacity:.7}
.role-chip.on{opacity:1;transform:scale(1.05)}
.role-chip.active{box-shadow:0 0 0 2px currentColor}

.wrap{padding:12px 24px 48px;overflow-x:auto}

/* ========== MILESTONE ROW ========== */
.ms-wrap{background:var(--card);border-radius:10px 10px 0 0;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden;border:1px solid var(--bdr);border-bottom:none}
.ms-bar{display:flex;height:22px}
.ms-bar-label{width:90px;min-width:90px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--t3);background:#f1f5f9;border-right:1px solid var(--bdr)}
.ms-bar-items{display:flex;flex:1}
.ms-bar-item{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;border-right:1px solid #f1f5f9;font-size:8px;font-weight:700;color:#f97316}
.ms-bar-item:last-child{border-right:none}
.ms-bar-item .d{width:7px;height:7px;min-width:7px;transform:rotate(45deg);background:#f97316;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ========== PHASE ROW ========== */
.ph-bar{display:flex;height:36px;border-bottom:2px solid #e2e8f0}
.ph-bar-label{width:90px;min-width:90px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--t3);background:#f1f5f9;border-right:1px solid var(--bdr)}
.ph-bar-items{display:flex;flex:1}
.ph-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.ph-bar-item small{font-size:7px;font-weight:600;opacity:.7}

/* ========== SWIM LANES ========== */
.sl-wrap{background:var(--card);border-radius:0 0 10px 10px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden;border:1px solid var(--bdr);border-top:none}
.sl{display:flex;border-bottom:1px solid rgba(0,0,0,.04);min-height:44px;transition:opacity .3s,filter .3s}
.sl:last-child{border-bottom:none}
.sl.dim{opacity:.1;filter:grayscale(.6)}
.sl-hdr{width:90px;min-width:90px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:8px;font-weight:700;color:#fff;text-align:center;line-height:1.2;position:sticky;left:0;z-index:2}
.sl-hdr small{font-size:6px;font-weight:400;opacity:.7}
.sl-body{flex:1;padding:4px 6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px}

/* Phase column backgrounds */
.sl-body .col{flex:1;min-width:0;padding:2px 2px;display:flex;flex-direction:column;gap:3px;align-items:stretch;border-right:1px solid rgba(0,0,0,.03)}
.sl-body .col:last-child{border-right:none}
.sl-body .col.lit{background:rgba(59,130,246,.06)}

/* ========== NODES ========== */
.nd{padding:3px 6px;border-radius:5px;font-size:8px;font-weight:600;border:1px solid;cursor:default;transition:all .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.3}
.nd:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1);z-index:5;position:relative}
.nd.b{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.nd.r{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.nd.g{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.nd.o{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.nd.p{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.nd.c{background:#ecfeff;color:#0e7490;border-color:#a5f3fc}
.nd.a{background:#fffbeb;color:#92400e;border-color:#fde68a}
.nd.star{border-width:2px;box-shadow:0 0 0 1px rgba(239,68,68,.2)}
.nd.hl{border-width:2px;box-shadow:0 0 0 2px rgba(59,130,246,.35);transform:scale(1.08);z-index:5;position:relative}
.nd.dm{opacity:.18;filter:grayscale(.5)}

/* ========== TOOLTIP ========== */
.tip{position:fixed;z-index:1000;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-width:260px;pointer-events:none;opacity:0;transition:opacity .1s}
.tip.show{opacity:1}
.tip-t{font-size:11px;font-weight:700;margin-bottom:2px}
.tip-r{font-size:8px;color:var(--t3);margin-bottom:3px}

/* ========== LEGEND ========== */
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;padding:6px 12px;background:var(--card);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.04);font-size:9px;color:var(--t3);align-items:center;border:1px solid var(--bdr)}
.leg-i{display:flex;align-items:center;gap:3px}
.leg-d{width:7px;height:7px;border-radius:2px}
</style>
</head>
<body>

<div class="hdr">
  <h1>🚗 汽车零部件采购全流程 <em>整车研发里程碑对标 · 全角色全景图</em></h1>
  <div class="hdr-r" id="roleBar"></div>
</div>

<div class="wrap">
  <div class="ms-wrap">
    <div class="ms-bar" id="msBar"></div>
    <div class="ph-bar" id="phBar"></div>
  </div>
  <div class="sl-wrap" id="slWrap"></div>
  <div class="leg" id="leg"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const ROLES=[
  {id:'buy',n:'直采采购',i:'🛒',bg:'var(--bl)',c:'var(--bd)'},
  {id:'rd',n:'研发',i:'🔬',bg:'var(--cl)',c:'var(--cd)'},
  {id:'sqe',n:'SQE',i:'🛡️',bg:'var(--gl)',c:'var(--gd)'},
  {id:'fin',n:'财务',i:'💰',bg:'var(--al)',c:'var(--ad)'},
  {id:'log',n:'物流',i:'🚚',bg:'var(--ol)',c:'var(--od)'},
  {id:'pm',n:'项目管理',i:'📋',bg:'var(--pl)',c:'var(--pd)'},
  {id:'leg',n:'法务',i:'⚖️',bg:'var(--rl)',c:'var(--rd)'},
];

const PHASES=[
  {id:'concept',nm:'概念',sb:'产品定义',bg:'#64748b'},
  {id:'design',nm:'造型/工程',sb:'SOR·TR',bg:'#3b82f6'},
  {id:'sourcing',nm:'寻源定点',sb:'RFQ·定点',bg:'#f59e0b'},
  {id:'dev',nm:'开发验证',sb:'模具·DV/PV',bg:'#8b5cf6'},
  {id:'trial',nm:'试制',sb:'OTS·PPAP',bg:'#ec4899'},
  {id:'sop',nm:'SOP',sb:'量产启动',bg:'#10b981'},
  {id:'mass',nm:'量产',sb:'履约·降本',bg:'#10b981'},
  {id:'eop',nm:'EOP',sb:'停产退出',bg:'#6b7280'},
];

const MILESTONES=[
  {id:'S0',phase:'concept'},{id:'M0',phase:'design'},{id:'M4',phase:'sourcing'},
  {id:'M6E',phase:'dev'},{id:'M2',phase:'trial'},{id:'M1',phase:'sop'},
  {id:"M0'",phase:'mass'},{id:'EOP',phase:'eop'},
];

const LANES=[
  {id:'project',n:'项目线',sub:'PM',bg:'#fafbff',hbg:'#6366f1'},
  {id:'platform',n:'车型平台',sub:'R&D',bg:'#fefdf5',hbg:'#ca8a04'},
  {id:'cross',n:'跨部门：研发·CE',sub:'SQE+RD',bg:'#f0feff',hbg:'#0891b2'},
  {id:'procure',n:'采购',sub:'Buyer+Fin',bg:'#f0fdf4',hbg:'#16a34a'},
];

// All L2 groups with lane assignment
const DATA=[
  // ===== concept =====
  {phase:'concept',lane:'platform',nodes:[{t:'产品属性定义',cl:'b',roles:['rd']},{t:'产品选型',cl:'b',roles:['rd','buy']},{t:'车型采购策略',cl:'b',roles:['buy','fin']}]},
  {phase:'concept',lane:'procure',nodes:[{t:'邀请注册',cl:'g',roles:['buy']},{t:'NDA签署',cl:'r',roles:['leg','buy']},{t:'风险筛查',cl:'r',roles:['buy','fin']},{t:'进入供应商池',cl:'g',roles:['buy']}]},
  {phase:'concept',lane:'project',nodes:[{t:'EP项目创建',cl:'p',roles:['pm']},{t:'采购任务分发',cl:'p',roles:['pm']}]},
  // ===== design =====
  {phase:'design',lane:'cross',nodes:[{t:'SOR0编制',cl:'b',roles:['rd']},{t:'TR技术评审',cl:'r',roles:['rd']},{t:'SOR包发布',cl:'b',roles:['rd','buy']},{t:'EP技术文档发布',cl:'b',roles:['rd']}]},
  {phase:'design',lane:'procure',nodes:[{t:'RFQ发放',cl:'b',roles:['buy','rd']},{t:'报价收集',cl:'b',roles:['buy']},{t:'Should-cost分析',cl:'a',roles:['fin','buy']},{t:'商务谈判',cl:'b',roles:['buy','fin']},{t:'开发费确认',cl:'a',roles:['rd','buy','fin']}]},
  {phase:'design',lane:'procure',nodes:[{t:'入厂物流方案',cl:'o',roles:['log']},{t:'物流费测算',cl:'o',roles:['log','fin']},{t:'EP确认',cl:'o',roles:['log']}]},
  // ===== sourcing =====
  {phase:'sourcing',lane:'procure',nodes:[{t:'定点材料准备',cl:'b',roles:['buy','fin']},{t:'PSA评审',cl:'g',roles:['sqe']},{t:'QTR评审',cl:'g',roles:['sqe']},{t:'⭐ 定点决策会',cl:'r',roles:['buy','fin','rd','sqe','pm','log','leg'],star:true},{t:'EP定点审批',cl:'b',roles:['buy']}]},
  {phase:'sourcing',lane:'procure',nodes:[{t:'商务合同',cl:'b',roles:['buy','fin','leg']},{t:'框架协议',cl:'b',roles:['leg','buy']},{t:'质量协议',cl:'g',roles:['sqe']}]},
  {phase:'sourcing',lane:'cross',nodes:[{t:'ESI供应商选定',cl:'c',roles:['buy','rd']},{t:'技术协同',cl:'c',roles:['rd']}]},
  // ===== dev =====
  {phase:'dev',lane:'procure',nodes:[{t:'模具投资协议',cl:'b',roles:['buy','fin','sqe']},{t:'模具开发',cl:'g',roles:['sqe']},{t:'模具验收',cl:'g',roles:['sqe','fin']}]},
  {phase:'dev',lane:'cross',nodes:[{t:'DV设计验证',cl:'b',roles:['rd','sqe']},{t:'PFMEA/CP',cl:'g',roles:['sqe','rd']},{t:'供应商现场审核',cl:'g',roles:['sqe']},{t:'供应商培训',cl:'g',roles:['sqe']}]},
  {phase:'dev',lane:'cross',nodes:[{t:'样件需求申请',cl:'c',roles:['rd']},{t:'开发样件订单',cl:'c',roles:['buy','rd']},{t:'CWO协同',cl:'p',roles:['buy','sqe']}]},
  {phase:'dev',lane:'procure',nodes:[{t:'包装方案确认',cl:'o',roles:['log','sqe']}]},
  // ===== trial =====
  {phase:'trial',lane:'cross',nodes:[{t:'OTS样件提交',cl:'c',roles:['sqe','rd']},{t:'PPAP预审',cl:'g',roles:['sqe']},{t:'PPAP文件包(18项)',cl:'b',roles:['sqe','buy']},{t:'来料检验标准',cl:'g',roles:['sqe']}]},
  {phase:'trial',lane:'cross',nodes:[{t:'FAI首件检验',cl:'r',roles:['rd','sqe']},{t:'PT试生产',cl:'b',roles:['rd','sqe']},{t:'爬坡准备',cl:'g',roles:['sqe','buy']}]},
  // ===== sop =====
  {phase:'sop',lane:'project',nodes:[{t:'质量门审核',cl:'r',roles:['sqe','pm']},{t:'SOP批准',cl:'r',roles:['pm','sqe'],star:true},{t:'量产BOM冻结',cl:'b',roles:['rd','pm']},{t:'量产PO',cl:'b',roles:['buy','log']}]},
  // ===== mass =====
  {phase:'mass',lane:'procure',nodes:[{t:'供应商绩效(QCDS)',cl:'g',roles:['sqe','buy']},{t:'VAVE降本',cl:'a',roles:['buy','fin','rd']},{t:'月度成本对账',cl:'a',roles:['fin','buy']},{t:'客诉处理(8D)',cl:'r',roles:['sqe']},{t:'产能扩充',cl:'g',roles:['sqe','fin']}]},
  {phase:'mass',lane:'procure',nodes:[{t:'月度绩效评审',cl:'g',roles:['sqe','fin']},{t:'支付与结算',cl:'a',roles:['fin']},{t:'量产物流运营',cl:'o',roles:['log']}]},
  // ===== eop =====
  {phase:'eop',lane:'procure',nodes:[{t:'EOP通知(提前12月)',cl:'r',roles:['pm','buy']},{t:'剩余库存处置',cl:'b',roles:['buy','log']},{t:'模具处置',cl:'g',roles:['sqe','fin']},{t:'最终结算',cl:'a',roles:['fin','buy']},{t:'供应商退出',cl:'b',roles:['buy','sqe']},{t:'合同关闭',cl:'r',roles:['leg','buy','fin']}]},
];

let activeRole=null;

function render(){
  renderRoles();
  renderMs();
  renderPhases();
  renderLanes();
  renderLeg();
}

function renderRoles(){
  document.getElementById('roleBar').innerHTML=`<span style="font-size:9px;font-weight:700;color:rgba(255,255,255,.5);margin-right:2px">角色筛选</span>`+
    ROLES.map(r=>`<span class="role-chip${activeRole===r.id?' on active':''}" style="background:${r.bg};color:${r.c};${activeRole===r.id?'border-color:'+r.c.replace('var(--','var(--').replace(')','')+'':''}" onclick="setRole('${r.id}')">${r.i} ${r.n}</span>`).join(' ');
}

function renderMs(){
  document.getElementById('msBar').innerHTML=
    `<div class="ms-bar-label">研发里程碑</div><div class="ms-bar-items">`+
    MILESTONES.map(m=>`<div class="ms-bar-item"><span class="d"></span>${m.id}</div>`).join('')+`</div>`;
}

function renderPhases(){
  document.getElementById('phBar').innerHTML=
    `<div class="ph-bar-label">采购阶段</div><div class="ph-bar-items">`+
    PHASES.map(p=>`<div class="ph-bar-item" style="background:${p.bg}">${p.nm}<small>${p.sb}</small></div>`).join('')+`</div>`;
}

function renderLanes(){
  const wrap=document.getElementById('slWrap');
  // Build a map: phase -> lane -> [nodes]
  const map={};
  PHASES.forEach(p=>{map[p.id]={};LANES.forEach(l=>{map[p.id][l.id]=[];});});
  DATA.forEach(d=>{
    if(map[d.phase]&&map[d.phase][d.lane]) map[d.phase][d.lane].push(...d.nodes);
  });

  // Determine which phase column to light
  let litPhase=null;
  if(activeRole){
    for(const d of DATA){
      if(d.nodes.some(n=>n.roles.includes(activeRole))){litPhase=d.phase;break;}
    }
  }

  let h='';
  LANES.forEach(lane=>{
    let cls='sl';
    if(activeRole){
      // Check if this lane has any node with the active role
      const hasRole=DATA.some(d=>d.lane===lane.id&&d.nodes.some(n=>n.roles.includes(activeRole)));
      if(!hasRole) cls+=' dim';
    }

    const cols=PHASES.map(p=>{
      const nodes=map[p.id][lane.id];
      const lit=litPhase===p.id;
      const nodesHtml=nodes.map(n=>{
        let nc='nd '+n.cl;if(n.star)nc+=' star';
        if(activeRole){
          if(n.roles.includes(activeRole))nc+=' hl';
          else nc+=' dm';
        }
        return `<div class="${nc}" onmouseenter="showTip(event,${JSON.stringify({t:n.t,roles:n.roles,star:n.star}).replace(/"/g,'&quot;')})" onmouseleave="hideTip()">${n.star?'★ ':''}${n.t}</div>`;
      }).join('');
      return `<div class="col${lit?' lit':''}">${nodesHtml}</div>`;
    }).join('');

    h+=`<div class="${cls}" style="background:${lane.bg}">
      <div class="sl-hdr" style="background:${lane.hbg}">${lane.n}<small>${lane.sub}</small></div>
      <div class="sl-body">${cols}</div>
    </div>`;
  });
  wrap.innerHTML=h;
}

function renderLeg(){
  document.getElementById('leg').innerHTML=`<span style="font-weight:700;color:var(--t1)">图例</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--blue)"></span>采购/流程</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--cyan)"></span>研发/技术</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--green)"></span>SQE/质量</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--amber)"></span>财务/成本</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--orange)"></span>物流</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--purple)"></span>PMO/系统</span>
    <span class="leg-i"><span class="leg-d" style="background:var(--red)"></span>法务/决策</span>
    <span class="leg-i" style="border-left:1px solid var(--bdr);padding-left:6px"><span style="font-size:11px">★</span> 关键里程碑</span>`;
}

function setRole(id){activeRole=activeRole===id?null:id;render();}

function showTip(e,n){
  const tip=document.getElementById('tip');
  const rs=n.roles.map(rid=>{const r=ROLES.find(rr=>rr.id===rid);return r?`<span style="display:inline-block;padding:1px 4px;border-radius:4px;font-size:7px;font-weight:700;background:${r.bg};color:${r.c};margin-right:1px">${r.i} ${r.n}</span>`:''}).join('');
  tip.innerHTML=`<div class="tip-t">${n.star?'★ ':''}${n.t}</div><div class="tip-r">${rs}</div>`;
  const rect=e.target.getBoundingClientRect();
  let left=rect.right+6,top=rect.top-6;
  if(left+270>window.innerWidth)left=rect.left-270-6;
  if(top+100>window.innerHeight)top=window.innerHeight-110;
  if(top<8)top=8;
  tip.style.left=left+'px';tip.style.top=top+'px';tip.classList.add('show');
}
function hideTip(){document.getElementById('tip').classList.remove('show')}

render();
</script>
</body>
</html>
