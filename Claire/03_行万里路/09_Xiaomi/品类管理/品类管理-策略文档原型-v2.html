<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>品类管理 - 小米汽车供应链协同平台</title>
  <style>
    :root {
      --accent: #1677ff;
      --accent-hover: #4096ff;
      --accent-soft: #eaf2ff;
      --accent-soft-2: #dbeafe;
      --accent-border: #cfe0ff;
      --nav: #0f172a;

      --bg: #f6f7f9;
      --surface: #ffffff;
      --border: #e6e8eb;
      --border-strong: #d8dbdf;
      --text: #111827;
      --text-2: #5b6471;
      --text-3: #9aa1ab;

      --success: #16a34a;

      --r-sm: 6px;
      --r: 8px;
      --r-lg: 12px;
      --r-pill: 999px;

      --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
      --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--bg); font-size: 14px; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); text-decoration: none; cursor: pointer; }
    a:hover { color: var(--accent-hover); }
    button { font-family: inherit; cursor: pointer; border: none; }
    ::selection { background: var(--accent-soft); }

    .top-nav { height: 56px; background: var(--nav); display: flex; align-items: center; padding: 0 28px; color: #fff; position: sticky; top: 0; z-index: 200; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 600; margin-right: 44px; white-space: nowrap; letter-spacing: .2px; }
    .brand-logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#ff8a4c,#fa541c); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
    .top-menu { display: flex; gap: 26px; height: 100%; align-items: center; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .top-menu::-webkit-scrollbar { display: none; }
    .top-menu-item { color: rgba(255,255,255,.7); font-size: 13px; white-space: nowrap; cursor: pointer; height: 100%; display: flex; align-items: center; border-bottom: 2px solid transparent; padding: 0 2px; transition: color .15s; }
    .top-menu-item:hover { color: #fff; }
    .top-menu-item.active { color: #fff; border-bottom-color: var(--accent); }
    .user-info { color: rgba(255,255,255,.85); font-size: 13px; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .user-info .avatar { width: 26px; height: 26px; border-radius: 50%; background: #2f54eb; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }

    .page { padding: 24px 32px 40px; }

    .breadcrumb { font-size: 12.5px; color: var(--text-3); margin-bottom: 14px; }
    .breadcrumb b { color: var(--text-2); font-weight: 500; }
    .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 16px; flex-wrap: wrap; }
    .page-title { font-size: 20px; font-weight: 650; letter-spacing: .2px; display: flex; align-items: center; gap: 11px; }
    .chip { font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-border); padding: 3px 11px; border-radius: var(--r-pill); }
    .head-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r); font-size: 13px; line-height: 1; transition: background .18s, border-color .18s, transform .08s, box-shadow .18s, color .15s; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(22,119,255,.3); }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 10px rgba(22,119,255,.28); }
    .btn-default { background: #fff; color: var(--text); border: 1px solid var(--border-strong); }
    .btn-default:hover { border-color: var(--accent); color: var(--accent); }

    /* 方案切换 segmented */
    .plan-switch { display: inline-flex; background: #eef1f5; border: 1px solid var(--border-strong); border-radius: var(--r-pill); padding: 3px; gap: 2px; }
    .plan-opt { padding: 7px 16px; border-radius: var(--r-pill); font-size: 13px; color: var(--text-2); background: transparent; transition: background .15s, color .15s, box-shadow .15s; white-space: nowrap; }
    .plan-opt.active { background: #fff; color: var(--accent); font-weight: 600; box-shadow: var(--shadow-sm); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow-sm); }
    .stat .label { font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
    .stat .label .dot { width: 8px; height: 8px; border-radius: 2px; }
    .stat .value { font-size: 24px; font-weight: 650; letter-spacing: .3px; }
    .stat .value small { font-size: 13px; font-weight: 500; color: var(--text-3); margin-left: 4px; }
    .stat .sub { font-size: 12px; color: var(--text-3); margin-top: 6px; }
    .stat .bar { height: 5px; border-radius: var(--r-pill); background: #eef1f5; margin-top: 9px; overflow: hidden; }
    .stat .bar > i { display: block; height: 100%; border-radius: var(--r-pill); }

    .stats-title { font-size: 12.5px; color: var(--text-2); margin: 4px 0 10px; font-weight: 600; letter-spacing: .3px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }

    .filter-bar { padding: 20px 22px 18px; display: flex; flex-wrap: wrap; gap: 16px 18px; align-items: flex-end; }
    .filter-item { display: flex; flex-direction: column; gap: 6px; }
    .filter-item label { color: var(--text-2); font-size: 12px; font-weight: 500; }
    .filter-item input, .filter-item select { height: 34px; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 0 10px; font-size: 13px; min-width: 150px; outline: none; background: #fff; color: var(--text); transition: border-color .15s, box-shadow .15s; }
    .filter-item input:focus, .filter-item select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22,119,255,.12); }
    .filter-actions { display: flex; gap: 10px; margin-left: auto; }

    .toolbar { padding: 13px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; transition: background .2s; }
    .toolbar.has-selection { background: linear-gradient(0deg, var(--accent-soft), #fff 60%); }
    .toolbar.has-selection .btn-default { border-color: var(--accent-border); color: var(--accent); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1180px; }
    th, td { padding: 13px 16px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: #fafbfc; color: var(--text-2); font-weight: 500; font-size: 12px; letter-spacing: .3px; position: sticky; top: 56px; z-index: 30; border-bottom: 1px solid var(--border-strong); }
    tbody tr { transition: background .12s; cursor: pointer; }
    tbody tr:hover td { background: #f3f7ff; }
    tbody tr.selected td { background: var(--accent-soft); }
    tbody tr.selected:hover td { background: var(--accent-soft-2); }
    tbody tr:hover td.sticky-col { background: #fff; }
    tbody tr.selected td.sticky-col { background: var(--accent-soft); }
    tbody tr.selected:hover td.sticky-col { background: var(--accent-soft-2); }
    .sticky-col { position: sticky; left: 0; z-index: 20; background: var(--surface); }
    th.sticky-col { z-index: 40; background: #fafbfc; }
    .col-strategy { min-width: 150px; }

    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--success); font-weight: 500; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.draft { color: var(--text-3); }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill { background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: var(--r-sm); font-size: 12px; line-height: 1.5; border: 1px solid var(--accent-border); }
    .tag-more { background: #f1f2f4; color: var(--text-2); padding: 3px 9px; border-radius: var(--r-sm); font-size: 12px; cursor: default; }

    .ops { display: flex; gap: 14px; white-space: nowrap; }
    .ops a { color: var(--accent); }
    .ops a.danger { color: #ef4444; }

    .checkbox { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

    .empty-hint { color: var(--text-3); font-size: 12.5px; }

    /* 方案A：单元格文档 chips（无"N个文档"字样） */
    .doc-cell { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; cursor: pointer; }
    .doc-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 4px 9px 4px 7px; font-size: 12px; color: var(--text); max-width: 100%; transition: border-color .15s, background .15s, box-shadow .15s; }
    .doc-chip:hover { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 1px 4px rgba(22,119,255,.12); }
    .doc-chip .doc-ic { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 9px; font-weight: 700; }
    .doc-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
    .doc-more { display: inline-flex; align-items: center; background: #eef1f5; color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 4px 8px; font-size: 12px; transition: background .15s, color .15s; }
    .doc-more:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .doc-add { display: inline-flex; align-items: center; gap: 4px; background: #fafdff; color: var(--accent); border: 1px dashed var(--accent-border); border-radius: var(--r-sm); padding: 4px 10px; font-size: 12px; transition: background .15s, border-color .15s; }
    .doc-add:hover { background: var(--accent-soft); border-color: var(--accent); }

    .pagination { padding: 15px 22px; display: flex; align-items: center; justify-content: space-between; color: var(--text-2); font-size: 13px; flex-wrap: wrap; gap: 12px; }
    .pager { display: flex; gap: 6px; align-items: center; }
    .pager button { min-width: 30px; height: 30px; border: 1px solid var(--border-strong); background: #fff; border-radius: var(--r); color: var(--text-2); transition: border-color .15s, color .15s; }
    .pager button:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    .pager button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pager select { height: 30px; border: 1px solid var(--border-strong); border-radius: var(--r); margin-left: 8px; padding: 0 6px; color: var(--text-2); background: #fff; }

    .sel-count { font-weight: 600; color: var(--accent); }

    .tip { font-size: 12.5px; color: var(--text-2); margin-bottom: 16px; display: flex; align-items: center; gap: 7px; background: var(--accent-soft); border: 1px solid var(--accent-border); padding: 9px 14px; border-radius: var(--r); }
    .tip svg { color: var(--accent); flex-shrink: 0; }

    /* 详情抽屉 */
    .drawer-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 300; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
    .drawer-mask.open { opacity: 1; visibility: visible; }
    .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 480px; max-width: 92vw; background: #fff; z-index: 310; box-shadow: -12px 0 40px rgba(15,23,42,.18); transform: translateX(100%); transition: transform .24s cubic-bezier(.32,.72,0,1); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .drawer-head .dh-title { font-size: 16px; font-weight: 650; }
    .drawer-head .dh-sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .drawer-close { width: 30px; height: 30px; border-radius: var(--r); color: var(--text-2); background: #f1f3f5; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; transition: background .15s, color .15s; }
    .drawer-close:hover { background: #e6e9ed; color: var(--text); }
    .drawer-tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--border); }
    .drawer-tab { padding: 12px 14px; font-size: 13px; color: var(--text-2); background: transparent; position: relative; transition: color .15s; }
    .drawer-tab:hover { color: var(--accent); }
    .drawer-tab.active { color: var(--accent); font-weight: 600; }
    .drawer-tab.active::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 28px; }

    /* 基础信息表单 */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
    .form-item { display: flex; flex-direction: column; gap: 5px; }
    .form-item.full { grid-column: 1 / -1; }
    .form-item label { font-size: 12px; color: var(--text-3); }
    .form-item .val { font-size: 13.5px; color: var(--text); padding: 7px 10px; background: #fafbfc; border: 1px solid var(--border); border-radius: var(--r-sm); min-height: 34px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }

    /* 品类策略页签 */
    .strat-group { border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; }
    .strat-group-head { display: flex; align-items: center; gap: 9px; padding: 12px 14px; background: #fafbfc; border-bottom: 1px solid var(--border); }
    .sg-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .sg-name { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .sg-count { font-size: 12px; color: var(--text-3); background: #eef1f5; border-radius: var(--r-pill); padding: 1px 9px; }
    .sg-add { margin-left: auto; font-size: 12.5px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: var(--r-sm); padding: 5px 12px; transition: background .15s, border-color .15s; }
    .sg-add:hover { background: #dcebff; border-color: var(--accent); }
    .strat-group-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
    .doc-card { display: flex; align-items: center; gap: 11px; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 9px 11px; transition: border-color .15s, box-shadow .15s; }
    .doc-card:hover { border-color: var(--accent-border); box-shadow: var(--shadow-sm); }
    .doc-card .doc-ic { width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .doc-main { flex: 1; min-width: 0; }
    .doc-name { font-size: 13px; color: var(--text); font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-name:hover { color: var(--accent); }
    .doc-meta { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
    .doc-del { width: 24px; height: 24px; border-radius: var(--r-sm); color: var(--text-3); background: transparent; font-size: 16px; flex-shrink: 0; transition: background .15s, color .15s; }
    .doc-del:hover { background: #fdeaea; color: #ef4444; }
    .sg-addrow { display: none; align-items: center; gap: 8px; padding: 0 14px 12px; }
    .sg-addrow.show { display: flex; }
    .sg-addrow input { flex: 1; height: 32px; border: 1px solid var(--accent); border-radius: var(--r); padding: 0 10px; font-size: 12.5px; outline: none; }
    .sg-addrow input:focus { box-shadow: 0 0 0 3px rgba(22,119,255,.12); }
    .sg-addrow .btn-xs { padding: 6px 12px; font-size: 12.5px; border-radius: var(--r); flex-shrink: 0; }
    .parse-loading { font-size: 12px; color: var(--text-3); padding: 0 14px 12px; display: none; align-items: center; gap: 7px; }
    .parse-loading.show { display: flex; }
    .spin { width: 13px; height: 13px; border: 2px solid var(--accent-border); border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }

    @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } .form-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="top-nav">
    <div class="brand"><div class="brand-logo">MI</div><span>小米汽车</span></div>
    <div class="top-menu">
      <div class="top-menu-item">首页</div>
      <div class="top-menu-item">个人中心</div>
      <div class="top-menu-item active">品类管理</div>
      <div class="top-menu-item">采购供应商管理</div>
      <div class="top-menu-item">SCM管理</div>
      <div class="top-menu-item">采购任务管理</div>
      <div class="top-menu-item">价格管理</div>
      <div class="top-menu-item">合同管理</div>
      <div class="top-menu-item">订单管理</div>
      <div class="top-menu-item">文档管理</div>
      <div class="top-menu-item">基础数据管理</div>
      <div class="top-menu-item">采购需求导入</div>
      <div class="top-menu-item">样件费用管理</div>
      <div class="top-menu-item">售后成本管理</div>
      <div class="top-menu-item">供应商管理</div>
    </div>
    <div class="user-info"><span class="avatar">齐</span>齐岳 <span>▾</span></div>
  </div>

  <div class="page">
    <div class="breadcrumb">首页 / <b>品类管理</b></div>

    <div class="page-head">
      <div class="page-title">品类管理 <span class="chip">VIP节点品类库</span></div>
      <div class="head-right">
        <div class="plan-switch" id="planSwitch">
          <button class="plan-opt active" data-plan="A">方案A · 列内展示</button>
          <button class="plan-opt" data-plan="B">方案B · 详情Tab</button>
        </div>
        <button class="btn btn-primary">+ 新增品类</button>
      </div>
    </div>

    <div class="stats" id="statRow1"></div>

    <div class="stats-title">策略文档覆盖</div>
    <div class="stats" id="statRow2"></div>

    <div class="card">
      <div class="filter-bar">
        <div class="filter-item"><label>品类编码</label><input placeholder="请输入" /></div>
        <div class="filter-item"><label>品类名称</label><input placeholder="请输入" /></div>
        <div class="filter-item"><label>VIP节点</label><select><option>请选择</option></select></div>
        <div class="filter-item"><label>品类专家</label><select><option>请选择</option></select></div>
        <div class="filter-item"><label>SQE工程师</label><select><option>请选择</option></select></div>
        <div class="filter-item"><label>采购工程师</label><select><option>请选择</option></select></div>
        <div class="filter-item"><label>财务CE</label><select><option>请选择</option></select></div>
        <div class="filter-item"><label>专业组</label><select><option>请选择</option></select></div>
        <div class="filter-actions">
          <button class="btn btn-default">重置</button>
          <button class="btn btn-primary">查询</button>
        </div>
      </div>
    </div>

    <div class="tip" id="planTip">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span id="planTipText"></span>
    </div>

    <div class="card">
      <div class="toolbar" id="toolbar">
        <button class="btn btn-default">批量导入</button>
        <button class="btn btn-default">导出</button>
        <button class="btn btn-default">转派</button>
        <button class="btn btn-default">冻结</button>
        <button class="btn btn-default">批量编辑</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <div><span class="sel-count" id="selCount">已选 0 条</span> &nbsp; 共 <span id="totalCount">0</span> 条</div>
        <div class="pager">
          <button>&lt;</button>
          <button class="active">1</button>
          <button>2</button>
          <button>3</button>
          <button>&gt;</button>
          <select><option>100 条/页</option><option>50 条/页</option><option>20 条/页</option></select>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情抽屉 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="dh-title" id="drawerTitle"></div>
        <div class="dh-sub" id="drawerSub"></div>
      </div>
      <button class="drawer-close" id="drawerClose">×</button>
    </div>
    <div class="drawer-tabs" id="drawerTabs">
      <button class="drawer-tab active" data-tab="base">基础信息</button>
      <button class="drawer-tab" data-tab="strategy">品类策略</button>
    </div>

    // 演示用：按飞书链接 token 解析真实文档名（正式环境由后端对接飞书 OpenAPI 返回标题）

      v1: '价值穿透基线', v9: '前围横梁价值穿透', v10: '发动机价值穿透',
      c1: '品类策略V1', c2: '品类策略V2', c4: '品类策略补充', c10: '增程品类策略',
      doc1: '悬架品类策略', plat_doc: '平台策略基线',
    };

    function L(type, name, url, owner, updated) {
      return { type: type, name: name, url: url, owner: owner || '齐岳', updated: updated || '2026-08-12' };
    }

    const rows = [
      { code: 'CAT-00052', name: '测试0788171', expert: '杨亚东', status: '生效', group: '焊接与热管理', materials: ['ALLOY STEEL 低合金钢'], crafts: ['注塑','激光焊接'], supplier: '/', note: '测试1', links: { cat: [], plat: [], tech: [], value: [] } },
      { code: 'CAT-00051', name: '测试07878', expert: '张宁', status: '生效', group: '焊接与热管理', materials: ['CARBON STEEL 碳钢','BAO宝钢股份'], crafts: ['/'], supplier: '/', note: '测试2', links: { cat: [L('docx','飞书云文档1','https://mi.feishu.cn/docx/cat1','杨亚东','2026-08-10')], plat: [], tech: [], value: [] } },
      { code: 'CAT-00050', name: '减振垫', expert: '陈彦锡', status: '已冻结', group: '电子架构', materials: ['ALLOY STEEL 低合金钢','ALUMINUM 铝合金'], crafts: ['/'], supplier: '/', note: '测试3', links: { cat: [L('docx','飞书云文档2','https://mi.feishu.cn/docx/cat2','陈彦锡','2026-08-09')], plat: [L('docx','飞书云文档3','https://mi.feishu.cn/docx/plat3','陈彦锡','2026-08-08')], tech: [], value: [] } },
      { code: 'CAT-00049', name: '测试07880', expert: '陈彦锡', status: '生效', group: '机械架构', materials: ['CARBON STEEL 碳钢'], crafts: ['/'], supplier: '/', note: '测试4', links: { cat: [], plat: [], tech: [], value: [] } },
      { code: 'CAT-00048', name: '测试07881', expert: '陈彦锡', status: '生效', group: '机械架构', materials: ['CARBON STEEL 碳钢'], crafts: ['/'], supplier: '/', note: '测试5', links: { cat: [L('docx','品类策略V1','https://mi.feishu.cn/docx/c1','陈彦锡','2026-08-11'),L('docx','品类策略V2','https://mi.feishu.cn/docx/c2','陈彦锡','2026-08-13')], plat: [L('docx','平台策略','https://mi.feishu.cn/docx/p1','陈彦锡','2026-08-07')], tech: [L('sheet','技术方案','https://mi.feishu.cn/docx/t1','李文婷','2026-08-06'),L('sheet','技术方案补充','https://mi.feishu.cn/docx/t2','李文婷','2026-08-09')], value: [L('base','价值穿透','https://mi.feishu.cn/docx/v1','杨亚东','2026-08-05')] } },
      { code: 'CAT-00047', name: '电容', expert: '陈彦锡', status: '生效', group: '电子架构', materials: ['/'], crafts: ['/'], supplier: '/', note: '测试6', links: { cat: [], plat: [], tech: [], value: [] } },
      { code: 'CAT-00046', name: '充电插座', expert: '陈彦锡', status: '生效', group: '电子架构', materials: ['/'], crafts: ['/'], supplier: '/', note: '测试7', links: { cat: [], plat: [], tech: [L('sheet','技术方案','https://mi.feishu.cn/docx/t7','李文婷','2026-08-03')], value: [] } },
      { code: 'CAT-00045', name: '热成型', expert: '陈彦锡', status: '生效', group: '电子架构', materials: ['/'], crafts: ['/'], supplier: '/', note: '测试8', links: { cat: [], plat: [], tech: [], value: [] } },
      { code: 'CAT-00044', name: '前围横梁', expert: '陈彦锡', status: '生效', group: '电子架构', materials: ['/'], crafts: ['/'], supplier: '/', note: '测试9', links: { cat: [L('docx','飞书云文档4','https://mi.feishu.cn/docx/c4','杨亚东','2026-08-04')], plat: [], tech: [], value: [L('base','价值穿透','https://mi.feishu.cn/docx/v9','杨亚东','2026-08-02')] } },
      { code: 'CAT-00043', name: '发动机总成', expert: '李文婷', status: '生效', group: 'XEDL', materials: ['POWDERED METAL 粉末冶金','不锈钢'], crafts: ['冲压','激光切割'], supplier: '增程器', note: '测试10', links: { cat: [L('docx','品类策略','https://mi.feishu.cn/docx/c10','李文婷','2026-08-01')], plat: [L('docx','平台策略','https://mi.feishu.cn/docx/p10','李文婷','2026-07-30')], tech: [L('sheet','技术方案','https://mi.feishu.cn/docx/t10','文飞','2026-07-29')], value: [L('base','价值穿透','https://mi.feishu.cn/docx/v10','杨亚东','2026-07-28')] } },
    ];

    let PLAN = 'A';
    let drawerState = { rowIdx: -1, tab: 'base' };

    function fileSvg(w, h) {
      w = w || 13; h = h || 13;
      return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
    }
    function parseName(url, col) {
      const m = (url || '').match(/([A-Za-z0-9_\-]+)\/?$/);
      const tok = m ? m[1] : '';
      if (NAME_MAP[tok]) return NAME_MAP[tok];
      const label = STRAT.find(s => s.key === col).label;
      return label + '文档';
    }
    function parseType(url) {
      if (/sheet|bitable|multi/i.test(url)) return 'sheet';
      if (/base|wiki/i.test(url)) return 'base';
      if (/\.docx|\/docx\/|doc\/|drive/i.test(url)) return 'docx';
      return 'docx';
    }

    /* ---------- 顶部统计卡片 ---------- */
    function computeCategoryStats() {
      const total = rows.length;
      const active = rows.filter(r => r.status === '生效').length;
      const frozen = rows.filter(r => r.status === '已冻结').length;
      const pending = STRAT.reduce((acc, s) => acc + (rows.filter(r => r.links[s.key].length === 0).length), 0);
      return { total, active, frozen, pending };
    }
    function computeStrategyStats() {
      return STRAT.map(s => {
        const total = rows.reduce((a, r) => a + r.links[s.key].length, 0);
        const cover = rows.filter(r => r.links[s.key].length > 0).length;
        return { ...s, total, cover };
      });
    }
    function renderStatCards() {
      const c = computeCategoryStats();
      const catCards = [
        { label: '品类总数', value: c.total, unit: '个', sub: 'VIP节点品类库' },
        { label: '生效中', value: c.active, unit: '个', sub: '占比 ' + Math.round(c.active / c.total * 100) + '%' },
        { label: '已冻结', value: c.frozen, unit: '个', sub: '需关注解冻' },
        { label: '待完善策略', value: c.pending, unit: '个', sub: '含空策略品类×' + STRAT.length + '维' },
      ];
      document.getElementById('statRow1').innerHTML = catCards.map(k => `
        <div class="stat">
          <div class="label">${k.label}</div>
          <div class="value">${k.value}<small>${k.unit}</small></div>
          <div class="sub">${k.sub}</div>
        </div>`).join('');

      const s = computeStrategyStats();
      document.getElementById('statRow2').innerHTML = s.map(k => {
        const pct = Math.round(k.cover / rows.length * 100);
        return `
        <div class="stat">
          <div class="label"><span class="dot" style="background:${k.color}"></span>${k.label}</div>
          <div class="value">${k.total}<small>份</small></div>
          <div class="sub">覆盖 ${k.cover}/${rows.length} 品类 · ${pct}%</div>
          <div class="bar"><i style="width:${pct}%;background:${k.color}"></i></div>
        </div>`;
      }).join('');
    }

    /* ---------- 表格 ---------- */
    function renderTags(arr) {
      if (!arr || arr.length === 0 || arr[0] === '/') return '<span class="empty-hint">/</span>';
      const visible = arr.slice(0, 2);
      const more = arr.length > 2 ? `<span class="tag-more">+${arr.length - 2}</span>` : '';
      return `<div class="tags">${visible.map(t => `<span class="tag-pill">${t}</span>`).join('')}${more}</div>`;
    }
    function renderPlanACell(links, rowIdx, col) {
      if (!links.length) {
        return `<div class="doc-cell" data-row="${rowIdx}" data-col="${col}"><button class="doc-add" data-row="${rowIdx}" data-col="${col}">+ 添加</button></div>`;
      }
      const shown = links.slice(0, 2);
      const extra = links.length - shown.length;
      const chips = shown.map(d => {
        const t = DOC_TYPE[d.type] || DOC_TYPE.file;
        return `<span class="doc-chip" data-row="${rowIdx}" data-col="${col}"><span class="doc-ic" style="background:${t.bg};color:${t.color}">${t.label[0]}</span><span class="nm" title="${d.name}">${d.name}</span></span>`;
      }).join('');
      const more = extra > 0 ? `<button class="doc-more" data-row="${rowIdx}" data-col="${col}">+${extra}</button>` : '';
      return `<div class="doc-cell" data-row="${rowIdx}" data-col="${col}">${chips}${more}</div>`;
    }
    function renderTable() {
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tableBody');
      const headCols = [
        '<th class="sticky-col" style="width:42px"><input type="checkbox" class="checkbox" id="checkAll" /></th>',
        '<th class="sticky-col">品类编码</th>',
        '<th>品类名称</th>',
        '<th>品类专家</th>',
        '<th>品类状态</th>',
        '<th>专业组</th>',
        '<th>材料品类</th>',
        '<th>工艺品类</th>',
        '<th>定点供应商</th>',
      ];
      if (PLAN === 'A') {
        STRAT.forEach(s => headCols.push(`<th class="col-strategy">${s.label}</th>`));
      }
      headCols.push('<th>品质备注/说明</th>');
      headCols.push('<th style="width:128px">操作</th>');
      thead.innerHTML = '<tr>' + headCols.join('') + '</tr>';

      tbody.innerHTML = rows.map((r, i) => {
        const stratCols = PLAN === 'A'
          ? STRAT.map(s => `<td class="col-strategy">${renderPlanACell(r.links[s.key], i, s.key)}</td>`).join('')
          : '';
        const ops = PLAN === 'A'
          ? `<a data-edit="${i}">编辑</a><a data-strat="${i}">品类策略</a><a>变更记录</a>`
          : `<a data-edit="${i}">编辑</a><a data-strat="${i}">品类策略</a><a>变更记录</a>`;
        return `<tr>
          <td class="sticky-col"><input type="checkbox" class="checkbox row-check" /></td>
          <td class="sticky-col">${r.code}</td>
          <td>${r.name}</td>
          <td>${r.expert}</td>
          <td><span class="status ${r.status === '已冻结' ? 'draft' : ''}">${r.status}</span></td>
          <td>${r.group}</td>
          <td>${renderTags(r.materials)}</td>
          <td>${renderTags(r.crafts)}</td>
          <td>${r.supplier || '<span class="empty-hint">/</span>'}</td>
          ${stratCols}
          <td>${r.note}</td>
          <td class="ops">${ops}</td>
        </tr>`;
      }).join('');

      const ca = document.getElementById('checkAll');
      if (ca) ca.addEventListener('change', onCheckAll);
      document.getElementById('totalCount').textContent = rows.length;
      updateSelection();
    }

    /* ---------- 选择 ---------- */
    const tbody = document.getElementById('tableBody');
    const toolbar = document.getElementById('toolbar');
    const selCount = document.getElementById('selCount');
    function updateSelection() {
      const boxes = [...tbody.querySelectorAll('.row-check')];
      const checked = boxes.filter(b => b.checked).length;
      const total = boxes.length;
      const ca = document.getElementById('checkAll');
      if (ca) { ca.checked = total > 0 && checked === total; ca.indeterminate = checked > 0 && checked < total; }
      selCount.textContent = `已选 ${checked} 条`;
      toolbar.classList.toggle('has-selection', checked > 0);
    }
    function onCheckAll(e) {
      const all = e.target.checked;
      tbody.querySelectorAll('.row-check').forEach(cb => {
        cb.checked = all;
        cb.closest('tr').classList.toggle('selected', all);
      });
      updateSelection();
    }
    tbody.addEventListener('change', e => {
      const cb = e.target;
      if (!cb.classList.contains('row-check')) return;
      cb.closest('tr').classList.toggle('selected', cb.checked);
      updateSelection();
    });
    tbody.addEventListener('click', e => {
      const t = e.target;
      if (t.closest('a')) return;
      if (t.classList.contains('row-check')) return;
      if (t.closest('.doc-cell')) return;
      const tr = t.closest('tr');
      if (!tr) return;
      const cb = tr.querySelector('.row-check');
      if (!cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });

    /* ---------- 单元格 / 操作点击（事件委托） ---------- */
    document.getElementById('tableBody').addEventListener('click', e => {
      const t = e.target;
      const cell = t.closest('.doc-cell');
      const editLink = t.closest('a[data-edit]');
      const stratLink = t.closest('a[data-strat]');
      if (cell) { openDrawer(parseInt(cell.dataset.row, 10), 'strategy', cell.dataset.col); return; }
      if (editLink) { openDrawer(parseInt(editLink.dataset.edit, 10), 'base'); return; }
      if (stratLink) { openDrawer(parseInt(stratLink.dataset.strat, 10), 'strategy'); return; }
    });

    /* ---------- 抽屉 ---------- */
    const drawer = document.getElementById('drawer');
    const drawerMask = document.getElementById('drawerMask');
    function openDrawer(rowIdx, tab, focusCol) {
      drawerState = { rowIdx, tab: tab || 'base' };
      const r = rows[rowIdx];
      document.getElementById('drawerTitle').textContent = r.name;
      document.getElementById('drawerSub').textContent = r.code + ' · ' + r.group + ' · ' + r.status;
      [...document.querySelectorAll('.drawer-tab')].forEach(b => b.classList.toggle('active', b.dataset.tab === drawerState.tab));
      renderDrawerBody();
      drawerMask.classList.add('open');
      drawer.classList.add('open');
      if (focusCol) {
        const addBtn = document.querySelector('.sg-add[data-col="' + focusCol + '"]');
        if (addBtn) addBtn.click();
      }
    }
    function closeDrawer() {
      drawerMask.classList.remove('open');
      drawer.classList.remove('open');
      drawerState = { rowIdx: -1, tab: 'base' };
    }
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    drawerMask.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
    document.getElementById('drawerTabs').addEventListener('click', e => {
      const b = e.target.closest('.drawer-tab');
      if (!b) return;
      drawerState.tab = b.dataset.tab;
      [...document.querySelectorAll('.drawer-tab')].forEach(x => x.classList.toggle('active', x.dataset.tab === b.dataset.tab));
      renderDrawerBody();
    });

    function renderDrawerBody() {
      if (drawerState.rowIdx < 0) return;
      const body = document.getElementById('drawerBody');
      body.innerHTML = drawerState.tab === 'base' ? renderBaseInfo(drawerState.rowIdx) : renderStrategyTab(drawerState.rowIdx);
    }
    function renderBaseInfo(rowIdx) {
      const r = rows[rowIdx];
      const item = (label, val, full) => `<div class="form-item${full ? ' full' : ''}"><label>${label}</label><div class="val">${val}</div></div>`;
      return `<div class="form-grid">
        ${item('品类编码', r.code)}
        ${item('品类名称', r.name)}
        ${item('品类专家', r.expert)}
        ${item('品类状态', r.status)}
        ${item('专业组', r.group)}
        ${item('定点供应商', r.supplier || '/')}
        ${item('材料品类', renderTags(r.materials))}
        ${item('工艺品类', renderTags(r.crafts))}
        ${item('品质备注/说明', r.note, true)}
      </div>`;
    }
    function renderStrategyTab(rowIdx) {
      const r = rows[rowIdx];
      return STRAT.map(s => {
        const docs = r.links[s.key];
        const cards = docs.length
          ? docs.map((d, idx) => {
              const t = DOC_TYPE[d.type] || DOC_TYPE.file;
              return `<div class="doc-card">
                <span class="doc-ic" style="background:${t.bg};color:${t.color}">${fileSvg(15, 15)}</span>
                <div class="doc-main">
                  <a class="doc-name" href="${d.url}" target="_blank" rel="noopener" title="${d.url}">${d.name}</a>
                  <div class="doc-meta">${t.label} · ${d.owner} · ${d.updated}</div>
                </div>
                <button class="doc-del" data-row="${rowIdx}" data-col="${s.key}" data-idx="${idx}" title="删除">×</button>
              </div>`;
            }).join('')
          : '<div class="empty-hint">暂无文档，点击下方「添加」粘贴飞书链接</div>';
        return `<div class="strat-group" data-col="${s.key}">
          <div class="strat-group-head">
            <span class="sg-dot" style="background:${s.color}"></span>
            <span class="sg-name">${s.label}</span>
            <span class="sg-count">${docs.length}</span>
            <button class="sg-add" data-row="${rowIdx}" data-col="${s.key}">+ 添加</button>
          </div>
          <div class="strat-group-body">${cards}</div>
          <div class="parse-loading" data-col="${s.key}"><span class="spin"></span>正在解析文档真实名称…</div>
          <div class="sg-addrow" data-col="${s.key}">
            <input type="text" placeholder="粘贴飞书云文档链接" />
            <button class="btn btn-primary btn-xs" data-action="confirm" data-row="${rowIdx}" data-col="${s.key}">确定</button>
            <button class="btn btn-default btn-xs" data-action="cancel" data-row="${rowIdx}" data-col="${s.key}">取消</button>
          </div>
        </div>`;
      }).join('');
    }

    /* ---------- 抽屉内交互（添加 / 删除 / 切换页签） ---------- */
    document.getElementById('drawerBody').addEventListener('click', e => {
      const t = e.target;
      const del = t.closest('.doc-del');
      const add = t.closest('.sg-add');
      const confirm = t.closest('[data-action="confirm"]');
      const cancel = t.closest('[data-action="cancel"]');
      if (del) {
        e.preventDefault();
        const { row, col, idx } = del.dataset;
        rows[row].links[col].splice(parseInt(idx, 10), 1);
        afterStrategyChange(parseInt(row, 10));
        return;
      }
      if (add) {
        const col = add.dataset.col;
        const row = add.dataset.row;
        const group = document.querySelector('.strat-group[data-col="' + col + '"]');
        group.querySelector('.sg-addrow').classList.add('show');
        group.querySelector('.sg-addrow input').focus();
        return;
      }
      if (cancel) {
        const col = cancel.dataset.col;
        const group = document.querySelector('.strat-group[data-col="' + col + '"]');
        const row = group.querySelector('.sg-addrow');
        row.classList.remove('show');
        row.querySelector('input').value = '';
        return;
      }
      if (confirm) {
        const { row, col } = confirm.dataset;
        const group = document.querySelector('.strat-group[data-col="' + col + '"]');
        const input = group.querySelector('.sg-addrow input');
        const url = input.value.trim();
        if (!url) return;
        const loading = group.querySelector('.parse-loading');
        loading.classList.add('show');
        // 模拟后端解析真实名称（演示用；正式环境替换为飞书 OpenAPI 调用）
        setTimeout(() => {
          loading.classList.remove('show');
          const list = rows[row].links[col];
          list.push({ type: parseType(url), name: parseName(url, col), url: url, owner: '齐岳', updated: '2026-08-17' });
          afterStrategyChange(parseInt(row, 10));
        }, 420);
        return;
      }
    });

    function afterStrategyChange(rowIdx) {
      renderStatCards();
      if (PLAN === 'A') renderTable();
      if (drawerState.rowIdx === rowIdx && drawerState.tab === 'strategy') renderDrawerBody();
      else if (drawerState.rowIdx === rowIdx) {
        // 抽屉开着但当前是基础信息页签：刷新头部计数无需重渲染
      }
    }

    /* ---------- 方案切换 ---------- */
    const TIP_A = '方案A：主表四列直接展示策略文档（类型图标 + 真实名称），点击单元格可查看全部并维护；不再显示「N 个文档」字样。';
    const TIP_B = '方案B：主表隐藏四列策略，点击行「品类策略」或「编辑」在详情抽屉的「品类策略」页签集中查看与维护四类策略文档。';
    document.getElementById('planSwitch').addEventListener('click', e => {
      const b = e.target.closest('.plan-opt');
      if (!b) return;
      PLAN = b.dataset.plan;
      [...document.querySelectorAll('.plan-opt')].forEach(x => x.classList.toggle('active', x.dataset.plan === PLAN));
      document.getElementById('planTipText').textContent = PLAN === 'A' ? TIP_A : TIP_B;
      renderTable();
    });

    /* ---------- 初始化 ---------- */
    renderStatCards();
    document.getElementById('planTipText').textContent = TIP_A;
    renderTable();
    updateSelection();
  </script>
</body>
</html>
