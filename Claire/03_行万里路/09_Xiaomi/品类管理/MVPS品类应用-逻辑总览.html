<title>MVPS品类应用 · 逻辑总览</title>
<style>
:root{
  /* Ant Design 设计语言（附录D 定案） */
  --color-primary:#1677FF;
  --color-primary-hover:#4096FF;
  --color-primary-active:#0958D9;
  --color-primary-light:#E6F4FF;
  --color-primary-border:#91CAFF;
  --color-bg-grey:#F5F5F5;
  --color-border:#D9D9D9;
  --color-border-light:#F0F0F0;
  --color-text:rgba(0,0,0,0.88);
  --color-text-secondary:rgba(0,0,0,0.65);
  --color-text-tertiary:rgba(0,0,0,0.45);
  --color-green:#16A34A; --color-green-bg:#E6F6EC;
  --color-orange:#FF6900; --color-orange-bg:#FFF4E6;
  --color-red:#DC2626; --color-red-bg:#FDE8E8;
  --color-teal:#0891B2; --color-teal-bg:#E0F7FB;
  --color-purple:#7C3AED; --color-purple-bg:#F3EBFE;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--color-text);background:var(--color-bg-grey);line-height:1.6;}

/* Top Nav */
.top-nav{height:48px;background:#fff;border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:100;}
.top-nav .logo{min-width:32px;height:32px;padding:0 8px;background:linear-gradient(135deg,#1677FF,#0958D9);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;border-radius:6px;margin-right:14px;box-shadow:0 1px 3px rgba(22,119,255,.35);}
.top-nav .title{font-size:14px;font-weight:600;}
.top-nav .sub{font-size:12px;color:var(--color-text-tertiary);margin-left:10px;font-weight:400;}
.top-nav .spacer{flex:1;}
.top-nav .badge{font-size:11px;background:var(--color-primary-light);color:var(--color-primary);padding:2px 10px;border-radius:999px;font-weight:600;margin-right:8px;}
.top-nav .doc-link{font-size:12px;color:var(--color-primary);cursor:pointer;text-decoration:none;}
.top-nav .doc-link:hover{text-decoration:underline;}

/* Layout */
.app{display:flex;min-height:calc(100vh - 48px);}
.side{width:224px;flex-shrink:0;background:#fff;border-right:1px solid var(--color-border);padding:14px 10px;position:sticky;top:48px;height:calc(100vh - 48px);overflow-y:auto;}
.side .grp{font-size:11px;color:var(--color-text-tertiary);padding:10px 12px 4px;font-weight:600;letter-spacing:.02em;}
.menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--color-text-secondary);transition:background .15s,color .15s;margin-bottom:2px;}
.menu-item:hover{background:var(--color-primary-light);color:var(--color-primary);}
.menu-item.active{background:var(--color-primary-light);color:var(--color-primary);font-weight:600;}
.menu-item .num{width:18px;height:18px;border-radius:4px;background:var(--color-bg-grey);color:var(--color-text-secondary);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.menu-item.active .num{background:var(--color-primary);color:#fff;}

/* Main */
.main{flex:1;min-width:0;padding:20px 24px;}
.card{background:#fff;border:1px solid var(--color-border);border-radius:8px;padding:20px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
.card-head .title{font-size:16px;font-weight:600;}
.card-head .ref{font-size:12px;color:var(--color-text-tertiary);background:var(--color-bg-grey);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.card-desc{font-size:12px;color:var(--color-text-secondary);margin-bottom:16px;border-left:3px solid var(--color-primary);padding-left:10px;}
.mermaid-box{background:#fff;border:1px solid var(--color-border-light);border-radius:6px;padding:18px;overflow-x:auto;display:flex;justify-content:center;}
.mermaid-box svg{max-width:100%;height:auto;}
.nav-btns{display:flex;justify-content:space-between;margin-top:16px;}
.btn{padding:6px 16px;border-radius:6px;font-size:12px;border:1px solid var(--color-border);background:#fff;color:var(--color-text-secondary);cursor:pointer;transition:border .15s,color .15s;}
.btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary);}
.btn-primary:hover{background:var(--color-primary-hover);color:#fff;border-color:var(--color-primary-hover);}
.pager{font-size:12px;color:var(--color-text-tertiary);display:flex;align-items:center;gap:6px;}
.loading{color:var(--color-text-tertiary);font-size:12px;padding:20px;text-align:center;}
.error{color:var(--color-red);font-size:12px;padding:20px;text-align:center;}
.footer{text-align:center;padding:18px;font-size:11px;color:var(--color-text-tertiary);}
</style>
</head>

<script>
if(typeof mermaid==='undefined'){document.write('<script src="https://cdn.bootcdn.net/ajax/libs/mermaid/10.9.0/mermaid.min.js"><\/script>');}
mermaid.initialize({
  startOnLoad:false,
  theme:'base',
  themeVariables:{
    primaryColor:'#E6F4FF',
    primaryBorderColor:'#1677FF',
    primaryTextColor:'rgba(0,0,0,0.88)',
    lineColor:'#91CAFF',
    secondaryColor:'#FFF4E6',
    tertiaryColor:'#F5F5F5',
    fontSize:'14px',
    fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif'
  },
  flowchart:{curve:'basis',padding:14,htmlLabels:true}
});

var DIAGRAMS=[
{grp:'应用层', num:'01', title:'分层架构与模块对照', ref:'PRD §1.1.1',
 desc:'应用层 4 模块（M1 价格中心 / M2 路由引擎 / M3 采购组权限 / M4 改前零件推荐）+ 智能层（26 CLI / 7 Skill / Agent）+ 底座三表（表1 附录E详设、表2/表3 引用）的整体关系。',
 code:`flowchart TB
  subgraph APP["应用层（本 PRD 详设）"]
    M1["M1 价格中心 MVPS<br/>台账 · 待办任务（闭环消费端）"]
    M2["M2 路由引擎<br/>规则中心 · 预览 · 异常队列 · 任务转派"]
    M3["M3 采购组权限<br/>赋权 + 授权合一 · 批量转派 · 模拟器"]
    M4["M4 改前零件推荐<br/>S-01~S-04 决策树（后端逻辑）"]
  end
  subgraph AI["智能层（§7 详设）"]
    CLI["CLI 26 个<br/>确定性查询/写入"]
    SK["Skill 7 个<br/>编排 + 判断 + 解释"]
    AG["Agent<br/>事件监听 → 自动路由"]
  end
  subgraph BASE["底座（表1 附录E详设 · 表2/表3 引用）"]
    T1["表1 车型项目管控表<br/>项目 → 采购员 索引源"]
    T2["表2 品类资源池<br/>品类-VPPS-角色 映射"]
    T3["表3 价值中心台账<br/>零件-VPPS-owner 底座"]
  end
  APP -->|调用| AI
  AI -->|读写| BASE
  M1 --> M2
  M2 --> M3
  M4 --> T3
  T1 --> M2
  T2 --> M1
  T2 --> M2
  T3 --> M1`},
{grp:'应用层', num:'02', title:'端到端设计闭环', ref:'PRD §3.1',
 desc:'任务产生 → 落入待办任务 → 三层匹配 → 抓人/下发 或 异常队列兜底；数据底座持续维护正向反馈 L1/L2/L3，自动命中率随数据完善而提升。',
 code:`flowchart LR
  A["① 任务产生<br/>13 类任务/单据<br/>EWO/CWO/SWO/样件/框架/<br/>定点申请单/SOR/寻源/ESI 等"] -->|落库为待办任务| B["② 价格中心 → 待办任务<br/>零件号/车型/工厂/供应商/<br/>任务来源/到达日期"]
  B -->|单条 / 批量触发| C{"③ 路由引擎 · 三层匹配"}
  C --> D["L1 索引解析<br/>零件号 → VPPS → 品类"]
  C --> E["L2 角色判定<br/>任务类型 → 目标角色"]
  C --> F["L3 人员解析<br/>品类 + 角色 + 项目 → 人"]
  D --> G["命中 → 产出 routeReason<br/>（VPPS/品类/角色/规则号）"]
  E --> G
  F --> G
  C -.未命中/人员缺失/溢出.-> H["⑤ 异常队列<br/>认领 / 转派 → 回人工匹配<br/>7 日准确率 &lt;90% → 降级人工严审"]
  G --> I["④ 抓人 / 下发<br/>飞书通知 assignee<br/>任务状态 → 已处理<br/>台账归属人更新"]
  H -.-> I
  J["⑥ 数据底座持续维护<br/>品类 / 规则 / 组织树"] -.正向反馈 L1/L2/L3.-> C`},
{grp:'应用层', num:'03', title:'三层匹配模型（L1/L2/L3）', ref:'PRD §3.2',
 desc:'L1 索引解析（零件号→VPPS→品类）→ L2 角色判定（任务类型→目标角色）→ L3 人员解析（品类+角色+项目→具体人）。无 VPPS 走白名单兜底，未命中走异常队列。',
 code:`flowchart LR
  PN["零件号"] -->|MBOM 索引| VPPS["VPPS<br/>结构简码 + 位置码"]
  VPPS -->|表2 绑定| CAT["品类"]
  CAT -->|表2 关系| PPL["采购工程师 / 财务CE / SQE"]
  PPL -->|表1 项目管控| FIN["具体人 assignee"]
  CAT -.紧固件/胶水/面料 无 VPPS.-> WL["白名单兜底 🔒<br/>PM 手工下发 / 路梦瑶"]
  FIN -.未命中/人员缺失.-> EX["异常队列"]
  subgraph L1["L1 索引解析"]
    PN --> VPPS --> CAT
  end
  subgraph L2["L2 角色判定"]
    TT["任务类型<br/>EWO/CWO/SWO/样件/框架/…"] --> ROL["目标角色"]
  end
  subgraph L3["L3 人员解析"]
    CAT --> PPL
  end`},
{grp:'应用层', num:'04', title:'菜单结构（与原型一致）', ref:'PRD §5',
 desc:'顶部一级菜单 12 项，下拉二级菜单 hover 展开（非 Tab 页）。价格中心内「台账/待办任务」为页面内子 Tab；M4 嵌入采购任务管理。',
 code:`flowchart TB
  HOME["首页"] ; ME["个人中心"] ; SUP["供应商管理"]
  PROC["采购项目管理 ▾"] --> P1["车型项目管理"]
  PROC --> P2["进度管理"]
  SOR["SOR管理"]
  TASK["采购任务管理 ▾"] --> T1["设计价格变更（M4 嵌入）"]
  TASK --> TX["寻源需求 / SOR定点 / ESI / 商务价格变更 / 颜色件 / 物流 / SWO / 样件（已有）"]
  RFQ["询报价与定点"]
  PRICE["价格中心 ▾"] --> PR1["台账（M1-a：量产/售后切换）"]
  PRICE --> PR2["待办任务（M1-b）"]
  PRICE --> PRX["费用类 / 样件 / 移地生产 / 供应商主体切换 / 价格台账失效（已有）"]
  PERF["履约管理"] ; CON["合同管理"] ; ORD["订单管理"]
  BASE["基础数据管理 ▾"] --> B1["品类管理（底座·已上线）"]
  BASE --> B2["路由引擎（M2）"]
  BASE --> B3["采购组权限（M3）"]
  BASE --> BX["零部件信息 / 工厂 / 公司信息（已有）"]`},
{grp:'应用层', num:'05', title:'路由决策流程（24 条规则）', ref:'PRD §6.2.1 / §6.2.12',
 desc:'任务进入路由 → L1 索引（无 VPPS 进白名单锁死）→ L2 角色判定 → 按优先级扫描 24 条规则 → 命中产出 routeReason → L3 解析人员 → 下发或进异常队列；复盘反哺规则配置。',
 code:`flowchart TD
  IN["任务/单据 进入路由"] --> CHK1{"L1 索引解析<br/>零件号 → VPPS → 品类"}
  CHK1 -- 无 VPPS（紧固件/胶水/面料） --> WL["白名单 🔒<br/>R-WL01~04 锁死<br/>PM 手工下发 / 路梦瑶"]
  CHK1 -- 索引成功 --> CHK2{"L2 角色判定<br/>任务类型 → 目标角色"}
  CHK2 --> SCAN["按优先级 P 顺序扫描<br/>24 条结构化规则（WHEN/THEN/ELSE）"]
  SCAN --> CHK3{"规则命中？"}
  CHK3 -- 是 --> REASON["产出 routeReason<br/>（VPPS/品类/角色/规则号）"]
  REASON --> PPL["L3 人员解析<br/>品类 + 角色 + 项目 → assignee"]
  CHK3 -- 否 --> EX1["异常队列：无规则命中"]
  PPL --> CHK4{"人员可解析？"}
  CHK4 -- 是 --> OK["抓人/下发 ✅<br/>飞书通知 · 任务状态→已处理"]
  CHK4 -- 人员缺失/多 VPPS 溢出 --> EX2["异常队列：人员缺失 / 溢出"]
  WL --> DONE1["手工下发记录"]
  EX1 --> TRIAGE["认领 / 转派<br/>7 日准确率 &lt;90% → 人工严审 + 通知组长"]
  EX2 --> TRIAGE
  TRIAGE --> FEED["复盘反哺规则配置"]
  FEED -.-> SCAN`},
{grp:'应用层', num:'06', title:'任务转派双模式选型', ref:'PRD §6.2.10.5',
 desc:'分工调整/部分品类交接 → 模式 A VPPS 树转派（按品类筛选，4 表原子更新）；人员离职/全岗移交 → 模式 B 一键批量转派（20 类单据逐类隔离执行）。',
 code:`flowchart TD
  START["人员变更场景"] --> Q1{"触发原因？"}
  Q1 -- 分工调整 / 部分品类交接 --> A["模式 A：VPPS 人员树转派"]
  Q1 -- 人员离职 / 全岗移交 --> B["模式 B：一键批量转派"]
  A --> A1["选被转对象（角色）<br/>采购工程师 / 财务CE / SQE"]
  A --> A2["选 VPPS 节点（品类）<br/>专业组→功能组→VPPS 叶子"]
  A1 --> A3["弹窗指定目标人员"]
  A2 --> A3
  A3 --> A4["预计影响 N 任务 + M RFQ + K 台账"]
  A4 --> A5["确认执行<br/>4 表原子更新（关系/任务/RFQ/台账）"]
  B --> B1["自动加载该人员全部 20 类单据"]
  B1 --> B2{"全量统一 还是 选择性？"}
  B2 -- 全量 --> B3["首行填接收人 → 全量填充"]
  B2 -- 选择性 --> B4["仅对有目标的行填写"]
  B3 --> B5["确认一键转派<br/>逐类隔离执行 + 汇总报告"]
  B4 --> B5
  A5 --> NOTIFY["联动通知 A / B / 组长<br/>写入变更记录"]
  B5 --> NOTIFY`},
{grp:'应用层', num:'07', title:'赋权 + 授权合并流程', ref:'PRD §6.3.4',
 desc:'专业组新增/编辑弹窗合一：赋权=指定管理员（HR 通讯录）；授权=权限范围三选一（all 本组全部 / subset 指定功能组 / self 仅本人）。铁律：管理员仅查看，不可编辑下属数据。',
 code:`flowchart TD
  START["入口：+ 新增 / 行内编辑"] --> FORM["弹窗表单<br/>名称* · 描述 · 状态"]
  FORM --> ASG{"赋权：指定管理员<br/>HR 通讯录搜索选择器 *"}
  ASG --> AUTH{"授权：权限范围三选一 *"}
  AUTH -- 本专业组全部数据 all --> S1["可查看本组全部<br/>下属功能组/采购员单据"]
  AUTH -- 指定功能组 subset --> S2["展开功能组多选<br/>仅可查看选定范围"]
  AUTH -- 仅本人数据 self --> S3["仅可查看自己名下单据"]
  S1 --> PUB
  S2 --> PUB
  S3 --> PUB
  PUB{"点击 发布 / 保存"} --> CONFIRM["二次确认<br/>（新增：立即生效提示；编辑：管理员变更提示）"]
  CONFIRM --> WRITE["写库：专业组记录<br/>+ user_scope（source=manual）<br/>+ 变更记录（前后值 diff）"]
  WRITE --> REFRESH["列表刷新"]
  WRITE -.管理员变更.-> ATOMIC["原子切换：旧权限撤销 → 新权限生效"]`},
{grp:'应用层', num:'08', title:'改前零件推荐决策树（S-01~S-04）', ref:'PRD §6.4.4',
 desc:'后端推荐逻辑：S-01 台账保护（有台账入口置灰）→ S-02 有改前 → S-03 无改前 → S-04 同 EWO 项目优先排序 → TopN=10 返回候选。',
 code:`flowchart TD
  CLICK["用户点击【手动关联改前零件】"] --> S01{"S-01 台账保护<br/>改后零件已有台账？"}
  S01 -- YES --> GREY["入口置灰，不弹窗<br/>（无需推荐）"]
  S01 -- NO --> S02{"S-02 有改前<br/>改后零件已有改前零件？"}
  S02 -- YES --> S2PATH["改后 & 改前 → VPPS<br/>取该 VPPS 下有台账的零件号"]
  S02 -- NO --> S03["S-03 无改前<br/>改后 → VPPS → 取有台账零件号"]
  S2PATH --> S04{"S-04 EWO 项目排序"}
  S03 --> S04
  S04 --> POST["后处理：排除已关联 + 排序<br/>默认 TopN = 10"]
  POST --> RET["返回排序后候选列表（弹窗展示）"]`},
{grp:'底座·表1', num:'09', title:'管控表模块导航结构', ref:'附录 E·E-1',
 desc:'车型项目管控表（表1）：车型项目管理（KPI/筛选/主行+子行/批量栏/新建向导）+ 进度管理（6 tab 项目详情）。顶层菜单仅 2 个，人员路由已降级为历史遗留。',
 code:`flowchart TB
  TOP["车型项目管控表（表1）"] --> M1["车型项目管理<br/>view-control-table"]
  TOP --> M2["进度管理<br/>view-proj-detail（6 tab）"]
  M1 --> M1A["全量统计 KPI（4 卡）"]
  M1 --> M1B["筛选栏（8 字段）"]
  M1 --> M1C["车型项目列表<br/>主行（车型）+ 子行（项目-工厂）"]
  M1C --> M1D["批量操作栏<br/>分配 / 更换 PM / 取消"]
  M1 --> NEW["新建采购项目向导（3 步）<br/>内嵌于管控表"]
  M2 --> T1["基本信息（6 卡）"]
  M2 --> T2["进度管理（SOR 19 列）"]
  M2 --> T3["EWO 任务清单"]
  M2 --> T4["CWO 任务清单"]
  M2 --> T5["SWO 任务清单"]

var cur=0;
function renderMenu(){
  var html='';var lastGrp='';
  DIAGRAMS.forEach(function(d,i){
    if(d.grp!==lastGrp){html+='<div class="grp">'+d.grp+'</div>';lastGrp=d.grp;}
    html+='<div class="menu-item'+(i===cur?' active':'')+'" data-i="'+i+'" onclick="show('+i+')"><span class="num">'+d.num+'</span>'+d.title+'</div>';
  });
  document.getElementById('sideMenu').innerHTML=html;
}
function show(i){
  cur=i;
  var d=DIAGRAMS[i];
  document.getElementById('cardTitle').textContent=d.num+' · '+d.title;
  document.getElementById('cardRef').textContent=d.ref;
  document.getElementById('cardDesc').textContent=d.desc;
  document.getElementById('pager').textContent=(i+1)+' / '+DIAGRAMS.length;
  var box=document.getElementById('mermaidBox');
  box.innerHTML='<div class="loading">渲染中…</div>';
  mermaid.render('md_'+i,d.code).then(function(r){
    box.innerHTML=r.svg;
  }).catch(function(e){
    box.innerHTML='<div class="error">图表渲染失败：'+e.message+'</div>';
  });
  renderMenu();
  window.scrollTo(0,0);
}
function prev(){show((cur-1+DIAGRAMS.length)%DIAGRAMS.length);}
function next(){show((cur+1)%DIAGRAMS.length);}
renderMenu();show(0);
</script>
