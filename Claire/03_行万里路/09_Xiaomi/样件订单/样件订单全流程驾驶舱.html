<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>样件订单全流程驾驶舱 · 订单Skill开发</title>
<style>
:root{
  --primary:#1677FF; --primary-weak:#E6F4FF; --ok:#52C41A; --warn:#FAAD14; --danger:#FF4D4F;
  --bg:#F5F7FA; --card:#fff; --line:#E5E8EF; --text:#1F2329; --text2:#646A73; --text3:#8F959E;
  --sidebar:#0F1B2D; --sidebar-w:#236px;
  --r-sm:6px; --r-md:8px; --r-lg:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px}
#app{display:flex;height:100vh;overflow:hidden}

/* ---------- 左侧导航 ---------- */
#sidebar{width:216px;min-width:216px;background:var(--sidebar);color:#C7D0DC;display:flex;flex-direction:column;overflow-y:auto}
#sidebar .logo{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;color:#fff;font-weight:600;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary)}
.nav-group{padding:10px 0 2px;font-size:11px;color:#6B7A90;padding-left:16px;letter-spacing:.05em}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;color:#B9C4D2;font-size:13px;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(22,119,255,.15);color:#fff;border-left-color:var(--primary)}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;border-radius:8px;padding:1px 6px;min-width:18px;text-align:center}
.nav-item .ic{width:16px;text-align:center;opacity:.9}

/* ---------- 顶栏 ---------- */
#topbar{height:48px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}
#topbar .crumb{font-size:13px;color:var(--text2)}
#topbar .crumb b{color:var(--text);font-weight:600}
#searchbox{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer}
#searchbox:hover{border-color:var(--primary)}
#searchbox .kbd{margin-left:auto;font-size:11px;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#fff}
#topbar .src-tag{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px 8px;white-space:nowrap}
.tool-btn{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--text2)}
.tool-btn:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- 内容区 ---------- */
#main{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth}
.view{display:none}.view.show{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-size:11px;color:var(--text3);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi .t{font-size:12px;color:var(--text2)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .v small{font-size:12px;color:var(--text3);font-weight:400}
.kpi .s{font-size:11px;color:var(--text3);margin-top:2px}
.kpi.up .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.danger .v{color:var(--danger)}

/* 管线 */
.pipeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 2px}
.pipe-node{display:flex;flex-direction:column;align-items:center;min-width:96px;position:relative;cursor:pointer}
.pipe-node .pdot{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;z-index:2}
.pipe-node.done .pdot{background:var(--primary-weak);border-color:var(--primary)}
.pipe-node.done .pdot::after{content:"✓";position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
.pipe-node.pending .pdot{border-color:var(--warn);background:#FFFBE6}
.pipe-node .plabel{font-size:11px;color:var(--text2);margin-top:6px;white-space:nowrap}
.pipe-node .pnum{font-size:10px;color:var(--text3);margin-top:2px}
.pipe-conn{flex:1;min-width:18px;height:2px;background:var(--line);margin-top:16px}
.pipe-conn.done{background:var(--primary)}

/* 表格 */
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#FAFBFC;color:var(--text2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #F0F2F5;white-space:nowrap}
.tbl tr{cursor:pointer}.tbl tr:hover td{background:#F7FAFF}
.tbl tr.selected td{background:var(--primary-weak)}
.tbl .num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;line-height:18px}
.tag.ok{background:#F0FFF4;color:var(--ok);border:1px solid #B7EB8F}
.tag.warn{background:#FFFBE6;color:#D48806;border:1px solid #FFE58F}
.tag.danger{background:#FFF1F0;color:var(--danger);border:1px solid #FFA39E}
.tag.info{background:var(--primary-weak);color:var(--primary);border:1px solid #91CAFF}
.tag.gray{background:#F2F3F5;color:var(--text2);border:1px solid #E5E8EF}
.tag.purple{background:#F9F0FF;color:#722ED1;border:1px solid #D3ADF7}

/* Tab */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 14px;font-size:12px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;user-select:none;white-space:nowrap}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab .cnt{font-size:11px;color:var(--text3);margin-left:4px}

/* 筛选条 */
.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filterbar select,.filterbar input{border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;font-size:12px;background:#fff;color:var(--text)}
.filterbar select:focus,.filterbar input:focus{outline:none;border-color:var(--primary)}

/* 详情抽屉 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
#drawer{position:fixed;top:0;right:-520px;width:520px;max-width:92vw;height:100vh;background:#fff;z-index:60;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .25s ease;display:flex;flex-direction:column}
#drawer.open{right:0}
#drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#drawer .dh .t{font-size:15px;font-weight:600}
#drawer .db{flex:1;overflow-y:auto;padding:16px}
#drawer .dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12px;margin-bottom:12px}
#drawer .dl .k{color:var(--text3)}
#drawer .dl .v{color:var(--text)}
#drawer h4{font-size:13px;font-weight:600;margin:14px 0 8px;color:var(--text)}
.actrow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.btn{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{background:#fff;border-color:var(--danger);color:var(--danger)}
.btn:hover{opacity:.88}
.icon-btn{border:none;background:none;cursor:pointer;font-size:14px;color:var(--text3)}
.icon-btn:hover{color:var(--text)}

/* 双列 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .card{margin-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

/* 待办队列 */
.todo-item{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;font-size:12px}
.todo-item .ic{margin-top:1px}
.todo-item .mt{color:var(--text3);font-size:11px;margin-top:2px}

/* CLI 面板 */
.cli-sel{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cli-chip{border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;background:#fff;color:var(--text2)}
.cli-chip:hover{border-color:var(--primary);color:var(--primary)}
.cli-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
pre.json{background:#0F1B2D;color:#D6E4FF;border-radius:var(--r-md);padding:12px 14px;font-size:11px;overflow:auto;line-height:1.6;font-family:Consolas,Menlo,monospace;max-height:420px}

/* 配置 */
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12px}
.cfg-row .desc{color:var(--text3);font-size:11px;margin-top:2px}
.switch{width:36px;height:20px;border-radius:10px;background:#D9DEE6;position:relative;cursor:pointer;transition:.2s}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.switch.on::after{left:18px}

/* toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0F1B2D;color:#fff;padding:8px 18px;border-radius:6px;font-size:12px;z-index:99;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}

/* 命令面板 */
#cmdpanel{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:560px;max-width:90vw;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:70;display:none;overflow:hidden}
#cmdpanel.open{display:block}
#cmdpanel input{width:100%;border:none;outline:none;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line)}
#cmdpanel .cmd-list{max-height:320px;overflow-y:auto}
#cmdpanel .cmd-item{padding:10px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}
#cmdpanel .cmd-item:hover,#cmdpanel .cmd-item.active{background:var(--primary-weak)}
#cmdpanel .cmd-item .k{color:var(--text3);font-size:11px;margin-left:auto}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:12px}
.selftest-banner{display:none}
</style>
</head>

/* ============================================================
 * 工具
 * ============================================================ */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tag(status){const c=STATUS_COLOR[status]||"gray";return `<span class="tag ${c}">${STATUS_CN[status]||status}</span>`}
function rtag(route){const map={AUTO:"ok",SELECT:"warn",NO_SUPPLIER:"danger"};return `<span class="tag ${map[route]}">${ROUTE_CN[route]}</span>`}
function fmtMoney(n){return "¥"+Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2})}
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200)}
function supName(code){if(!code||code==="MULTI")return code==="MULTI"?"多供应商":"-";return (SUPPLIERS[code]||{}).name||code}
function setView(id){
  state.view=id;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.toggle("active",n.dataset.id===id));
  ensureView(id);
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("show"));
  const el=$(id); if(el)el.classList.add("show");
  const nav=NAV.find(n=>n.id===id);
  $("crumb").innerHTML="样件订单 / <b>"+(nav?nav.name:id)+"</b>";
  $("main").scrollTop=0;
}
function renderNav(){
  $("nav").innerHTML=NAV.map(n=>{
    if(n.g)return `<div class="nav-group">${n.g}</div>`;
    return `<div class="nav-item${n.id===state.view?" active":""}" data-id="${n.id}" onclick="setView('${n.id}')"><span class="ic">${n.ic}</span>${n.name}${n.badge?`<span class="badge">${n.badge}</span>`:""}</div>`;
  }).join("");
}

        <div class="tab">草稿 3</div><div class="tab active">审批中 3</div><div class="tab">待供应商确认 1</div><div class="tab">供应商已确认 1</div>
      </div>
      <table class="tbl"><thead><tr><th>订单号</th><th>状态</th><th>审批节点</th><th>供应商确认</th><th>到货</th><th>到货状态</th><th>处理建议</th></tr></thead><tbody>${rows}</tbody></table>
      <div style="margin-top:10px;font-size:11px;color:var(--text3)">状态来源：EP 订单字段（poStatus）· 预警分级：P2 交期→通知采购员；P0/P1 大批量异常→升级</div>
    </div>
  `);
}

function openOrderDetail(no){
  const o=ORDERS.find(x=>x.no===no);if(!o)return;
  const items=o.items.map(i=>`<tr><td>${i.line}</td><td>${i.part}</td><td>${i.name}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.price*i.qty)}</td><td>${i.delivery}</td><td class="num">${i.rcv}</td></tr>`).join("");
  const acts=[];
  if(o.status==="DRAFT")acts.push({t:"发起审批",cls:"primary",fn:()=>{toast("✅ 已启动审批（dx-ep sample-order start-approval）")}});
  if(o.status==="DRAFT")acts.push({t:"删除草稿",cls:"danger",fn:()=>{toast("✅ 已删除草稿（dx-ep sample-order draft-delete）")}});
  if(o.status==="APPROVING")acts.push({t:"终止流程",cls:"danger",fn:()=>{toast("✅ 已终止流程，订单回草稿（dx-ep terminate-approval）")}});
  if(o.status==="WAIT_SUPPLIER")acts.push({t:"催办供应商",cls:"primary",fn:()=>{toast("✅ 已推送催办通知")}});
  if(o.status==="SUPPLIER_CONFIRMED")acts.push({t:"关闭订单",cls:"danger",fn:()=>{toast("✅ 已关闭，预算释放+SAP通知（dx-ep close）")}});
  openDrawer("订单详情 · "+o.no,`
    <div class="dl">
      <div class="k">订单状态</div><div class="v">${tag(o.status)} ${o.approve?`<span style="color:var(--text3)">· ${o.approve}</span>`:""}</div>
      <div class="k">项目 / 版本</div><div class="v">${o.project} / V${o.ver}</div>
      <div class="k">供应商</div><div class="v">${supName(o.sup)}</div>
      <div class="k">采购员 / 申请人</div><div class="v">${o.buyer} / ${o.req}</div>
      <div class="k">预算 / 需求</div><div class="v">${o.br}-${o.brLine} / ${o.demand}</div>
      <div class="k">金额</div><div class="v">${fmtMoney(o.amount)}</div>
      <div class="k">SAP / 试制</div><div class="v">${o.sap} / ${o.trial}</div>
      <div class="k">来源</div><div class="v" style="color:var(--text3)">${o.no==="4900037799"?"MANUAL 人工":"SKILL_AUTO Skill 调用（用于复盘）"}</div>
    </div>
    <h4>条目明细 <span style="font-weight:400;font-size:11px;color:var(--text3)">dx-ep sample-order item-detail</span></h4>
    <table class="tbl"><thead><tr><th>行</th><th>零件号</th><th>名称</th><th>数量</th><th>单价</th><th>金额</th><th>到货</th><th>已收</th></tr></thead><tbody>${items}</tbody></table>`,acts);
}

/* ============================================================
 * 支撑域视图
 * ============================================================ */
function renderInquiry(){
  const cards=INQUIRY.map(b=>`<div class="card"><h3>${b.buyer} <span class="sub">${b.items.length} 条</span></h3>
    ${b.items.map(i=>`<div class="todo-item"><span class="ic">${i.pri==="URGENT"?"⚠️":"🔎"}</span><div><div>${i.part} ${i.name} ×${i.qty} <span class="tag ${i.pri==="URGENT"?"danger":"gray"}">${i.pri==="URGENT"?"超7天·升级":"正常"}</span></div><div class="mt">${i.proj} · 需求 ${i.part} · 等待 ${i.days} 天</div></div></div>`).join("")}
  </div>`).join("");
  setViewHtml("inquiry",`
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="t">无价格需求</div><div class="v">6</div></div>
      <div class="kpi up"><div class="t">台账已匹配</div><div class="v">0</div></div>
      <div class="kpi danger"><div class="t">超7天升级</div><div class="v">2</div></div>
    </div>
    ${cards}
    <div class="card"><h3>推送规则</h3><div style="font-size:12px;color:var(--text2);line-height:1.9">
      ① 无价格需求自动匹配台账（量产→样件价）→ 命中回 PRICED 回到下单链路<br>
      ② 仍无价 → 按采购员汇总生成询价清单推送（飞书卡片/待办）<br>
      ③ 超 ${7} 天无价 → URGENT 升级提醒 · 与创建订单「无价格→失败」路径闭环
    </div></div>
  `);
}

function renderCli(){
  const chips=CLIS.map(c=>`<div class="cli-chip${state.cliId===c.id?" active":""}" onclick="state.cliId='${c.id}';renderCli()">${c.id}</div>`).join("");
  const c=CLIS.find(x=>x.id===state.cliId);
  setViewHtml("cli-panel",`
    <div class="card"><h3>CLI 调用面板 <span class="sub">16 个接口契约 · dx-ep 四级命名 · 统一返回包装</span></h3>
      <div class="cli-sel">${chips}</div>
      <pre class="json" style="white-space:pre-wrap"># ${c.cmd}
# 用途：${c.desc}
${c.params.map(p=>"# "+p[0]+" ("+p[1]+", "+(p[2]==="是"?"必选":"可选")+")").join("\n")}

$ ${c.demo}</pre>
      <div style="margin:12px 0 6px;font-size:12px;color:var(--text2)">▶ 执行结果（模拟）</div>
      <pre class="json">${esc(JSON.stringify(c.out,null,2))}</pre>
    </div>
  `);
}

function renderConfig(){
  const rows=[
   {k:"分组维度",v:"BR→需求号→采购员→供应商",on:true,desc:"顺序不影响结果；不可跨 BR 合并（EP 底层约束）"},
   {k:"取价逻辑",v:"最新且最低价",on:true,desc:"固化在 EP 代码；非最低价自动落草稿"},
   {k:"强校验(新需求)",v:"零件号/状态/回退",on:true,desc:"不通过退回需求方带原因"},
   {k:"弱校验(修改需求)",v:"仅提醒",on:true,desc:"修改需求由更新订单 Skill 承接"},
   {k:"数量0处理",v:"删除行/关单/删草稿",on:true,desc:"不回退需求（系统以最新需求为准）"},
   {k:"每日批次",v:"09:30 检查 / 10:00 下单",on:true,desc:"L1 Coordinator 定时触发"},
   {k:"串行队列",v:"开启",on:true,desc:"防 EP 接口通道堵塞，失败重试2次"},
   {k:"订单来源字段",v:"SKILL_AUTO/MANUAL",on:true,desc:"后台记录传参方式，供周度复盘"},
   {k:"散件导入确认",v:"需求人卡片确认",on:true,desc:"责任留在需求方（源哥原则）"}
  ];
  setViewHtml("config",`
    <div class="card"><h3>配置 <span class="sub">规则可配置 · 修改即生效（演示）</span></h3>
      ${rows.map(r=>`<div class="cfg-row"><div><div>${r.k} <span style="color:var(--text2)">· ${r.v}</span></div><div class="desc">${r.desc}</div></div><div class="switch on" onclick="this.classList.toggle('on');toast('配置已更新')"></div></div>`).join("")}
    </div>
  `);
}

/* ============================================================
 * 抽屉 & 全局
 * ============================================================ */
function openDrawer(title,body,acts){
  $("drawerTitle").textContent=title;
  $("drawerBody").innerHTML=body;
  $("drawerActs").innerHTML=(acts||[]).map(a=>`<button class="btn ${a.cls||''}" onclick="(function(){const f=${a.fn.toString()};f();closeDrawer();})()">${a.t}</button>`).join("");
  $("drawer").classList.add("open");$("mask").style.display="block";
}
function closeDrawer(){$("drawer").classList.remove("open");$("mask").style.display="none"}
$("mask").onclick=closeDrawer;

/* 密度切换 */
$("densityBtn").onclick=()=>{state.density=state.density==="normal"?"compact":"normal";document.querySelectorAll(".tbl td,.tbl th").forEach(el=>el.style.padding=state.density==="compact"?"4px 8px":"8px 10px");toast(state.density==="compact"?"紧凑密度":"标准密度")};

/* 执行今日批次 */
$("execBtn").onclick=()=>{toast("▶ 已触发今日批次执行（模拟 5s）");setTimeout(()=>{BATCH.steps.forEach((s,i)=>{if(i<BATCH.steps.length-1)s.status="done"});BATCH.steps[BATCH.steps.length-1].status="done";setView("dashboard");renderDashboard();toast("✅ 批次执行完成，报告已生成")},1500)};

/* 全局搜索 / 命令面板 */
$("searchbox").onclick=()=>openCmd();
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmd()}
  if(e.key==="Escape")closeCmd();
});
function openCmd(){
  $("cmdpanel").classList.add("open");$("cmdInput").value="";$("cmdInput").focus();renderCmd("");
}
function closeCmd(){$("cmdpanel").classList.remove("open")}
function renderCmd(kw){
  const items=[...NAV.filter(n=>n.id).map(n=>({t:n.name,sub:n.id,fn:`setView('${n.id}')`})),
    {t:"执行今日批次",sub:"Coordinator",fn:`$("execBtn").click()`},
    {t:"切换表格密度",sub:"视图",fn:`$("densityBtn").click()`}];
  const hit=items.filter(i=>!kw||(i.t+i.sub).toLowerCase().includes(kw.toLowerCase()));
  $("cmdList").innerHTML=hit.map((i,idx)=>`<div class="cmd-item${idx===0?" active":""}" onclick="eval('${i.fn}');closeCmd()"><span>${i.t}</span><span class="k">${i.sub}</span></div>`).join("")||'<div class="empty">无匹配命令</div>';
}
$("cmdInput").oninput=e=>renderCmd(e.target.value);
$("cmdInput").onkeydown=e=>{
  const items=[...$("cmdList").querySelectorAll(".cmd-item")];
  const idx=items.findIndex(x=>x.classList.contains("active"));
  if(e.key==="Enter"&&items[idx]){items[idx].click()}
  if(e.key==="ArrowDown"&&idx<items.length-1){items.forEach(x=>x.classList.remove("active"));items[idx+1].classList.add("active")}
  if(e.key==="ArrowUp"&&idx>0){items.forEach(x=>x.classList.remove("active"));items[idx-1].classList.add("active")}
};

/* ============================================================
 * 渲染入口（懒加载：按需渲染当前视图，避免互相覆盖）
 * ============================================================ */
const VIEW_RENDERERS={
  dashboard:renderDashboard,"demand-import":renderDemandImport,"demand-check":renderDemandCheck,
  "demand-pool":renderDemandPool,"order-create":renderOrderCreate,"supplier-select":renderSupplierSelect,
  "order-list":renderOrderList,"order-update":renderOrderUpdate,"order-track":renderOrderTrack,
  inquiry:renderInquiry,"cli-panel":renderCli,config:renderConfig
};

const renderedViews={};
function setViewHtml(id, innerHtml){
  let el=document.getElementById(id);
  if(!el){ el=document.createElement("div"); el.id=id; el.className="view"; document.getElementById("main").appendChild(el); }
  el.innerHTML=innerHtml;
}
function ensureView(id){
  if(renderedViews[id])return;
  VIEW_RENDERERS[id]();
  renderedViews[id]=true;
}

function render(){
  renderNav();
  ensureView(state.view);
  setView(state.view);
}

/* ============================================================
 * 自测（?selftest=1）
 * ============================================================ */
function runSelftest(){
  const results=[];
  const assert=(name,cond)=>results.push({name,ok:!!cond});
  render();
  assert("导航渲染 12 项",document.querySelectorAll(".nav-item").length===12);
  ensureView("dashboard");
  assert("驾驶舱 KPI 5 张",document.querySelectorAll("#dashboard .kpi").length===5);
  assert("批次管线 7 节点",document.querySelectorAll("#dashboard .pipe-node").length===7);
  assert("待办队列 6 条",document.querySelectorAll("#dashboard .todo-item").length===6);
  state.orderTab="ALL";state.orderKw="";renderOrderList();
  assert("订单列表 7 行",document.querySelectorAll("#order-list tbody tr").length===7);
  assert("订单状态 Tab 7 个",document.querySelectorAll("#order-list .tab").length===7);
  state.orderTab="DRAFT";renderOrderList();
  assert("状态筛选 DRAFT 2 行",document.querySelectorAll("#order-list tbody tr").length===2);
  state.orderTab="ALL";state.orderKw="博世";renderOrderList();
  assert("搜索『博世』命中",document.querySelectorAll("#order-list tbody tr").length>=1);
  state.orderTab="ALL";state.orderKw="";renderOrderList();
  openOrderDetail("4900037888");
  assert("订单详情抽屉打开",document.getElementById("drawer").classList.contains("open"));
  assert("抽屉含条目明细",document.querySelectorAll("#drawerBody .tbl tr").length>=2);
  assert("抽屉含关闭订单按钮",Array.from(document.querySelectorAll("#drawerActs .btn")).some(b=>b.textContent==="关闭订单"));
  closeDrawer();
  ensureView("cli-panel");
  assert("CLI 面板 16 命令",document.querySelectorAll("#cli-panel .cli-chip").length===16);
  assert("CLI JSON 输出渲染",document.querySelectorAll("#cli-panel pre.json").length===2);
  ensureView("demand-check");
  assert("需求检查 8 行",document.querySelectorAll("#demand-check tbody tr").length===8);
  ensureView("order-update");
  assert("更新订单 3 行",document.querySelectorAll("#order-update tbody tr").length===3);
  setView("dashboard");
  const fails=results.filter(r=>!r.ok);
  const banner=$("selftestBanner");
  banner.style.display="block";banner.style.cssText="position:fixed;top:0;left:0;right:0;z-index:999;padding:10px 16px;font-size:13px;text-align:center;color:#fff;background:"+(fails.length?"#FF4D4F":"#52C41A");
  banner.textContent=`自测 ${results.length-fails.length}/${results.length} 通过 · ${results.map(r=>(r.ok?"✅":"❌")+r.name).join(" · ")}`;
  console.log("SELFTEST:",JSON.stringify(results));
}
if(location.search.includes("selftest=1")){
  window.addEventListener("DOMContentLoaded",()=>setTimeout(runSelftest,200));
}
render();
</script>
