<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>报价成本库 · 应用场景</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:rgba(0,0,0,.88);
font:14px/1.5715 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:32px 24px 60px}
h1{font-size:28px;font-weight:600;margin:0 0 8px}
.sub{color:rgba(0,0,0,.45);margin-bottom:12px}
.ver{display:inline-block;font-size:11.5px;color:rgba(0,0,0,.45);background:#fafafa;
border:1px solid #f0f0f0;border-radius:4px;padding:2px 8px;margin-bottom:22px;
font-family:ui-monospace,monospace}
.card{border:1px solid #f0f0f0;border-radius:8px;padding:24px;margin-bottom:16px;
box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:16px;font-weight:600;margin:0 0 16px;padding-left:10px;border-left:3px solid #1677ff}
h3{font-size:13.5px;font-weight:600;margin:0 0 10px;color:rgba(0,0,0,.88)}
h4{font-size:12.5px;font-weight:600;margin:16px 0 8px;color:rgba(0,0,0,.65)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fafafa;border-radius:6px;padding:16px 18px}
.kpi .v{font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v.blue{color:#1677ff}.kpi .v.green{color:#389e0d}.kpi .v.red{color:#cf1322}.kpi .v.orange{color:#d46b08}
.kpi .k{font-size:12.5px;color:rgba(0,0,0,.45);margin-top:6px;line-height:1.5}
.kpi .d{font-size:11.5px;margin-top:4px;color:rgba(0,0,0,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;text-align:left;padding:11px 12px;font-weight:600;
border-bottom:1px solid #f0f0f0;white-space:nowrap;font-size:12.5px}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;color:rgba(0,0,0,.65)}
tr:hover td{background:#fafafa}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.b{font-weight:600;color:rgba(0,0,0,.88)}
td.mono{font-family:ui-monospace,monospace;font-size:11.5px}
tr.best td{background:#f6ffed}
.tag{display:inline-block;padding:0 8px;border-radius:4px;font-size:12px;
line-height:20px;border:1px solid;white-space:nowrap}
.tag.blue{color:#1677ff;border-color:#91caff;background:#e6f4ff}
.tag.green{color:#389e0d;border-color:#b7eb8f;background:#f6ffed}
.tag.orange{color:#d46b08;border-color:#ffd591;background:#fff7e6}
.tag.red{color:#cf1322;border-color:#ffa39e;background:#fff1f0}
.tag.grey{color:rgba(0,0,0,.45);border-color:#d9d9d9;background:#fafafa}

/* 场景切换 */
.scenes{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.scene{flex:1;min-width:180px;padding:14px 16px;border:1px solid #f0f0f0;border-radius:8px;
background:#fafafa;cursor:pointer;transition:all .15s}
.scene:hover{border-color:#91caff;background:#f0f7ff}
.scene.on{border-color:#1677ff;background:#e6f4ff;box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.scene .sn{font-size:11px;color:rgba(0,0,0,.35);font-weight:600;letter-spacing:.5px}
.scene .st{font-size:14px;font-weight:600;margin:3px 0 4px;color:rgba(0,0,0,.88)}
.scene.on .st{color:#1677ff}
.scene .sd{font-size:11.5px;color:rgba(0,0,0,.45);line-height:1.5}

.pane{display:none}.pane.on{display:block}

.infobox{background:#e6f4ff;border:1px solid #91caff;border-radius:6px;padding:14px 16px;
font-size:12.5px;line-height:1.85;color:rgba(0,0,0,.65);margin-bottom:14px}
.infobox b{color:#1677ff}
.warnbox{background:#fff1f0;border:1px solid #ffa39e;border-radius:6px;padding:14px 16px;
font-size:12.5px;line-height:1.85;color:rgba(0,0,0,.65);margin-bottom:14px}
.warnbox b{color:#cf1322}
.okbox{background:#f6ffed;border:1px solid #b7eb8f;border-radius:6px;padding:14px 16px;
font-size:12.5px;line-height:1.85;color:rgba(0,0,0,.65);margin-bottom:14px}
.okbox b{color:#389e0d}
.insight{background:#fffbe6;border:1px solid #ffe58f;border-radius:6px;
padding:16px 18px;font-size:13px;line-height:1.9;color:rgba(0,0,0,.65)}
.insight b{color:rgba(0,0,0,.88)}
.insight .hl{background:#fff1b8;padding:1px 5px;border-radius:3px;font-weight:600}
.insight .bad{background:#ffccc7;padding:1px 5px;border-radius:3px;font-weight:600}
.insight>div+div{margin-top:10px}

/* 价差条 */
.spreadbar{position:relative;height:22px;background:#f5f5f5;border-radius:3px;overflow:hidden;min-width:120px}
.spreadbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.spreadbar .lbl{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;
font-size:11px;font-weight:600;color:rgba(0,0,0,.65)}

/* 报价卡 */
.qrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #f0f0f0;
border-radius:6px;margin-bottom:8px;font-size:12.5px}
.qrow.best{border-color:#b7eb8f;background:#f6ffed}
.qrow .sup{flex:1;font-weight:500}
.qrow .num{width:88px;text-align:right;font-variant-numeric:tabular-nums}
.qrow .pc{width:70px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:rgba(0,0,0,.45)}

.placeholder{padding:40px;text-align:center;color:rgba(0,0,0,.25);font-size:13px}
.foot{text-align:center;color:rgba(0,0,0,.25);font-size:12px;margin-top:32px;line-height:1.9}
</style>
</head>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fc(n,d){return Number(n||0).toFixed(d==null?1:d);}
function money(n){return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}

var SCENES=[
  {id:1,t:'同零件多家比价',d:'谁贵谁便宜，差在哪一项'},
  {id:2,t:'材料费异常筛查',d:'同零件材料费不该差那么多'},
  {id:3,t:'制造费离群预警',d:'这个零件的制造费明显不对'},
  {id:4,t:'品类价差地图',d:'哪些品类水最深，先查哪里'}
];

function renderScenes(){
  document.getElementById('scenes').innerHTML = SCENES.map(function(s,i){
    return '<div class="scene'+(i===0?' on':'')+'" onclick="pick('+s.id+',this)">'
      +'<div class="sn">场景 '+s.id+'</div><div class="st">'+esc(s.t)+'</div>'
      +'<div class="sd">'+esc(s.d)+'</div></div>';
  }).join('');
}
window.pick=function(id,el){
  document.querySelectorAll('.scene').forEach(function(e){e.classList.remove('on');});
  el.classList.add('on');
  document.querySelectorAll('.pane').forEach(function(e){e.classList.remove('on');});
  document.getElementById('pane'+id).classList.add('on');
};

function renderAll(){
  var S=DATA.summary;
  document.getElementById('ver').textContent =
    DATA.generated_at+' · '+S.n_comparable_parts+' 个可比零件 · 源数据 '+DATA.source.records_raw
    +' 条 → 去重 '+DATA.source.records_deduped+' 条';
  document.getElementById('k1').textContent = fc(S.spread_med,1)+'%';
  document.getElementById('k2').textContent = fc(S.mat_gap_med,1)+'%';
  document.getElementById('k3').textContent = '11.9%';
  document.getElementById('k4').textContent = S.n_comparable_parts+' 个';

  renderScenes();
  renderP1(); renderP2(); renderP3(); renderP4(); renderDesign();

  document.getElementById('foot').innerHTML =
    '口径：仅统计「材料费、制造费同时 &gt; 0 且三项和 ≤ 出厂价×1.02」的真实拆解记录，已按 零件+供应商+价格 去重<br>'
    +'价差 =（最高价 − 最低价）/ 最低价；材料费差异同口径<br>'
    +'数据源：成本因子实测 quotes_flat.json（727 条）+ 本次导入 11 条';
}

/* 场景1：同零件比价 */
function renderP1(){
  var h='<div class="infobox"><b>什么时候用</b>：收到 2 家以上报价，或想复盘历史报价是否合理。'
    +'<br><b>输出什么</b>：价差多少、便宜的那家在哪一项占优、谈判该压哪一项。</div>';
  h+='<div style="display:flex;gap:10px;margin-bottom:14px;align-items:center">'
    +'<select id="selPart" onchange="showPart(this.value)" style="padding:7px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;min-width:420px">';
  DATA.parts.forEach(function(p,i){
    h+='<option value="'+i+'">'+esc(p.part)+' · '+esc(p.name)+' · '+p.vpps+'（'+p.n+'家报价，价差'+fc(p.spread,0)+'%）</option>';
  });
  h+='</select><span style="font-size:12px;color:rgba(0,0,0,.45)">按价差绝对额排序</span></div>';
  h+='<div id="partDetail"></div>';
  document.getElementById('pane1').innerHTML=h;
  showPart(0);
}

window.showPart=function(idx){
  var p=DATA.parts[idx];
  if(!p) return;
  var h='<div style="border:1px solid #f0f0f0;border-radius:8px;padding:18px;margin-bottom:14px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">'
    +'<div><div style="font-size:15px;font-weight:600">'+esc(p.name)+'</div>'
    +'<div style="font-size:12px;color:rgba(0,0,0,.45);margin-top:4px;font-family:ui-monospace,monospace">'
    +esc(p.part)+' · VPPS '+esc(p.vpps)+' · '+p.n+' 家报价</div></div>'
    +'<div style="text-align:right"><div style="font-size:22px;font-weight:600;color:#cf1322">'
    +fc(p.spread,0)+'%</div><div style="font-size:11.5px;color:rgba(0,0,0,.45)">价差（'
    +money(p.hi-p.lo)+' 元）</div></div></div>';

  h+='<table><thead><tr><th>供应商</th><th class="n">报价</th><th class="n">材料费</th>'
    +'<th class="n">制造费</th><th class="n">材料%</th><th class="n">制造%</th><th>判定</th></tr></thead><tbody>';
  p.quotes.forEach(function(q){
    h+='<tr'+(q.is_low?' class="best"':'')+'><td style="font-size:12px">'+esc(q.sup)+'</td>'
      +'<td class="n b">'+money(q.price)+'</td>'
      +'<td class="n">'+money(q.mat)+'</td><td class="n">'+money(q.mfg)+'</td>'
      +'<td class="n">'+fc(q.mat_pct,1)+'%</td><td class="n">'+fc(q.mfg_pct,1)+'%</td>'
      +'<td>'+(q.is_low?'<span class="tag green">最低价</span>':'')+'</td></tr>';
  });
  h+='</tbody></table>';

  // 自动诊断
  var lo=p.quotes[0], hi=p.quotes[p.quotes.length-1];
  var matDiff=hi.mat-lo.mat, mfgDiff=hi.mfg-lo.mfg, admDiff=(hi.adm||0)-(lo.adm||0);
  var total=hi.price-lo.price;
  var parts=[['材料费',matDiff],['制造费',mfgDiff],['管理费',admDiff]];
  parts.sort(function(a,b){return b[1]-a[1];});
  var main=parts[0];
  var share = total>0 ? main[1]/total*100 : 0;

  var matRatio = lo.mat>0 ? hi.mat/lo.mat : 1;
  var dataSuspect = matRatio >= 3;
  var boxCls = dataSuspect ? 'warnbox' : 'okbox';

  h+='<div class="'+boxCls+'" style="margin-top:16px;margin-bottom:0"><b>自动诊断</b>：'
    +'最高价（'+esc(hi.sup.slice(0,14))+'）比最低价（'+esc(lo.sup.slice(0,14))+') 贵 '
    +money(total)+' 元，其中 <b>'+main[0]+' 差 '+money(main[1])+' 元，占 '
    +fc(share,0)+'%</b>，是主要差距来源。';
  if(dataSuspect){
    h+='<br><b>⚠ 但这组数据可能不可比</b>：材料费差 <b>'+fc((matRatio-1)*100,0)+'%</b>'
      +'（'+money(lo.mat)+' vs '+money(hi.mat)+'），超过 3 倍。'
      +'同一零件的材料费不可能差这么多，更可能是：<br>'
      +'① 同一个零件号对应了不同规格（高低配 / 不同年款）<br>'
      +'② 一方把整套总成报成了一个零件<br>'
      +'③ 拆解口径不同（一方只报自制件材料，另一方含外购件）<br>'
      +'<b>先核对零件号与图纸，再谈价格。</b>';
  } else if(main[0]==='材料费' && matRatio>1.3){
    h+='<br>材料费差 <b>'+fc((matRatio-1)*100,0)+'%</b>，超出正常范围——'
      +'同一零件的材料费不该差这么多，建议要求对方提供材料牌号、净重、单价三项明细。';
  } else if(main[0]==='制造费'){
    h+='<br>制造费差异占主导，属正常区间——制造工艺、产线自动化程度、订单量都会影响，这恰恰是谈判可以压的部分。';
  }
  h+='</div></div>';

  // 结构对比条
  h+='<h4>成本结构对比</h4>';
  p.quotes.forEach(function(q){
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px">'
      +'<div style="width:130px;color:rgba(0,0,0,.65);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(q.sup.slice(0,14))+'</div>'
      +'<div style="flex:1;height:18px;background:#f5f5f5;border-radius:3px;overflow:hidden;display:flex">'
      +'<div style="width:'+q.mat_pct+'%;background:#1677ff"></div>'
      +'<div style="width:'+q.mfg_pct+'%;background:#faad14"></div>'
      +'<div style="width:'+Math.max(0,100-q.mat_pct-q.mfg_pct)+'%;background:#d9d9d9"></div>'
      +'</div><div style="width:110px;text-align:right;font-size:11px;color:rgba(0,0,0,.45)">'
      +'材料'+fc(q.mat_pct,0)+'% / 制造'+fc(q.mfg_pct,0)+'%</div></div>';
  });
  h+='<div class="legend" style="display:flex;gap:16px;font-size:11.5px;color:rgba(0,0,0,.45);margin-top:8px">'
    +'<span><i style="display:inline-block;width:9px;height:9px;background:#1677ff;border-radius:2px;margin-right:5px"></i>材料</span>'
    +'<span><i style="display:inline-block;width:9px;height:9px;background:#faad14;border-radius:2px;margin-right:5px"></i>制造</span>'
    +'<span><i style="display:inline-block;width:9px;height:9px;background:#d9d9d9;border-radius:2px;margin-right:5px"></i>其他</span></div>';
  document.getElementById('partDetail').innerHTML=h;
};

/* 场景2：材料费异常 */
function renderP2(){
  var bad=DATA.parts.filter(function(p){return p.mat_gap>30;}).sort(function(a,b){return b.mat_gap-a.mat_gap;});
  var h='<div class="infobox"><b>为什么这个能查</b>：材料费是成本里唯一「客观可验证」的部分'
    +'——同一零件的材料牌号、净重、单价基本固定，不同供应商报出来的材料费不该差太多。'
    +'<br><b>差得多意味着</b>：要么材料牌号被换了，要么损耗率虚高，要么把制造费挪进了材料费。'
    +'<br><b>但差 3 倍以上优先怀疑数据</b>——大概率是同一零件号对应了不同规格，不是报价问题。</div>';
  h+='<div class="warnbox">共 <b>'+bad.length+'</b> 个零件的材料费差异超过 30%，占可比零件的 '
    +fc(bad.length/DATA.summary.n_comparable_parts*100,0)+'%。这些是<b>可以直接发函质疑</b>的清单。</div>';
  h+='<table><thead><tr><th>零件</th><th>VPPS</th><th class="n">最低材料费</th><th class="n">最高材料费</th>'
    +'<th class="n">差异</th><th>质疑建议</th></tr></thead><tbody>';
  bad.slice(0,15).forEach(function(p){
    var suspect = p.mat_hi/p.mat_lo >= 3;
    var cls = suspect?'red':(p.mat_gap>50?'orange':'grey');
    var advice = suspect ? '<b style="color:#cf1322">先核零件号</b>（差 3 倍以上，疑似规格不同）'
               : (p.mat_gap>100?'要求提供材料明细':'索取牌号与净重');
    h+='<tr><td class="mono b">'+esc(p.part)+'</td><td>'+esc(p.vpps)+'</td>'
      +'<td class="n">'+money(p.mat_lo)+'</td><td class="n">'+money(p.mat_hi)+'</td>'
      +'<td class="n"><span class="tag '+cls+'">'+fc(p.mat_gap,0)+'%</span></td>'
      +'<td style="font-size:11.5px">'+advice+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('pane2').innerHTML=h;
}

/* 场景3：制造费离群 */
function renderP3(){
  var a=DATA.anomalies;
  var h='<div class="infobox"><b>什么时候用</b>：审报价时快速扫一遍，找出「本该低却很高」的项。'
    +'<br><b>判据</b>：同一 VPPS 内，某零件的制造占比超过该组中位数的 1.6 倍。</div>';
  h+='<div class="warnbox">识别出 <b>'+DATA.summary.n_anomaly+'</b> 条制造费显著偏高。'
    +'制造费是最容易「藏利润」的地方——不像材料费有客观参照。</div>';
  h+='<table><thead><tr><th>零件</th><th>VPPS</th><th>供应商</th>'
    +'<th class="n">制造占比</th><th class="n">组内中位</th><th class="n">倍数</th><th>动作</th></tr></thead><tbody>';
  a.slice(0,15).forEach(function(x){
    var cls = x.mult>=3?'red':(x.mult>=2?'orange':'grey');
    h+='<tr><td class="mono b">'+esc(x.part)+'</td><td>'+esc(x.vpps)+'</td>'
      +'<td style="font-size:11.5px">'+esc((x.sup||'').slice(0,14))+'</td>'
      +'<td class="n"><b>'+fc(x.val,1)+'%</b></td><td class="n">'+fc(x.med,1)+'%</td>'
      +'<td class="n"><span class="tag '+cls+'">'+fc(x.mult,1)+'x</span></td>'
      +'<td style="font-size:11.5px">'+(x.mult>=3?'必须索取工时明细':'了解工艺差异')+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('pane3').innerHTML=h;
}

/* 场景4：品类价差地图 */
function renderP4(){
  var c=DATA.cats;
  var mx=Math.max.apply(null,c.map(function(x){return x.med_spread;}));
  var h='<div class="infobox"><b>什么时候用</b>：季度复盘、品类策略制定、决定先查哪个品类。'
    +'<br><b>读法</b>：价差越大，说明该品类的报价越不规范、越有议价空间。</div>';
  h+='<table><thead><tr><th>VPPS</th><th class="n">可比零件</th><th>价差分布</th>'
    +'<th class="n">价差中位</th><th class="n">最大</th><th>建议</th></tr></thead><tbody>';
  c.forEach(function(x){
    var pct=x.med_spread/mx*100;
    var color = x.med_spread>100?'#ff4d4f':(x.med_spread>30?'#faad14':'#52c41a');
    var advice = x.med_spread>100?'<span class="tag red">重点整治</span>'
               : (x.med_spread>30?'<span class="tag orange">关注</span>':'<span class="tag green">稳定</span>');
    h+='<tr><td class="mono b">'+esc(x.vpps)+'</td><td class="n">'+x.n_parts+'</td>'
      +'<td><div class="spreadbar"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div></td>'
      +'<td class="n b" style="color:'+color+'">'+fc(x.med_spread,1)+'%</td>'
      +'<td class="n">'+fc(x.max_spread,0)+'%</td><td>'+advice+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('pane4').innerHTML=h;
}

/* 产品形态 */
function renderDesign(){
  var d='';
  d+='<div><b>1. 形态：挂进 RFQ 询价页，不是一个独立系统</b><br>'
    +'采购员不需要「打开成本库」，他们需要的是<span class="hl">在收到报价的同一个页面，看到这个零件的横向对比</span>。'
    +'成本库应该是报价列表右侧的一个抽屉，不是一个要单独登录的新系统。</div>';

  d+='<div><b>2. 主视图：从「估一个数」改成「排一个序 + 标一个异常」</b><br>'
    +'当前估算原型是「输入参数 → 输出预估价 → 对比报价」，这仍然是纵向思维。'
    +'应该改成<span class="hl">「L 家报价 → 横向排名 → 标出谁在哪一项异常」</span>。'
    +'只有 1 家报价时才退回纵向估算。</div>';

  d+='<div><b>3. 三个必看指标（按可信度排序）</b><br>'
    +'① <b>材料费离散度</b>——最客观，直接可质疑；<br>'
    +'② <b>制造费占比离群</b>——最容易藏利润；<br>'
    +'③ <b>管理费率</b>——各供应商口径不一，只能同供应商对比。<br>'
    +'<span style="color:rgba(0,0,0,.45)">不要主推「估算总价」，因为它的误差（11.9%）小于报价本身的离散度（27.5%），信息量有限。</span></div>';

  d+='<div><b>4. 数据够了才亮的灯</b><br>'
    +'可比零件 <5 个就不给品类结论；同零件只有 1 家报价就不给横向判断；'
    +'拆解率 <30% 的 VPPS 标灰。<span class="bad">宁可不给，也不要给一个凭 1 条数据算的结论</span>。</div>';

  d+='<div><b>5. 闭环：谈判结果要回写</b><br>'
    +'现在的成本库只有「报价」，没有「成交」。谈完之后实际成交价、对方让了哪一项，'
    +'必须回写。<span class="hl">「材料费让了 8%、制造费没让」这种信息，比任何因子都值钱</span>——'
    +'它直接告诉你下一轮该压哪里。</div>';

  document.getElementById('design').innerHTML=d;
}

renderAll();
</script>
