    if(Math.abs(dMat)>=15){diag='结构严重偏离';dcls='red';}
    else if(dMat>=8){diag='材料偏高';dcls='orange';}
    else if(dMat<=-8){diag='材料偏低';dcls='orange';}
    else if(isLow){diag='结构最接近历史';dcls='green';}
    else{diag='结构正常';}
    h+='<tr'+(isLow?' class="best"':'')+'><td style="font-size:11.5px">'+esc((q.sup||'').slice(0,15))+'</td>'
      +'<td class="n b">'+money(q.pf)+'</td>'
      +'<td class="n">'+money(q.mat)+'</td>'
      +'<td class="n">'+fc(q.matPct)+'%</td>'
      +'<td class="n">'+tag(dMat)+'</td>'
      +'<td class="n">'+fc(q.mfgPct)+'%</td>'
      +'<td class="n">'+tag(dMfg)+'</td>'
      +'<td><span class="tag '+dcls+'">'+diag+'</span></td></tr>';
  });
  h+='</tbody></table>';

  // 结论
  h+='<div style="margin-top:12px">';
  if(matRatio>=3){
    h+='<div class="warnbox"><b>⚠ 本轮数据不可比，先核零件号</b><br>'
      +'材料费差 '+fc((matRatio-1)*100,0)+'%（'+money(lo.mat)+' vs '+money(hi.mat)+'），超过 3 倍。'
      +'同一零件的材料费不可能差这么多，优先排查：① 零件号是否对应不同规格 '
      +'② 是否有供应商把总成报成零件 ③ 拆解口径是否一致。'
      +'<br><b>这三条不确认，任何比价结论都不成立。</b></div>';
  } else if(v.n<5){
    h+='<div class="infobox"><b>样本不足，只给参考不给结论</b><br>'
      +'该 VPPS 只有 '+v.n+' 条历史拆解，不足 5 条。'
      +'本轮价差 '+fc((hi.pf-lo.pf)/lo.pf*100,0)+'% 可参考，但不能据此判断谁不合理。<br>'
      +'建议先按材料费绝对值横向看——材料费是客观项，不需要历史样本。</div>';
  } else {
    var highMat=cur.items.filter(function(q){return q.matPct>v.mat+8;});
    var lowMat=cur.items.filter(function(q){return q.matPct<v.mat-8;});
    h+='<div class="okbox"><b>✓ 数据可比（历史 '+v.n+' 条）</b><br>'
      +'历史材料占比中位 '+fc(v.mat)+'%。最低价（'+esc((lo.sup||'').slice(0,10))+'）材料占比 '
      +fc(lo.matPct)+'%，与历史偏差 '+(lo.matPct-v.mat>0?'+':'')+fc(lo.matPct-v.mat)+'pp，结构合理。';
    if(highMat.length){
      h+='<br><b>材料偏高需核对</b>：'+highMat.map(function(q){
        return esc((q.sup||'').slice(0,8))+'（'+fc(q.matPct)+'%，+'+fc(q.matPct-v.mat)+'pp）';
      }).join('、')+' — 可索取材料牌号、净重、单价三项。';
    }
    if(lowMat.length){
      h+='<br><b>材料偏低也要问</b>：'+lowMat.map(function(q){
        return esc((q.sup||'').slice(0,8))+'（'+fc(q.matPct)+'%，'+fc(q.matPct-v.mat)+'pp）';
      }).join('、')+' — 可能是少报材料（后续涨价风险），或成本挪到了制造费。';
    }
    h+='</div>';
  }
  h+='</div>';

  h+='</div>';
  return h;
}

window.gotoPart=function(i){
  ST.part=i;
  render();
  document.querySelectorAll('.blk')[1].scrollIntoView({behavior:'smooth',block:'start'});
};

/* ===== 细项抽屉 ===== */
window.openDetail=function(part,sup){
  var rows=EP.rows.filter(function(r){return r.part===part && r.sup===sup;});
  var r=rows[0];
  if(!r){toast('未找到该报价');return;}

  document.getElementById('dwTitle').textContent=r.sup||'报价细项';
  document.getElementById('dwMeta').textContent=
    r.part+' · '+(r.name||'')+' · '+r.rfq+' · '+(r.project||'')+' · '+(r.deep||'');

  var h='<div style="margin-bottom:14px">'
    +'<div style="font-size:32px;font-weight:600;color:#1890ff;line-height:1.1">¥'+money(r.pf)+'</div>'
    +'<div style="font-size:11.5px;color:rgba(0,0,0,.45);margin-top:3px">出厂价（未税）'
    +'　到厂 ¥'+money(r.unit)+'</div></div>';

  // 结构条
  h+='<div class="sbar">'
    +'<div style="width:'+r.matPct+'%;background:#1890ff"></div>'
    +'<div style="width:'+r.mfgPct+'%;background:#faad14"></div>'
    +'<div style="width:'+Math.max(0,r.admPct)+'%;background:#722ed1"></div>'
    +'<div style="width:'+Math.max(0,100-r.matPct-r.mfgPct-r.admPct)+'%;background:#d9d9d9"></div>'
    +'</div>';
  h+='<div class="sleg">'
    +'<span><i style="background:#1890ff"></i>材料 '+fc(r.matPct)+'%</span>'
    +'<span><i style="background:#faad14"></i>制造 '+fc(r.mfgPct)+'%</span>'
    +'<span><i style="background:#722ed1"></i>管理 '+fc(r.admPct)+'%</span>'
    +'<span><i style="background:#d9d9d9"></i>其他 '+fc(100-r.matPct-r.mfgPct-r.admPct)+'%</span></div>';

  // 六组细项
  var groups=[
    {t:'一、材料费',total:r.mat,items:[['原材料',r.raw,'元'],['外购件',r.purch,'元']]},
    {t:'二、制造费',total:r.mfg,items:[['设备折旧',r.equip,'元'],['人工费',r.labor,'元'],
      ['报废费',r.scrap,'元'],['能耗费',r.energy,'元'],['耗材费',r.consum,'元']]},
    {t:'三、管理费',total:r.adm,items:[['DB 管理费',r.admDb,'元'],['利润',r.admProfit,'元']]},
    {t:'四、物流费',total:r.logi,items:[['包装费',r.pack,'元'],['运输费',r.transport,'元'],['仓储费',r.storage,'元']]},
    {t:'五、一次性分摊',total:r.toolUnit+r.devUnit,items:[
      ['模具单件分摊',r.toolUnit,'元'],['开发单件分摊',r.devUnit,'元']]},
  ];
  groups.forEach(function(g){
    var sum=g.items.reduce(function(a,i){return a+(Number(i[1])||0);},0);
    var allZero=(sum===0&&(!g.total||g.total===0));
    if(allZero)return;
    var diff=g.total>0?sum-g.total:0;
    var okSum=g.total>0?Math.abs(diff)/g.total<0.02:true;
    h+='<div class="fg"><div class="fg-h"><span class="t">'+esc(g.t)+'</span>'
      +(g.total>0?'<span class="v'+(okSum?'':' bad')+'">'+money(g.total)+'</span>':'')
      +'</div>';
    if(!okSum){
      h+='<div class="fdiff">明细合计 '+money(sum)+'，与总额差 '+money(Math.abs(diff))
        +'（'+fc(Math.abs(diff)/g.total*100,1)+'%）'
        +'<span class="tip">源数据本身不一致，非计算错误</span></div>';
    }
    h+='<table>';
    g.items.forEach(function(i){
      var v=Number(i[1])||0;
      h+='<tr><td>'+esc(i[0])+'</td><td class="n">'
        +(v?money(v)+' '+i[2]:'<span class="z">—</span>')+'</td></tr>';
    });
    h+='</table></div>';
  });

  // 一次性费用总额
  if(r.toolTotal>0||r.devTotal>0){
    h+='<div class="fg"><div class="fg-h"><span class="t">一次性费用（总额）</span></div>'
      +(r.toolTotal>0?'<div style="font-size:11.5px;color:rgba(0,0,0,.65);padding:3px 0">'
        +'模具总额 <b>¥'+money0(r.toolTotal)+'</b>　分摊量 '+money0(r.toolQty)
        +' → 单件 <b>¥'+money(r.toolUnit)+'</b></div>':'')
      +(r.devTotal>0?'<div style="font-size:11.5px;color:rgba(0,0,0,.65);padding:3px 0">'
        +'开发总额 <b>¥'+money0(r.devTotal)+'</b>　分摊量 '+money0(r.devQty)
        +' → 单件 <b>¥'+money(r.devUnit)+'</b></div>':'')
      +'</div>';
  }

  // 勾稽
  var sumAll=r.mat+r.mfg+r.adm;
  var d=r.pf-sumAll;
  var ok=Math.abs(d)/r.pf<0.02;
  h+='<div class="'+(ok?'okbox':'warnbox')+'" style="margin-top:12px">'
    +'<b>'+(ok?'✓ 勾稽通过':'⚠ 勾稽不符')+'</b>：材料 '+money(r.mat)+' + 制造 '+money(r.mfg)
    +' + 管理 '+money(r.adm)+' = '+money(sumAll)+'，出厂价 '+money(r.pf)
    +'，差 '+money(d)+'（'+fc(d/r.pf*100,2)+'%）</div>';

  document.getElementById('dwBody').innerHTML=h;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('mask').classList.add('on');
};
window.closeDrawer=function(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('mask').classList.remove('on');
};

document.addEventListener('DOMContentLoaded',render);
</script>
