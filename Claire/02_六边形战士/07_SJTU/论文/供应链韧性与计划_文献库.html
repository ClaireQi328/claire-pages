function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  data.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.style.background = i % 2 === 0 ? '#fff' : '#f8fafc';
    tr.style.borderBottom = '1px solid #e2e8f0';
    tr.innerHTML = `
      <td style="padding:8px;color:#94a3b8;font-size:12px;">${p.id}</td>
      <td style="padding:8px;"><a href="${p.url}" target="_blank" style="color:#2563eb;text-decoration:none;font-weight:500;">${p.title}</a></td>
      <td style="padding:8px;color:#64748b;font-size:12px;">${p.author}</td>
      <td style="padding:8px;color:#64748b;font-size:12px;">${p.year}</td>
      <td style="padding:8px;color:#64748b;font-size:12px;">${p.journal}</td>
      <td style="padding:8px;"><span style="background:#e0e7ff;color:#4338ca;padding:2px 8px;border-radius:10px;font-size:11px;">${p.topic}</span></td>
      <td style="padding:8px;text-align:center;color:${p.quality==='★★★'?'#d97706':p.quality==='★★'?'#059669':'#94a3b8'};font-size:12px;">${p.quality}</td>
      <td style="padding:8px;text-align:center;"><span style="background:${p.lang==='EN'?'#dbeafe':'#dcfce7'};color:${p.lang==='EN'?'#1e40af':'#166534'};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;">${p.lang}</span></td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('totalCount').textContent = data.length;
}

function filterTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const topic = document.getElementById('topicFilter').value;
  const lang = document.getElementById('langFilter').value;
  const quality = document.getElementById('qualityFilter').value;
  const filtered = papers.filter(p => {
    const matchSearch = !search || p.title.toLowerCase().includes(search) || p.author.toLowerCase().includes(search) || p.topic.toLowerCase().includes(search);
    const matchTopic = !topic || p.topic === topic;
    const matchLang = !lang || p.lang === lang;
    const matchQuality = !quality || p.quality === quality;
    return matchSearch && matchTopic && matchLang && matchQuality;
  });
  renderTable(filtered);
}

renderTable(papers);
