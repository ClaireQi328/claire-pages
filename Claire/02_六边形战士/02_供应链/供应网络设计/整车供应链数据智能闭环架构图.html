<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整车供应链数据智能闭环架构图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #f8fbff 0%, #ffffff 48%, #f8fafc 100%);
    color: #1f2937;
    padding: 34px 22px;
  }
  .container { max-width: 1480px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #15304f;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
  }
  svg { width: 100%; max-width: 1480px; display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="container">
  <h1>汽车整车供应链数据智能闭环架构图</h1>
  <p class="subtitle">数据采集感知 → 数据汇聚（主数据 + 业务流程运行）→ 数据融合分析模型 → 异常推荐与人机协同决策 → 闭环回写执行系统</p>

  <svg viewBox="0 0 1480 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="汽车整车供应链数据智能闭环架构图">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#f3f7fb"/>
      </linearGradient>
      <linearGradient id="execGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#e9d8fd"/>
        <stop offset="50%" stop-color="#dbeafe"/>
        <stop offset="100%" stop-color="#dcfce7"/>
      </linearGradient>
      <linearGradient id="decisionGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff7ed"/>
        <stop offset="100%" stop-color="#fef3c7"/>
      </linearGradient>
      <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#334155" flood-opacity=".10"/>
      </filter>
      <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#334155" flood-opacity=".08"/>
      </filter>
      <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#2563eb"/>
      </marker>
      <marker id="arrowGreen" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#16a34a"/>
      </marker>
      <marker id="arrowAmber" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
        <path d="M0,0 L12,5 L0,10 Z" fill="#d97706"/>
      </marker>
      <style>
        .layer-title { font-size: 18px; font-weight: 800; fill: #0f172a; }
        .layer-sub { font-size: 11px; fill: #64748b; }
        .section-label { font-size: 13px; font-weight: 800; fill: #334155; }
        .box-title { font-size: 12px; font-weight: 800; fill: #1e293b; }
        .box-text { font-size: 10px; fill: #475569; }
        .tiny { font-size: 9px; fill: #64748b; }
        .tag { font-size: 10px; font-weight: 700; fill: #fff; }
        .pill-text { font-size: 10px; fill: #334155; font-weight: 650; }
      </style>
    </defs>

    <rect x="18" y="18" width="1444" height="944" rx="26" fill="url(#bg)" stroke="#dbe5f2"/>

    <!-- Top business domain ribbon from the original workflow -->
    <g filter="url(#softShadow)">
      <path d="M60 42 H420 L438 66 L420 90 H60 L78 66 Z" fill="#8b5cf6"/>
      <path d="M438 42 H1112 L1130 66 L1112 90 H438 L456 66 Z" fill="#93c5fd"/>
      <path d="M1130 42 H1420 L1438 66 L1420 90 H1130 L1148 66 Z" fill="#86c59a"/>
      <text x="245" y="72" text-anchor="middle" font-size="16" fill="#fff" font-weight="800">研发工程</text>
      <text x="784" y="72" text-anchor="middle" font-size="16" fill="#17324d" font-weight="800">零件采购</text>
      <text x="1284" y="72" text-anchor="middle" font-size="16" fill="#174329" font-weight="800">物流保供</text>
    </g>

    <!-- Layer 5: closed-loop execution orchestration -->
    <g filter="url(#shadow)">
      <rect x="70" y="112" width="1340" height="118" rx="18" fill="#eef6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="98" y="143" class="layer-title">05 · 闭环执行协同层</text>
      <text x="98" y="162" class="layer-sub">Workflow / Write-back / Execution Feedback — 异常处置动作回写到采购、质量、物流、财务与供应商系统</text>

      <rect x="260" y="176" width="170" height="34" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="345" y="197" text-anchor="middle" class="pill-text">流程编排 / 待办派发</text>
      <rect x="462" y="176" width="170" height="34" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="547" y="197" text-anchor="middle" class="pill-text">审批 / 签核 / 留痕</text>
      <rect x="664" y="176" width="170" height="34" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="749" y="197" text-anchor="middle" class="pill-text">任务 SLA / 升级</text>
      <rect x="866" y="176" width="170" height="34" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="951" y="197" text-anchor="middle" class="pill-text">执行系统回写 API</text>
      <rect x="1068" y="176" width="170" height="34" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="1153" y="197" text-anchor="middle" class="pill-text">结果复盘 / 模型迭代</text>
    </g>

    <!-- Layer 4: human decision -->
    <g filter="url(#shadow)">
      <rect x="70" y="265" width="1340" height="142" rx="18" fill="url(#decisionGrad)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="98" y="296" class="layer-title">04 · 异常推荐与人机协同决策层</text>
      <text x="98" y="315" class="layer-sub">AI Recommendation + Human in the Loop — 识别异常后推荐责任人、根因、处置路径，由业务专家确认后闭环执行</text>

      <rect x="104" y="340" width="235" height="46" rx="12" fill="#fff" stroke="#fed7aa"/>
      <text x="222" y="360" text-anchor="middle" class="box-title">推荐责任人与协同角色</text>
      <text x="222" y="376" text-anchor="middle" class="box-text">采购 / SQE / 物流 / PM / 财务 / 供应商</text>

      <rect x="370" y="340" width="235" height="46" rx="12" fill="#fff" stroke="#fed7aa"/>
      <text x="488" y="360" text-anchor="middle" class="box-title">推荐处置策略</text>
      <text x="488" y="376" text-anchor="middle" class="box-text">催交 / 替代料 / 切供 / 锁变更 / 调计划</text>

      <rect x="636" y="340" width="235" height="46" rx="12" fill="#fff" stroke="#fed7aa"/>
      <text x="754" y="360" text-anchor="middle" class="box-title">决策依据可解释</text>
      <text x="754" y="376" text-anchor="middle" class="box-text">影响车型 / 缺口天数 / 金额 / 质量风险</text>

      <rect x="902" y="340" width="235" height="46" rx="12" fill="#fff" stroke="#fed7aa"/>
      <text x="1020" y="360" text-anchor="middle" class="box-title">业务规则 + 案例库</text>
      <text x="1020" y="376" text-anchor="middle" class="box-text">阈值规则 / 历史处置 / 专家知识</text>

      <rect x="1168" y="340" width="206" height="46" rx="12" fill="#fff" stroke="#fed7aa"/>
      <text x="1271" y="360" text-anchor="middle" class="box-title">管理驾驶舱</text>
      <text x="1271" y="376" text-anchor="middle" class="box-text">红黄绿预警 / 闭环率 / 风险热力</text>
    </g>

    <!-- Layer 3: fusion analysis model -->
    <g filter="url(#shadow)">
      <rect x="70" y="442" width="1340" height="158" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
      <text x="98" y="473" class="layer-title">03 · 数据融合的业务分析模型层</text>
      <text x="98" y="492" class="layer-sub">Traceability / Warning / Prevention — 将 BOM、采购、供应、物流、质量、财务和项目节点融合成可计算的供应链风险模型</text>

      <rect x="104" y="518" width="245" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="226" y="539" text-anchor="middle" class="box-title">全链路追溯模型</text>
      <text x="226" y="555" text-anchor="middle" class="box-text">车型-零件-BOM-供应商-订单-批次-物流-质量</text>

      <rect x="377" y="518" width="245" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="500" y="539" text-anchor="middle" class="box-title">供应与交付预警模型</text>
      <text x="500" y="555" text-anchor="middle" class="box-text">缺料 / 延期 / 产能 / 库存覆盖 / 运输阻断</text>

      <rect x="650" y="518" width="245" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="772" y="539" text-anchor="middle" class="box-title">成本与结算异常模型</text>
      <text x="772" y="555" text-anchor="middle" class="box-text">预算偏差 / 退补 / 价格协议 / 发票匹配</text>

      <rect x="923" y="518" width="245" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="1046" y="539" text-anchor="middle" class="box-title">质量与变更影响模型</text>
      <text x="1046" y="555" text-anchor="middle" class="box-text">PPAP / APQP / 设计变更 / 问题闭环影响</text>

      <rect x="1196" y="518" width="178" height="56" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="1285" y="539" text-anchor="middle" class="box-title">预防与仿真模型</text>
      <text x="1285" y="555" text-anchor="middle" class="box-text">SOP 风险 / 替代方案 / 库存策略</text>
    </g>

    <!-- Layer 2: data convergence -->
    <g filter="url(#shadow)">
      <rect x="70" y="635" width="1340" height="152" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="98" y="666" class="layer-title">02 · 数据汇聚层（主数据 + 业务流程运行数据）</text>
      <text x="98" y="685" class="layer-sub">MDM + Process Mining + Lakehouse — 统一编码、统一关系、统一流程状态，形成供应链运行事实表与知识图谱</text>

      <rect x="104" y="710" width="290" height="52" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="249" y="730" text-anchor="middle" class="box-title">主数据域</text>
      <text x="249" y="746" text-anchor="middle" class="box-text">车型 / 项目 / 零件 / BOM / 供应商 / 工厂 / 仓库</text>

      <rect x="424" y="710" width="290" height="52" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="569" y="730" text-anchor="middle" class="box-title">业务流程运行数据</text>
      <text x="569" y="746" text-anchor="middle" class="box-text">SOR / 定点 / 合同 / 订单 / 发运 / 入库 / 结算</text>

      <rect x="744" y="710" width="290" height="52" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="889" y="730" text-anchor="middle" class="box-title">实时事件与日志</text>
      <text x="889" y="746" text-anchor="middle" class="box-text">状态变更 / 审批节点 / 消息通知 / 接口回执</text>

      <rect x="1064" y="710" width="310" height="52" rx="12" fill="#ffffff" stroke="#ddd6fe"/>
      <text x="1219" y="730" text-anchor="middle" class="box-title">湖仓 + 指标 + 知识图谱</text>
      <text x="1219" y="746" text-anchor="middle" class="box-text">ODS / DWD / DWS / 指标口径 / 关系网络</text>
    </g>

    <!-- Layer 1: acquisition and perception -->
    <g filter="url(#shadow)">
      <rect x="70" y="822" width="1340" height="108" rx="18" fill="url(#execGrad)" stroke="#7aa7dc" stroke-width="1.5"/>
      <text x="98" y="853" class="layer-title">01 · 数据采集感知层（面向原有执行系统与现场触点）</text>
      <text x="98" y="872" class="layer-sub">API / EDI / IoT / RPA / OCR / Event Bus — 从研发、采购、供应商、质量、物流、财务等系统采集业务事实与现场状态</text>

      <rect x="102" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#c4b5fd"/><text x="151" y="909" text-anchor="middle" class="pill-text">MIBOM</text>
      <rect x="214" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#c4b5fd"/><text x="263" y="909" text-anchor="middle" class="pill-text">EP 采购</text>
      <rect x="326" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#c4b5fd"/><text x="375" y="909" text-anchor="middle" class="pill-text">TAKO 门户</text>
      <rect x="438" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#bfdbfe"/><text x="487" y="909" text-anchor="middle" class="pill-text">SAP</text>
      <rect x="550" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#bfdbfe"/><text x="599" y="909" text-anchor="middle" class="pill-text">SRM</text>
      <rect x="662" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#bfdbfe"/><text x="711" y="909" text-anchor="middle" class="pill-text">合同系统</text>
      <rect x="774" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#bbf7d0"/><text x="823" y="909" text-anchor="middle" class="pill-text">SCP</text>
      <rect x="886" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#bbf7d0"/><text x="935" y="909" text-anchor="middle" class="pill-text">SCM</text>
      <rect x="998" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#bbf7d0"/><text x="1047" y="909" text-anchor="middle" class="pill-text">PFEP</text>
      <rect x="1110" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#c4b5fd"/><text x="1159" y="909" text-anchor="middle" class="pill-text">SQMS</text>
      <rect x="1222" y="892" width="98" height="26" rx="7" fill="#fff" stroke="#c4b5fd"/><text x="1271" y="909" text-anchor="middle" class="pill-text">VIIM</text>
      <rect x="1334" y="892" width="58" height="26" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1363" y="909" text-anchor="middle" class="pill-text">IoT</text>
    </g>

    <!-- Main upward data flow -->
    <path d="M740 822 V793" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M740 635 V606" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <path d="M740 442 V413" stroke="#d97706" stroke-width="4" marker-end="url(#arrowAmber)"/>
    <path d="M740 265 V236" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

    <!-- Side governance capabilities -->
    <g filter="url(#softShadow)">
      <rect x="92" y="604" width="185" height="24" rx="12" fill="#334155"/>
      <text x="185" y="621" text-anchor="middle" class="tag">数据治理：编码 / 口径 / 血缘 / 质量</text>
      <rect x="1118" y="604" width="260" height="24" rx="12" fill="#334155"/>
      <text x="1248" y="621" text-anchor="middle" class="tag">安全合规：权限 / 脱敏 / 审计 / 供应商边界</text>
    </g>

    <!-- Closed loop down to execution systems -->
    <path d="M1394 171 C1444 252, 1444 494, 1396 610 C1366 682, 1372 752, 1392 842" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrowGreen)"/>
    <rect x="1232" y="238" width="204" height="48" rx="14" fill="#ecfdf5" stroke="#22c55e"/>
    <text x="1334" y="258" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">闭环反馈</text>
    <text x="1334" y="275" text-anchor="middle" class="box-text">处置结果沉淀为规则、案例和训练样本</text>

    <!-- Scenario cards -->
    <g filter="url(#softShadow)">
      <rect x="86" y="240" width="160" height="42" rx="12" fill="#fff" stroke="#cbd5e1"/>
      <text x="166" y="258" text-anchor="middle" class="box-title">典型异常 1</text>
      <text x="166" y="274" text-anchor="middle" class="box-text">SOP 前关键件缺料</text>

      <rect x="86" y="412" width="160" height="42" rx="12" fill="#fff" stroke="#cbd5e1"/>
      <text x="166" y="430" text-anchor="middle" class="box-title">典型异常 2</text>
      <text x="166" y="446" text-anchor="middle" class="box-text">设计变更影响采购交付</text>

      <rect x="86" y="790" width="160" height="26" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <text x="166" y="808" text-anchor="middle" class="tiny">由执行系统事件触发分析</text>
    </g>

    <!-- Value note -->
    <g filter="url(#softShadow)">
      <rect x="314" y="930" width="852" height="24" rx="12" fill="#0f172a" opacity=".88"/>
      <text x="740" y="947" text-anchor="middle" font-size="11" fill="#e2e8f0" font-weight="700">
        核心价值：把原流程图中的系统接口关系升级为“数据驱动 + 模型预警 + 人机决策 + 执行闭环”的供应链智能运营架构
      </text>
    </g>
  </svg>
</div>
</body>
</html>
