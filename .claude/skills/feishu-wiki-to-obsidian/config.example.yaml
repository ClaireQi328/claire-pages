# feishu-wiki-to-obsidian 配置文件
# 复制为 config.yaml 并修改

source:
  type: feishu
  auth:
    scope: "wiki:node:read,drive:drive:readonly"

target:
  vault: "."                       # Obsidian vault 根目录
  folder: "Documents"              # 目标文件夹名
  tags: [Documents]                # YAML frontmatter 默认标签

images:
  width: 600                       # 图片默认宽度限制
  parallel: 10                     # 并行下载数
  retry: 3                         # 下载失败重试次数

conversion:
  tables: true                     # 从 XML 还原表格
  callouts: true                   # 关键摘要转 Obsidian callout
  cross_refs: true                 # 生成文档间交叉引用
  max_cross_refs: 5                # 每个文档最多引用数

beautify:
  frontmatter: true                # 添加 YAML frontmatter
  heading_hierarchy: true          # 修复标题层级
  section_dividers: true           # 添加章节分隔线
  cjk_spacing: true                # CJK/英文间距修复
  clean_artifacts: true            # 清理多余空行等
