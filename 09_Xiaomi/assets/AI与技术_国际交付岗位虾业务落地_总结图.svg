<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:42px;font-weight:800;fill:#111827;}
      .subtitle{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:22px;fill:#4b5563;}
      .h{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:24px;font-weight:800;fill:#111827;}
      .text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:18px;fill:#374151;}
      .small{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:15px;fill:#4b5563;}
      .num{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:34px;font-weight:900;fill:#ea580c;}
      .card{fill:#ffffff;stroke:#e5e7eb;stroke-width:1.5;rx:24;filter:url(#shadow);}
      .orange{fill:#fff7ed;stroke:#fed7aa;}
      .blue{fill:#eff6ff;stroke:#bfdbfe;}
      .green{fill:#f0fdf4;stroke:#bbf7d0;}
      .purple{fill:#faf5ff;stroke:#e9d5ff;}
      .line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#arrow);}
      .tag{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:16px;font-weight:700;fill:#ffffff;}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1400" height="1050" fill="url(#bg)"/>
  <text x="70" y="80" class="title">国际交付岗位虾业务落地提炼</text>
  <text x="70" y="120" class="subtitle">四只岗位虾协同：让人做判断，让虾做执行，串联 OTC 从推单到履约闭环</text>

  <rect x="70" y="160" width="1260" height="150" class="card"/>
  <text x="105" y="205" class="h">一句话结论</text>
  <text x="105" y="242" class="text">国际交付已从“单点自动化 Skill”进入“岗位型数字员工矩阵”阶段：干线虾、交付虾、关务虾、仓管虾分别覆盖运输、交付运营、清关合规、仓储调度。</text>
  <text x="105" y="275" class="text">核心价值不是替代业务负责人，而是把高频、跨系统、可规则化的执行任务沉淀为可监控、可复制、可扩展的智能作业流。</text>

  <rect x="70" y="345" width="285" height="160" class="card orange"/>
  <text x="105" y="390" class="h">干线虾</text>
  <text x="105" y="425" class="text">干线运营数字员工</text>
  <text x="105" y="458" class="small">海运/空运推单、算柜、订舱</text>
  <text x="105" y="486" class="small">物流轨迹查询、超级搜索</text>

  <rect x="385" y="345" width="285" height="160" class="card blue"/>
  <text x="420" y="390" class="h">交付虾</text>
  <text x="420" y="425" class="text">交付运营数字员工</text>
  <text x="420" y="458" class="small">客户推单、调拨提单</text>
  <text x="420" y="486" class="small">重工管理、本地配送</text>

  <rect x="700" y="345" width="285" height="160" class="card green"/>
  <text x="735" y="390" class="h">关务虾</text>
  <text x="735" y="425" class="text">关务操作数字员工</text>
  <text x="735" y="458" class="small">制单制证、单证核验</text>
  <text x="735" y="486" class="small">合规排查、税率获取</text>

  <rect x="1015" y="345" width="315" height="160" class="card purple"/>
  <text x="1050" y="390" class="h">仓管虾</text>
  <text x="1050" y="425" class="text">仓库自主运行数字人</text>
  <text x="1050" y="458" class="small">智能排班、仓库/月台调度</text>
  <text x="1050" y="486" class="small">库存监控、异常预警</text>

  <text x="70" y="565" class="h">端到端链路</text>
  <rect x="70" y="600" width="170" height="82" rx="18" fill="#f97316"/>
  <text x="105" y="633" class="tag">1 推单</text><text x="98" y="660" class="tag">交付虾</text>
  <path d="M240 641 H300" class="line"/>
  <rect x="305" y="600" width="170" height="82" rx="18" fill="#8b5cf6"/>
  <text x="333" y="633" class="tag">2 仓储操作</text><text x="350" y="660" class="tag">仓管虾</text>
  <path d="M475 641 H535" class="line"/>
  <rect x="540" y="600" width="170" height="82" rx="18" fill="#0ea5e9"/>
  <text x="568" y="633" class="tag">3 干线运输</text><text x="587" y="660" class="tag">干线虾</text>
  <path d="M710 641 H770" class="line"/>
  <rect x="775" y="600" width="170" height="82" rx="18" fill="#22c55e"/>
  <text x="810" y="633" class="tag">4 清报关</text><text x="822" y="660" class="tag">关务虾</text>
  <path d="M945 641 H1005" class="line"/>
  <rect x="1010" y="600" width="170" height="82" rx="18" fill="#8b5cf6"/>
  <text x="1038" y="633" class="tag">5 本地仓储</text><text x="1056" y="660" class="tag">仓管虾</text>
  <path d="M1180 641 H1235" class="line"/>
  <rect x="1240" y="600" width="90" height="82" rx="18" fill="#f97316"/>
  <text x="1260" y="633" class="tag">6</text><text x="1256" y="660" class="tag">履约</text>

  <rect x="70" y="735" width="405" height="210" class="card"/>
  <text x="105" y="780" class="h">已验证价值</text>
  <text x="105" y="825" class="num">10000+</text><text x="245" y="825" class="text">干线推单里程碑</text>
  <text x="105" y="862" class="text">海/空运推单效率提升约 15-30 倍</text>
  <text x="105" y="895" class="text">关务草单核验从数小时降至分钟级</text>
  <text x="105" y="928" class="text">每月释放约 300+ 人天</text>

  <rect x="505" y="735" width="405" height="210" class="card"/>
  <text x="540" y="780" class="h">代表场景：虾米算柜</text>
  <text x="540" y="825" class="num">4.5min</text><text x="680" y="825" class="text">输出最优方案</text>
  <text x="540" y="862" class="text">SKU包规解析 → 托盘排布算法</text>
  <text x="540" y="895" class="text">装柜仿真 → 最优方案输出</text>
  <text x="540" y="928" class="text">装载率稳定约 92.2%，每柜多装约 3%</text>

  <rect x="940" y="735" width="390" height="210" class="card"/>
  <text x="975" y="780" class="h">后续方向</text>
  <text x="975" y="823" class="text">从 Skill 清单升级为岗位责任制</text>
  <text x="975" y="856" class="text">从被动查询升级为主动预警</text>
  <text x="975" y="889" class="text">从局部提效升级为 OTC 闭环经营</text>
  <text x="975" y="922" class="text">用 KPI 追踪形成持续优化飞轮</text>

  <text x="70" y="1005" class="small">提炼来源：[[国际交付岗位虾业务落地]]；OCR 自原始长图整理，局部数字以原图可识别内容为准。</text>
</svg>