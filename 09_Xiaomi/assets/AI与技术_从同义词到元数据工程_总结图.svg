<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:42px;font-weight:900;fill:#0f172a;}
      .subtitle{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:22px;fill:#475569;}
      .h{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:25px;font-weight:800;fill:#0f172a;}
      .text{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:18px;fill:#334155;}
      .small{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:15px;fill:#475569;}
      .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5;rx:24;filter:url(#shadow);}
      .cyan{fill:#ecfeff;stroke:#67e8f9;}
      .blue{fill:#eff6ff;stroke:#93c5fd;}
      .violet{fill:#f5f3ff;stroke:#c4b5fd;}
      .amber{fill:#fffbeb;stroke:#fcd34d;}
      .green{fill:#f0fdf4;stroke:#86efac;}
      .pill{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:17px;font-weight:800;fill:#ffffff;}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow);}
      .num{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;font-size:34px;font-weight:900;fill:#0891b2;}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="1050" fill="url(#bg)"/>
  <text x="70" y="82" class="title">从同义词到元数据工程</text>
  <text x="70" y="122" class="subtitle">DataAgent 真正听懂人话：不是调 prompt，而是补齐业务上下文</text>

  <rect x="70" y="160" width="1260" height="145" class="card"/>
  <text x="105" y="205" class="h">核心判断</text>
  <text x="105" y="242" class="text">同义词只能解决“叫法”，不能解决“该查哪张表、按哪个口径、什么场景禁用”。</text>
  <text x="105" y="274" class="text">让 DataAgent 变准的关键，是把业务知识沉淀成 AI 可消费的元数据工程。</text>

  <rect x="100" y="355" width="300" height="150" class="card cyan"/>
  <text x="135" y="400" class="h">1 同义词层</text>
  <text x="135" y="438" class="text">解决“叫法”</text>
  <text x="135" y="470" class="small">销售额 = 成交额 = GMV</text>
  <path d="M400 430 H505" class="arrow"/>

  <rect x="520" y="355" width="300" height="150" class="card blue"/>
  <text x="555" y="400" class="h">2 描述层</text>
  <text x="555" y="438" class="text">解决“边界”</text>
  <text x="555" y="470" class="small">字段含义、适用范围、样例</text>
  <path d="M820 430 H925" class="arrow"/>

  <rect x="940" y="355" width="330" height="150" class="card violet"/>
  <text x="975" y="400" class="h">3 业务规则层</text>
  <text x="975" y="438" class="text">解决“路由”</text>
  <text x="975" y="470" class="small">表选择、默认口径、权限、禁用场景</text>

  <text x="70" y="570" class="h">语义层 vs 上下文层</text>
  <rect x="70" y="610" width="600" height="180" class="card amber"/>
  <text x="105" y="655" class="h">语义层 Semantic Layer</text>
  <text x="105" y="695" class="text">回答：指标怎么算</text>
  <text x="105" y="728" class="small">度量定义 / 维度 / 口径一致 / 血缘溯源</text>
  <text x="105" y="760" class="small">BI 时代重点：让每个看板算得一致</text>

  <rect x="730" y="610" width="600" height="180" class="card green"/>
  <text x="765" y="655" class="h">上下文层 Context Layer</text>
  <text x="765" y="695" class="text">回答：何时、按什么规则用</text>
  <text x="765" y="728" class="small">路由 / 权限 / 新鲜度 / 禁用场景 / 默认口径</text>
  <text x="765" y="760" class="small">Agent 时代重点：让 AI 不只会算，还用得对</text>

  <rect x="70" y="835" width="390" height="145" class="card"/>
  <text x="105" y="880" class="h">典型翻车</text>
  <text x="105" y="918" class="text">“上个月交付了多少单？”</text>
  <text x="105" y="950" class="small">识别了“交付”，但查错快照表；应查动作明细表。</text>

  <rect x="505" y="835" width="390" height="145" class="card"/>
  <text x="540" y="880" class="h">产品启发</text>
  <text x="540" y="918" class="text">可信 DataAgent = SQL 能力 + 业务上下文</text>
  <text x="540" y="950" class="small">知道何时不该查、去哪查、按什么口径查。</text>

  <rect x="940" y="835" width="390" height="145" class="card"/>
  <text x="975" y="880" class="h">供应链迁移</text>
  <text x="975" y="918" class="text">订单、库存、交付、成本、供应商都需元数据</text>
  <text x="975" y="950" class="small">否则 Agent 只能猜字段、猜表、猜口径。</text>

  <text x="70" y="1020" class="small">提炼来源：[[从同义词到元数据工程]]；核心结论：元数据工程让 AI 理解正确，岗位虾让 AI 动作闭环。</text>
</svg>