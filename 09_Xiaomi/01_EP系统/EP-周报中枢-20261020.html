<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>EP 周报中枢</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:#fff;border-bottom:1px solid #f0f0f0}
.top h1{font-size:16px;font-weight:500;display:flex;align-items:center;gap:10px}
.top h1 .lg{width:22px;height:22px;border-radius:5px;background:#1677ff;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:500}
nav{display:flex;gap:2px;padding:0 24px;background:#fff;border-bottom:1px solid #f0f0f0}
nav a{padding:12px 20px;font-size:14px;color:#595959;cursor:pointer;border-bottom:2px solid transparent;text-decoration:none}
nav a.on{color:#1677ff;border-bottom-color:#1677ff;font-weight:500}
nav a:hover{color:#1677ff}
.wrap{padding:20px 24px;max-width:1400px}
.lnk{color:#1677ff;cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;line-height:20px;white-space:nowrap}
.bad{background:#fff1f0;color:#cf1322;border:1px solid #ffa39e}
.warn{background:#fff7e6;color:#d46b08;border:1px solid #ffd591}
.ok{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f}
.info{background:#e6f4ff;color:#0958d9;border:1px solid #91caff}
.card{background:#fff;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:18px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;gap:8px}
.ch h3{font-size:15px;font-weight:500}
.ch h3 .s{font-size:12px;color:#8c8c8c;font-weight:400;margin-left:8px}
.cb{padding:16px 18px}
.cb.p0{padding:0}
h2.sec{font-size:15px;font-weight:500;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2.sec .s{font-size:12px;color:#8c8c8c;font-weight:400}
.fnt{font-size:12px;color:#8c8c8c}
.av{display:flex;align-items:center;gap:6px;font-size:13px}
.av .d{width:7px;height:7px;border-radius:50%;background:#52c41a}

/* 本周要做 */
.do{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.docard{border:1px solid #f0f0f0;border-radius:8px;overflow:hidden}
.docard .h{padding:11px 14px;background:#fafafa;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px}
.docard .h b{font-size:14px;font-weight:500}
.docard .b{padding:12px 14px}
.todo{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #fafafa;align-items:flex-start}
.todo:last-child{border-bottom:none}
.todo .bx{width:15px;height:15px;border:1.5px solid #d9d9d9;border-radius:3px;flex-shrink:0;margin-top:3px}
.todo.done .bx{background:#52c41a;border-color:#52c41a}
.todo.done .tx{color:#bfbfbf;text-decoration:line-through}
.todo .tx{flex:1;font-size:13px;line-height:1.6}
.todo .tx .m{display:block;font-size:11px;color:#8c8c8c;margin-top:2px}
.todo .tag{flex-shrink:0}
.btn{padding:4px 11px;border:1px solid #d9d9d9;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;color:#595959}
.btn:hover{border-color:#1677ff;color:#1677ff}

/* 周报全文 */
.wk{border-bottom:1px solid #f0f0f0}
.wk:last-child{border-bottom:none}
.wkh{padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}
.wkh:hover{background:#fafafa}
.wkh b{font-size:15px;font-weight:500}
.wkb{padding:0 18px 18px;display:none}
.wkb.on{display:block}
.raw{background:#fcfcfb;border:1px solid #f0f0f0;border-radius:6px;padding:16px 18px;font-size:13px;line-height:1.9;color:#262626;word-break:break-word}
.raw strong{color:#0958d9;font-weight:600}
.raw table{border-collapse:collapse;margin:8px 0;width:100%;font-size:12px}
.raw td{border:1px solid #e8e8e8;padding:6px 9px;vertical-align:top}
.raw td:first-child{background:#fafafa;font-weight:500;width:150px;white-space:nowrap}
.raw ul{margin:6px 0;padding-left:20px}
.raw li{margin:3px 0}
.raw p{margin:6px 0}
.raw .h{font-weight:600;color:#262626;margin:10px 0 4px}
.raw a{color:#1677ff}
.empty{padding:36px;text-align:center;color:#bfbfbf;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.kc{background:#fff;border:1px solid #f0f0f0;border-radius:8px;padding:14px 16px;position:relative;overflow:hidden}
.kc .t{font-size:12px;color:#8c8c8c;margin-bottom:5px}
.kc .v{font-size:24px;font-weight:600;line-height:1.25}
.kc .d{font-size:11px;color:#8c8c8c;margin-top:4px}
.kc .a{position:absolute;left:0;top:0;bottom:0;width:3px}
.tl{position:relative;padding-left:19px}
.tl::before{content:'';position:absolute;left:5px;top:7px;bottom:7px;width:1px;background:#f0f0f0}
.tli{position:relative;margin-bottom:15px}
.tli::before{content:'';position:absolute;left:-17px;top:5px;width:7px;height:7px;border-radius:50%;background:#1677ff;border:2px solid #fff;box-shadow:0 0 0 1px #d9d9d9}
.tli.w::before{background:#fa8c16}
.tli b{font-size:13px;display:block;margin-bottom:3px}
.tli .c{font-size:12px;color:#595959;line-height:1.7}
select{padding:5px 10px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;font-size:13px;font-family:inherit;cursor:pointer}
.gm{position:relative}
.gbar{cursor:pointer;transition:opacity .12s}
.gbar:hover{opacity:1;outline:2px solid #1677ff;outline-offset:1px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;padding:10px 12px;text-align:left;font-weight:400;color:#595959;font-size:12px;white-space:nowrap;border-bottom:1px solid #f0f0f0}
td{padding:10px 12px;border-bottom:1px solid #fafafa;vertical-align:top}
</style>

（战略、杠杆、瓶颈、常规）搭建品类采购策略框架提供基础，进一步形成差异化议价、风险管理与供应商合作模式 | \n| **Q3** | **A+B价格联动** | 效率提升 | \n\n- **实现总成件与 DB 件价格的自动汇总联动：**当 DB 件价格发生变化时，系统自动触发总成件价格的重新计算与更新，无需人工调价；同时总成件采购可实时查看 DB 件价格，彻底替代线下手工计算。消除信息同步不及时导致的价格延迟与频繁补差，大幅降低人工干预成本与商务纠纷风险。 | \n| **Q3** | **样件自动下单** | 效率提升 | \n\n- **需求创建到订单履约的端到端自动化闭环**：打通从需求提报、审批、寻源、下单、交付确认至财务结算的全链路；系统自动监控各节点状态并触发后续动作。消除跨系统、跨部门的手工衔接延误；同时实现全流程可追溯、可审计，为样件采购的快速迭代与批量复制提供标准化自动化基座。\n- **需求聚合与订单聚类：**自动识别多维度（项目、物料、时间、供应商）相似需求，将零散样件需求按最优批次聚合，合并生成集约化订单。显著减少小批量、高频次订单数量，降低供应商处理与物流配送成本；同时提升议价权重，为后续定价策略提供更清晰的需求体量提供依据\n- **智能检索价格与生成定价任务**：基于历史价格库自动生成订单；针对无价格需求自动生成定价任务，完成定价后自动下单，提升下单效率\n- **订单到合同自动化**：系统自动调用合同模板，填充已确定的商务条款、价格、交付要求、质量标准等，生成电子化订单合同，并完成内部签章与外部在线确认。 | \n| **Q4** | **合同在线化** | 精细化 | \n\n- 统**一合同签署入口，构建供应商合同数据库**：复用并整合集团合同系统能力，收拢分散的合同签署通道，将历史与新增合同结构化入库，支持多维度快速检索与智能筛选。解决“合同多、查找难”的痛点，消除多系统重复维护与数据割裂。\n- **实现采购合同在 EP 统一查看，消除数据孤岛**：打通集团合同系统与 EP（采购/企业门户）平台，将合同数据同步至统一视图，支持采购、法务、业务方按权限集中查阅，无需跨系统跳转。提升用户查找与调阅效率；确保合同状态、条款、附件在 EP 端实时一致，提升跨部门协同体验与决策响应速度。 | \n| **Q4** | **供应商管理线上化**\n（数据入湖，AI出报表） | 精细化 | \n\n- **建立准入供应商资源池，替代传统长清单**：针对供应商数量与复杂度激增的现状，设置明确的准入标准与审核流程，形成动态更新的合格资源池，淘汰低效或高风险供应商。\n- **制定供应商综合绩效评价标准与奖惩机制**：构建涵盖质量、交付、成本、服务、技术等多维度的绩效模型，配套明确的奖惩措施（如份额调整、优选推荐、限期整改或淘汰），推动供应商持续改进；绩效结果直接挂钩采购决策，提升供应商履约规范性与积极性。\n- **实现供应商标签在线化，丰富信息维度**：将财务信息、全球工厂布局、客户情况等关键属性标签化，并支持多条件组合检索与分析。为寻源、风险评估、产能调配提供秒级可视的供应商画像，避免因信息不对称导致的错误定点或产能误判；同时支撑全球化采购策略与多元供应布局，增强供应链韧性。 | \n| **Q4** | **任务管理中台和体验优化**\n（AI agent的应用） | 效率提升 | \n\n- **实现任务整体进度可视化管理**：支持从车型、定点、定价、合同签署等多管理视角，实时查看进度百分比、关键节点完成情况、阻塞项与逾期风险。管理者与执行者无需反复开会或线下问询，即可秒级掌握全局与细节，降低沟通与管理成本\n- **优化任务管理体验，打造高效工作台**：根据用户工作流及各阶段需完成任务，动态生成任务模块，高效指引用户快速完成操作。 | \n| | **项目名称** | **价值** | **上线时间** | \n| | 量产补差自动下单 | | | \n| | 供应链出海采购全流程数字化 | | | \n| | 模具成本全生命周期管理 | | | \n| | 车型项目管理与采购成本分析 | | | \n| | 设计EP-SVC的工厂数据创建、审核、变更流程及数字化方案 | | | \n| | 上会：自动化文档，自动总结，AI智能推荐 | | |"},{"id":"reczz28PHn1ZL9WL","week":"W0302","start":"2026-03-02","status":"正常","data":"| **关键事项** | **架构梳理和方案评审** | **售后、出口管制、报价细项** | **4A架构** | **下一步计划** |  | **进度同步** |   - 结合E c":"P3 不做/线下","why":"纯界面体验，无业务影响","md":0,"how":"不单独立项，随下次前端迭代顺手调整","rel":"—"},{"id":"reczz28PI0k0qv7W","t":"颜色件发起价格变更 RFQ 出现报错","src":"问题登记","cl":"询价定点与RFQ缺陷","mod":"询价","dom":"采购域","dec":"P3 不做/线下","why":"已解决","md":0,"how":"已修复，归档","rel":"—"},{"id":"reczz28PI0k0usvu","t":"商务变价单供应商端显示 10 条，内部显示 20 条","src":"问题登记","cl":"询价定点与RFQ缺陷","mod":"商务变价","dom":"采购域","dec":"P2 顺手做","why":"内外数据不一致，业务会怀疑数据准确性","md":3,"how":"排查内外端分页口径差异，统一条数展示逻辑","rel":"—"},{"id":"reczz28PI0k0sNsS","t":"导出的报价详情有一个零件没有账期条件","src":"问题登记","cl":"询价定点与RFQ缺陷","mod":"询价","dom":"采购域","dec":"P2 顺手做","why":"数据缺失但已解决，说明是偶发","md":2,"how":"导出前加账期完整性校验，缺失时提示","rel":"—"},{"id":"reczz28PI0k0svFy","t":"订单数量异常（收货显示-1 / 数量变0 / 确认后成负数）共 5 单","src":"问题登记","cl":"订单与数量异常","mod":"订单","dom":"采购域","dec":"P1 排期做","why":"5 条同源问题（同一批次订单号段），已修复但未做根因收敛，随时会复发","md":10,"how":"同一根因（订单数量校验缺失）引发 5 单问题。补数量非负与一致性校验，做一次根因分析","rel":"CLI & Agent"},{"id":"reczz28PI0k0rFkl","t":"订单 V1 升 V2，V2 草稿状态供应商能看到","src":"问题登记","cl":"订单与数量异常","mod":"订单","dom":"采购域","dec":"P1 排期做","why":"数据权限泄露，草稿对供应商可见","md":3,"how":"草稿状态加权限过滤，供应商端只暴露已发起状态","rel":"订单自动化"},{"id":"reczz28PI0k0qqNt","t":"多个 EWO，不同研发是否能合并创建 RFQ","src":"业务建议","cl":"售后与操作便捷性","mod":"询价","dom":"采购域","dec":"P3 待评估","why":"涉及 EWO 与 RFQ 的关联模型设计，26Q4 待决策项 4 正在讨论 EWO 路由规则","md":0,"how":"先并入「EWO 重新定点路由」议题（待决策项 4）评估，确认规则后决定是否开发","rel":"品类应用迭代 II 收口"},{"id":"reczz28PI0k0rCz6","t":"售后 SWO 手动关联参考件支持批量关联 + SWO 打包处理","src":"业务建议","cl":"售后与操作便捷性","mod":"售后","dom":"采购域","dec":"P2 顺手做","why":"售后场景高频重复操作","md":5,"how":"批量关联 + 打包处理可作为一次前端优化做完。售后专题已在 26Q4 探索范围","rel":"出海专题（关税/售后/多语言）"},{"id":"reczz28PI0k0qqRb","t":"一个零件多段降价，不能在一单里面提交","src":"业务建议","cl":"商务变价与暂作价","mod":"商务变价","dom":"采购域","dec":"P1 排期做","why":"多段降价是真实业务场景（阶梯报价），单据模型不支持","md":10,"how":"变价单支持一段多行降价明细。与 A+B 卷积、A+B 预警一起做，都属价格线","rel":"成本库建设与历史数据导入"},{"id":"reczz28PI0k0tzow","t":"询价结束的 RFQ，创建定点申请单时物流未确认，提示采购无法创建","src":"业务建议","cl":"定点申请与询价","mod":"定点申请","dom":"采购域","dec":"P3 待评估","why":"是流程设计还是校验缺陷需确认。若物流确认是必经环节则属合理拦截","md":0,"how":"与梦瑶确认：物流确认是否为定点必经环节。若是，改为并行而非阻断；若否，修正校验逻辑","rel":"定点会安排管理"},{"id":"reczz28PI0k0qyaH","t":"框架协议到期报表","src":"业务建议","cl":"报表与提醒","mod":"报表","dom":"采购域","dec":"P2 顺手做","why":"到期提醒有明确管理价值，可减少人工巡检","md":5,"how":"框架协议到期前 30/60 天提醒 + 到期报表。可与 26Q4 供应商标签/预警推送机制合并实现","rel":"供应商标签"},{"id":"reczz28PI0k0uVw9","t":"供应商统一社会信用代码错误","src":"问题登记","cl":"供应商主数据质量","mod":"供应商管理","dom":"采购域","dec":"P1 排期做","why":"主数据质量问题，影响供应商准入与合规","md":8,"how":"增加信用代码校验规则（统一社会信用代码格式校验），并对存量数据做批量核验","rel":"供应商主数据建设（含制造地/内容信息重构）"}]};
</script>
<script>
const TODAY="2026-10-19";
const WEEK=(function(){const d=new Date(TODAY+"T00:00:00");const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));return m.toISOString().slice(0,10)})();
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const md=s=>s?s.slice(5):"";
let PAGE="todo";

const wkSorted=()=>[...HUB.wkA].sort((a,b)=>a.start<b.start?1:-1);
const curWeek=()=>wkSorted().find(x=>x.start===WEEK)||wkSorted()[0];

function nav(){
  const P=[["todo","本周要做"],["gantt","Q4 交付甘特"],["history","周报全文"]];
  document.getElementById("nav").innerHTML=P.map(([k,v])=>
    `<a class="${PAGE===k?"on":""}" onclick="go('${k}')">${v}</a>`).join("");
  document.getElementById("st").textContent=`${HUB.wkA.length} 周全文沉淀`;
}
function go(p){PAGE=p;nav();render()}

/* ── 本周要做 ───────────────────────────────── */
function todo(){
  const w=curWeek();
  const dem=HUB.dem.filter(x=>x.stage!=="已上线");
  const act=dem.filter(x=>x.start&&x.start<=TODAY&&(!x.end||x.end>=TODAY));
  const next=dem.filter(x=>x.start&&x.start>TODAY).sort((a,b)=>a.start<b.start?-1:1).slice(0,6);
  const blk=HUB.rsk.filter(x=>x.lv==="P0"&&x.st!=="已解决"&&x.st!=="已关闭");
  const P0pool=(HUB.pool||[]).filter(x=>x.dec==="P0 立即做");
  const P1pool=(HUB.pool||[]).filter(x=>x.dec==="P1 排期做");

  const box=(title,tag,items)=>`<div class="docard"><div class="h"><b>${title}</b>${tag}</div><div class="b">
  ${items.length?items.map(t=>`<div class="todo${t.done?" done":""}">
    <div class="bx"></div><div class="tx">${t.text}${t.meta?`<span class="m">${t.meta}</span>`:""}</div>
    ${t.tag||""}</div>`).join(""):'<div class="fnt">无</div>'}</div></div>`;

  document.getElementById("view").innerHTML=`
  <div class="card"><div class="ch">
    <h3>本周（${WEEK} – ${md(new Date(new Date(WEEK).getTime()+6*864e5).toISOString().slice(0,10))}）要做什么
    <span class="s">更新于 ${w?w.start:TODAY}</span></h3>
    <div class="bar"><button class="btn" onclick="markAll()">全部标记完成</button></div></div>
  <div class="cb">
    <div class="kpi">
      <div class="kc"><div class="a" style="background:#1677ff"></div><div class="t">进行中</div><div class="v">${act.length}</div><div class="d">在途需求</div></div>
      <div class="kc"><div class="a" style="background:#fa8c16"></div><div class="t">即将开始</div><div class="v">${next.length}</div><div class="d">排期未启动</div></div>
      <div class="kc"><div class="a" style="background:#cf1322"></div><div class="t">P0 待决</div><div class="v">${blk.length}</div><div class="d">需本周拍板</div></div>
      <div class="kc"><div class="a" style="background:#722ed1"></div><div class="t">P0 新需求</div><div class="v">${P0pool.length}</div><div class="d">${P0pool.reduce((s,x)=>s+x.md,0)} 人天</div></div>
      <div class="kc"><div class="a" style="background:#13c2c2"></div><div class="t">P1 排期</div><div class="v">${P1pool.length}</div><div class="d">${P1pool.reduce((s,x)=>s+x.md,0)} 人天</div></div>
    </div>
  </div></div>

  <div class="do">
    ${box("P0 · 本周必须拍板",'<span class="tag bad">阻塞</span>',blk.map(x=>({
      text:x.item, meta:`${x.plan}　→ ${md(x.due)} 前解决`, tag:`<span class="tag ${x.cat==="阻塞"?"bad":"warn"}">${x.cat}</span>`})))}
    ${box("在途需求",'<span class="tag info">开发中</span>',act.map(x=>({
      text:x.name, meta:`${x.line}　${x.prog}%　${md(x.start)} → ${md(x.end)}　${[x.biz,x.pm,x.dev].filter(Boolean).join("/")}`,
      tag:`<span class="tag ${x.health==="阻塞"?"bad":x.health==="有风险"?"warn":"ok"}">${x.stage}</span>`})))}
    ${box("即将开始",'<span class="tag">排期</span>',next.map(x=>({
      text:x.name, meta:`${x.line}　${md(x.start)} 启动　${[x.biz,x.pm,x.dev].filter(Boolean).join("/")}`,
      tag:`<span class="tag">${x.pri}</span>`})))}
    ${box("P0 新需求（业务侧聚类）",'<span class="tag bad">立即做</span>',P0pool.map(x=>({
      text:x.t, meta:`${x.cl}　${x.md} 人天　${x.how}`, tag:`<span class="tag bad">${x.mod}</span>`})))}
    ${box("P1 排期需求（业务侧聚类）",'<span class="tag warn">排期做</span>',P1pool.map(x=>({
      text:x.t, meta:`${x.cl}　${x.md} 人天　${x.how}`, tag:`<span class="tag warn">${x.mod}</span>`})))}
  </div>

  ${w?`<div class="card"><div class="ch"><h3>上周回顾 <span class="s">${w.week} · ${w.start}</span></h3>
  <button class="btn" onclick="go('history')">看全文</button></div>
  <div class="cb"><div class="tl">
    ${w.risk&&w.risk!=="—"?`<div class="tli w"><b>风险</b><div class="c">${w.risk}</div></div>`:""}
    ${w.next&&w.next!=="—"?`<div class="tli"><b>下周计划</b><div class="c">${w.next}</div></div>`:""}
  </div></div></div>`:""}
  `;
  document.querySelectorAll(".todo .bx").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("done"));
}
window.markAll=()=>{document.querySelectorAll(".todo").forEach(t=>t.classList.add("done"))};

/* ── 周报全文 ───────────────────────────────── */
function history(){
  const W=wkSorted();
  document.getElementById("view").innerHTML=`
  <div class="card"><div class="ch">
    <h3>周报全文 <span class="s">${W.length} 周 · 原文一字未改 · 合计 ${W.reduce((s,x)=>s+(x.raw||"").length,0).toLocaleString()} 字</span></h3>
    <div class="bar"><select id="fw"><option value="">全部周次</option>${W.map(x=>`<option value="${x.week}">${x.week}（${x.start}）</option>`).join("")}</select>
    <button class="btn" onclick="expandAll(1)">全部展开</button>
    <button class="btn" onclick="expandAll(0)">全部收起</button></div></div>
  <div class="cb p0" id="wkl">
  ${W.map((x,i)=>`<div class="wk" id="wk${i}">
    <div class="wkh" onclick="this.nextElementSibling.classList.toggle('on')">
      <b>${x.week}</b><span class="fnt">${x.start}</span>
      ${x.status&&x.status!=="正常"?`<span class="tag ${x.status==="已延期"?"bad":"warn"}">${x.status}</span>`:'<span class="tag ok">正常</span>'}
      <span class="fnt">${(x.raw||"").length} 字</span>
      <span class="fnt" style="margin-left:auto">展开全文 ▾</span></div>
    <div class="wkb"><div class="raw">${fmt(x.raw)}</div></div>
  </div>`).join("")}
  </div></div>`;
  const s=document.getElementById("fw");

function fmt(s){
  if(!s)return '<div class="fnt">（本周无记录）</div>';
  const md2=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const L=s.split('\n'); const out=[]; let ul=null, tb=null;
  const closeUl=()=>{if(ul){out.push(`<ul>${ul.join("")}</ul>`);ul=null}};
  const closeTb=()=>{if(tb){out.push(`<table>${tb.map(r=>`<tr>${r.map(c=>`<td>${md2(c)}</td>`).join("")}</tr>`).join("")}</table>`);tb=null}};
  for(let ln of L){
    const t=ln.trim(); if(!t){closeUl();closeTb();continue}
    if(t.startsWith("|")){closeUl();
      const cells=t.split("|").slice(1,-1).map(x=>x.trim());
      if(cells.every(c=>/^-{2,}$/.test(c)))continue;
      if(!tb)tb=[]; tb.push(cells); continue}
    closeTb();
    if(t.startsWith("- ")||t.startsWith("•")){if(!ul)ul=[];ul.push(`<li>${md2(t.slice(2))}</li>`);continue}
    closeUl();
    if(t.startsWith("#")){out.push(`<div class="h">${md2(t.replace(/^#+\s*/,""))}</div>`);continue}
    out.push(`<p>${md2(t).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')}</p>`);
  }
  closeUl();closeTb();
  return out.join("");
}
