const DEM=()=>HUB.dem.filter(d=>(!F.line||d.line===F.line)&&(!F.pri||d.pri===F.pri)&&(!F.health||d.health===F.health)&&(!F.owner||[d.biz,d.pm,d.dev].filter(Boolean).join("/").includes(F.owner)));
const owner=d=>[d.biz,d.pm,d.dev].filter(Boolean).join(" / ")||"—";
function mk(html){const w=document.createElement("div");w.innerHTML=html;return w.firstElementChild};
function tag(t,c){return `<span class="tag ${c||t}">${t}</span>`}

function nav(){
  const P=[["overview","总览"],["demand","需求与进度"],["plan","排期甘特"],["pool","需求池"],["weekly","周度进展"],["archive","周报归档"],["res","资源与风险"]];
  document.getElementById("nav").innerHTML=P.map(([k,v])=>`<a class="${PAGE===k?"on":""}" onclick="go('${k}')">${v}${k==="archive"?`<span style="font-size:11px;color:#8c8c8c;margin-left:4px">${(HUB.wkA||[]).length}</span>`:""}</a>`).join("");
  const st=document.getElementById("dstat");
  if(st)st.textContent=`${(HUB.dem||[]).length} 需求 · ${(HUB.wkA||[]).length} 周周报 · ${(HUB.rsk||[]).length} 风险`;
}
function go(p){PAGE=p;render()}

function kpis(){
  const a=DEM();
  const done=a.filter(x=>x.stage==="已上线").length;
  const blk=a.filter(x=>x.health==="阻塞").length;
  const rsk=a.filter(x=>x.health!=="正常").length;
  const late=a.filter(x=>D(x.end)&&dd(x.end,TODAY)>0&&x.stage!=="已上线");
  const ovd=late.reduce((s,x)=>s+dd(x.end,TODAY),0);
  const prog=a.length?Math.round(a.reduce((s,x)=>s+x.prog,0)/a.length):0;
  const p0=a.filter(x=>x.pri==="P0"&&x.stage!=="已上线").length;
  const wk=HUB.res.reduce((s,x)=>s+x.week,0);
  const gap=HUB.res.filter(x=>x.inProj==="否").reduce((s,x)=>s+x.q4,0);
  const K=[
    ["在管需求",a.length,`${LINES.length} 条主线`,"#1677ff"],
    ["整体进度",prog+"%",`已完成 ${done} 个`,"#52c41a"],
    ["阻塞项",blk,blk?"需立即处理":"无阻塞",blk?"#ff4d4f":"#d9d9d9"],
    ["异常需求",rsk,`含 ${late.length} 个已逾期`,"#fa8c16"],
    ["P0 在途",p0,"需优先推动","#722ed1"],
    ["本周投入",wk+" 人天","8 人团队", "#13c2c2"],
    ["立项缺口",gap+" 人天",gap?"需补充立项":"口径完整","#cf1322"],
  ];
  return `<div class="kpi">${K.map(([t,v,d,c])=>`<div class="kc"><div class="accent" style="background:${c}"></div><div class="t">${t}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("")}</div>`;
}

function alert(){
  const R=HUB.rsk.filter(x=>x.lv==="P0"&&x.st!=="已解决"&&x.st!=="已关闭");
  if(!R.length)return "";
  return `<div class="alert"><div class="at">P0 级阻塞与待决 ${R.length} 项，需要本周拍板</div><ul>${R.map(x=>`<li><b>${x.item}</b> —— ${x.plan}（要求 ${md(x.due)} 前解决）</li>`).join("")}</ul></div>`;
}

function filters(){
  const a=DEM();
  return `<div class="bar" style="margin-bottom:14px">
  <select id="fL"><option value="">全部主线</option>${LINES.map(l=>`<option ${F.line===l?"selected":""}>${l}</option>`).join("")}</select>
  <select id="fP"><option value="">全部优先级</option>${["P0","P1","P2","P3"].map(l=>`<option ${F.pri===l?"selected":""}>${l}</option>`).join("")}</select>
  <select id="fH"><option value="">全部健康度</option>${["正常","有风险","阻塞","已延期"].map(l=>`<option ${F.health===l?"selected":""}>${l}</option>`).join("")}</select>
  <select id="fO"><option value="">全部负责人</option>${[...new Set(HUB.dem.flatMap(d=>[d.biz,d.pm,d.dev]).filter(Boolean))].map(l=>`<option ${F.owner===l?"selected":""}>${l}</option>`).join("")}</select>
  <button class="btn" onclick="resetF()">重置</button>
  <span class="fnt" style="margin-left:auto">显示 ${a.length} / ${HUB.dem.length} 条</span></div>`;
}
function bindF(){
  const m={fL:"line",fP:"pri",fH:"health",fO:"owner"};
  for(const k in m){const e=document.getElementById(k);if(e)e.onchange=ev=>{F[m[k]]=ev.target.value;render()}}
  window.resetF=()=>{F={line:"",pri:"",health:"",owner:""};render()};
}

function overview(){
  const a=DEM();
  const byStage=STAGES.map(s=>({s,n:a.filter(x=>x.stage===s).length})).filter(x=>x.n);
  const byLine=LINES.map(l=>({l,n:a.filter(x=>x.line===l).length,done:a.filter(x=>x.line===l&&x.stage==="已上线").length})).filter(x=>x.n);
  const byPri=["P0","P1","P2","P3"].map(p=>({p,n:a.filter(x=>x.pri===p).length})).filter(x=>x.n);
  const blocks=a.filter(x=>x.health!=="正常").slice(0,6);
  const soon=a.filter(x=>D(x.end)&&dd(TODAY,x.end)>=0&&dd(TODAY,x.end)<=14&&x.stage!=="已上线").sort((x,y)=>dd(TODAY,x.end)-dd(TODAY,y.end));

  document.getElementById("view").innerHTML=kpis()+alert()+filters()+`
  <div class="two">
    <div>
      <div class="card"><div class="ch"><h3>阶段分布 <span class="s">需求当前所处环节</span></h3></div>
        <div class="cb"><div class="cols">${byStage.map(x=>`<div class="col" style="min-height:auto">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:13px;color:${SC[x.s]}">${x.s}</span>
          <span style="font-size:20px;font-weight:600">${x.n}</span></div>
          <div class="pbar"><i style="width:${a.length?x.n/a.length*100:0}%;background:${SC[x.s]}"></i></div>
        </div>`).join("")}</div></div></div>

      <div class="card"><div class="ch"><h3>主线健康度 <span class="s">按业务主线看异常分布</span></h3>
        <div class="kb">${["正常","有风险","阻塞"].map(h=>`<span class="fnt"><i class="sw" style="background:${h==="正常"?"#52c41a":h==="有风险"?"#fa8c16":"#ff4d4f"}"></i>${h}</span>`).join("")}</div></div>
        <div class="cb"><table><thead><tr><th>主线</th><th style="width:38%">状态分布</th><th>需求</th><th>已完成</th><th>异常</th></tr></thead><tbody>
        ${byLine.map(x=>{const g=a.filter(y=>y.line===x.l);
          const ok=g.filter(y=>y.health==="正常").length,wr=g.filter(y=>y.health==="有风险").length,bk=g.filter(y=>y.health==="阻塞").length;
          return `<tr><td><span class="tag line">${x.l}</span></td>
          <td><div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:#f0f0f0">
          <i style="width:${g.length?ok/g.length*100:0}%;background:#52c41a"></i>
          <i style="width:${g.length?wr/g.length*100:0}%;background:#fa8c16"></i>
          <i style="width:${g.length?bk/g.length*100:0}%;background:#ff4d4f"></i></div></td>
          <td>${x.n}</td><td>${x.done}</td><td>${wr+bk?tag(`${wr+bk} 项异常`,"bad"):tag("正常","ok")}</td></tr>`}).join("")}
        </tbody></table></div></div>

      <div class="card"><div class="ch"><h3>异常需求清单 <span class="s">需要本周处理</span></h3>
        <button class="btn" onclick="go('demand')">查看全部</button></div>
        <div class="cb" style="padding:0">
        ${blocks.length?`<table><thead><tr><th>需求</th><th>主线</th><th>健康度</th><th>卡点</th></tr></thead><tbody>
        ${blocks.map(x=>`<tr class="clickable" onclick="modal('${x.id}')"><td><b>${x.name}</b></td>
        <td><span class="tag line">${x.line}</span></td><td>${tag(x.health,HC[x.health])}</td>
        <td style="max-width:320px"><span class="fnt">${x.risk||"—"}</span></td></tr>`).join("")}</tbody></table>`
        :'<div class="empty">无异常需求</div>'}</div></div>
    </div>

    <div>
      <div class="card"><div class="ch"><h3>优先级分布</h3></div><div class="cb">
        ${byPri.map(x=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
        <span>${tag(x.p,x.p)}</span><span class="fnt">${x.n} 个</span></div>
        <div class="pbar" style="height:8px"><i style="width:${a.length?x.n/a.length*100:0}%;background:${x.p==="P0"?"#cf1322":x.p==="P1"?"#d46b08":x.p==="P2"?"#8c8c8c":"#bfbfbf"}"></i></div></div>`).join("")}
      </div></div>

      <div class="card"><div class="ch"><h3>两周内到期 <span class="s">${soon.length} 个</span></h3></div><div class="cb">
        ${soon.length?soon.map(x=>{const d=dd(TODAY,x.end);
          return `<div class="tli ${d<=3?"b":"w"}" style="cursor:pointer" onclick="modal('${x.id}')">
          <div class="tlh"><b>${x.name}</b>${tag(x.pri,x.pri)}</div>
          <div class="tlb">${md(x.end)} 到期 · ${d<=0?"今天":`剩 ${d} 天`} · ${x.prog}% · ${owner(x)}</div></div>`}).join("")
        :'<div class="empty">两周内无到期需求</div>'}
      </div></div>

      <div class="card"><div class="ch"><h3>资源投入 <span class="s">本周</span></h3><button class="btn" onclick="go('res')">明细</button></div><div class="cb">
        ${HUB.res.map(x=>`<div style="margin-bottom:11px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <span>${x.who} ${x.inProj==="否"?tag("未立项","bad"):""}</span>
          <span class="fnt">${x.week} / ${x.q4} 人天</span></div>
        <div class="pbar"><i style="width:${x.q4?x.week/x.q4*100:0}%;background:${x.inProj==="否"?"#ff4d4f":"#1677ff"}"></i></div></div>`).join("")}
      </div></div>
    </div>
  </div>`;
  bindF();
}

function demand(){
  const a=DEM();
  const grp=window.GROUP!==false;
  const row=x=>`<tr class="clickable" onclick="modal('${x.id}')">
    <td><b>${x.name}</b>${x.note?`<div class="fnt" style="margin-top:2px">${x.note}</div>`:""}${x.risk?`<div class="fnt" style="color:#cf1322;margin-top:2px">${x.risk}</div>`:""}</td>
    <td><span class="tag line">${x.line}</span></td>
    <td><span class="tag" style="background:${SC[x.stage]}18;color:${SC[x.stage]};border:1px solid ${SC[x.stage]}40">${x.stage}</span></td>
    <td>${tag(x.pri,x.pri)}</td>
    <td style="white-space:nowrap;font-size:12px">${x.start?md(x.start)+" → "+md(x.end):"—"}${x.shipped?`<div style="color:#52c41a">上线 ${md(x.shipped)}</div>`:""}${D(x.end)&&dd(x.end,TODAY)>0&&x.stage!=="已上线"?`<div class="fnt" style="color:#cf1322">超期 ${dd(x.end,TODAY)} 天</div>`:""}</td>
    <td style="min-width:90px">${x.prog}%<div class="pbar"><i style="width:${x.prog}%;background:${x.prog>=80?"#52c41a":x.prog>=30?"#fa8c16":"#d9d9d9"}"></i></div></td>
    <td>${tag(x.health,HC[x.health])}</td>
    <td style="font-size:12px">${owner(x)}</td>
    <td style="white-space:nowrap">${[["BRD",x.brd],["PRD",x.prd],["原型",x.proto]].filter(([,v])=>v).map(([k,v])=>`<a class="lnk" href="${v}" target="_blank" onclick="event.stopPropagation()">${k}</a>`).join(" ")||'<span class="fnt">—</span>'}</td>
  </tr>`;
  const head=`<thead><tr><th>需求</th><th>主线</th><th>阶段</th><th>优先级</th><th>排期</th><th>进度</th><th>健康度</th><th>负责人</th><th>文档</th></tr></thead>`;
  let body;
  if(grp){
    body=LINES.map(l=>{const g=a.filter(x=>x.line===l);if(!g.length)return"";
      const done=g.filter(x=>x.stage==="已上线").length;
      return `<div style="margin-bottom:6px;padding:9px 12px;background:#fafafa;border-radius:6px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="fToggle('${l}')">
      <span class="tag line">${l}</span><b style="font-size:13px">${g.length} 个需求</b>
      <span class="fnt">已完成 ${done} ｜ 在途 ${g.length-done}</span>
      <span class="fnt" id="ar_${LINES.indexOf(l)}" style="margin-left:auto">收起 ▾</span></div>
      <div id="g_${LINES.indexOf(l)}" style="margin-bottom:16px"><table>${head}<tbody>${g.map(row).join("")}</tbody></table></div>`}).join("");
  }else{
    body=`<table>${head}<tbody>${[...a].sort((x,y)=>x.line<y.line?-1:x.line>y.line?1:x.start<y.start?-1:1).map(row).join("")}</tbody></table>`;
  }
  document.getElementById("view").innerHTML=kpis()+filters()+`
  <div class="card"><div class="ch"><h3>需求与进度总表 <span class="s">${a.length} 条 · Q4 在途 25 + 历史 71</span></h3>
  <div class="bar"><button class="btn" onclick="window.GROUP=${grp?false:true};render()">${grp?"平铺显示":"按主线分组"}</button>
  <button class="btn" onclick="window.open('https://mi.feishu.cn/base/WXGsbPgJcawUtGsHkoOcD12Bnjd','_blank')">去飞书修改 ↗</button>
  <button class="btn" onclick="exportData()">导出</button></div></div>
  <div class="cb" style="padding:0;overflow-x:auto">${body}</div></div>`;
  bindF();
}
window.fToggle=l=>{const i=LINES.indexOf(l);const e=document.getElementById("g_"+i),a=document.getElementById("ar_"+i);
  if(e){const h=e.style.display==="none";e.style.display=h?"":"none";a.textContent=h?"展开 ▸":"收起 ▾"}};
window.open=window.open;

function plan(){
  const a=DEM().filter(x=>x.start&&x.end).sort((a,b)=>a.start<b.start?-1:1);
  if(!a.length){document.getElementById("view").innerHTML='<div class="card"><div class="empty">无排期数据</div></div>';return}
  const t0=a.reduce((m,x)=>x.start<m?x.start:m,a[0].start);
  const t1=a.reduce((m,x)=>x.end>m?x.end:m,a[0].end);
  const total=Math.max(dd(t0,t1),1);
  const N=Math.ceil(total/7), pos=s=>Math.max(0,dd(t0,s))/total*100, tp=Math.max(0,Math.min(100,dd(t0,TODAY)/total*100));
  const ticks=[];for(let i=0;i<=N;i++){const d=D(t0);d.setDate(d.getDate()+i*7);ticks.push(md(iso(d)))}
  document.getElementById("view").innerHTML=kpis()+filters()+`
  <div class="card"><div class="ch"><h3>排期甘特 <span class="s">${md(t0)} – ${md(t1)}　共 ${total} 天　红线=今天 ${TODAY}</span></h3>
  <div class="kb">${LINES.map(l=>`<span class="fnt"><i class="sw" style="background:${LC[l]}"></i>${l}</span>`).join("")}</div></div>
  <div class="cb gwrap"><div class="gm">
    <div class="ghead"><div class="sp">需求 / 阶段</div><div class="tk" style="grid-template-columns:repeat(${ticks.length},1fr)">${ticks.map(t=>`<span>${t}</span>`).join("")}</div></div>
    <div style="position:relative">
      <div class="gtoday" style="left:calc(220px + ${tp}% * (100% - 220px)/100)"><b>今天</b></div>
      ${a.map(x=>{const l=pos(x.start),w=Math.max(1,pos(x.end)-l);
        const late=D(x.end)<D(TODAY)&&x.stage!=="已上线";
        const col=x.stage==="已上线"?"#52c41a":late?"#ff4d4f":x.health==="阻塞"?"#722ed1":LC[x.line]||"#8c8c8c";
        return `<div class="grow"><div class="gname" title="${x.name}｜${x.stage}｜${x.prog}%">${x.name}</div>
        <div class="gtrack"><div class="gbar" onclick="modal('${x.id}')" title="${x.name}｜${x.start}→${x.end}｜${x.prog}%"
          style="left:${l}%;width:${w}%;background:${col};opacity:${x.prog>=80?1:.7}"></div></div></div>`}).join("")}
    </div>
    <div class="fnt" style="margin-top:10px">点击色条查看详情 · 逾期自动变红 · 已上线为绿色</div>
  </div></div></div>`;
  bindF();
}

function weekly(){
  const W=[...HUB.wk].sort((a,b)=>a.start<b.start?1:-1);
  const byWeek={};W.forEach(x=>{(byWeek[x.week]=byWeek[x.week]||[]).push(x)});
  document.getElementById("view").innerHTML=kpis()+`
  <div class="card"><div class="ch"><h3>周度进展 <span class="s">${W.length} 条记录 · ${Object.keys(byWeek).length} 周</span></h3>
  <div class="bar"><select id="wF"><option value="">全部周次</option>${Object.keys(byWeek).map(w=>`<option>${w}</option>`).join("")}</select></div></div>
  <div class="cb">${Object.entries(byWeek).map(([w,items])=>{
    const st=items.find(x=>x.status!=="正常")?"b":"";
    return `<div style="margin-bottom:24px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0">
      <b style="font-size:14px">${w}</b><span class="fnt">${items[0].start}</span>
      ${items.filter(x=>x.status!=="正常").length?tag(`${items.filter(x=>x.status!=="正常").length} 项有风险`,"warn"):tag("全部正常","ok")}</div>
    <div class="tl">${items.map(x=>`<div class="tli ${x.status==="已延期"?"b":x.status==="有风险"?"w":""}">
      <div class="tlh"><b>${x.mod}</b>${x.chg&&x.chg!=="—"?tag(x.chg,"info"):""}${x.status!=="正常"?tag(x.status,HC[x.status]||"warn"):""}</div>
      <div class="tlb"><b>关键数据</b>：${x.data}<br>
      ${x.risk&&x.risk!=="—"?`<span style="color:#cf1322"><b>风险</b>：${x.risk}</span><br>`:""}
      ${x.next&&x.next!=="—"?`<span style="color:#0958d9"><b>下周计划</b>：${x.next}</span>`:""}</div>
    </div>`).join("")}</div></div>`}).join("")}</div></div>`;
  const s=document.getElementById("wF");
  if(s)s.onchange=e=>{const w=e.target.value;if(w){document.querySelectorAll(".tl").forEach((el,i)=>{});window.scrollTo(0,0)}};
}

function archive(){
  const A=[...(HUB.wkA||[])].sort((a,b)=>a.start<b.start?1:-1);
  if(!A.length){document.getElementById("view").innerHTML='<div class="card"><div class="empty">暂无周报归档</div></div>';return}
  const sel=document.getElementById("aQ")?document.getElementById("aQ").value:"";
  const list=sel?A.filter(x=>x.status===sel):A;
  document.getElementById("view").innerHTML=`
  <div class="card"><div class="ch"><h3>周报归档 <span class="s">${A.length} 周全量 · 来源《直采EP进度汇总》</span></h3>
  <div class="bar"><select id="aQ"><option value="">全部状态</option>${["正常","有风险","已延期"].map(s=>`<option ${s===sel?"selected":""}>${s}</option>`).join("")}</select>
  <button class="btn" onclick="window.open('https://mi.feishu.cn/wiki/M1zJw9ncui8jhUkK89qcuX7Anud','_blank')">打开原周报 ↗</button></div></div>
  <div class="cb" style="max-height:none">${list.map((x,i)=>`<div style="border-bottom:1px solid #fafafa;padding:14px 0">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
      <b style="font-size:14px">${x.week}</b><span class="fnt">${x.start} 起</span>
      ${x.status&&x.status!=="正常"?tag(x.status,HC[x.status]||"warn"):tag("正常","ok")}
      <button class="btn" style="margin-left:auto;font-size:12px;padding:2px 9px" onclick="toggleRaw(${i})">原始记录</button></div>
    ${x.data?`<div class="tlb" style="margin-bottom:4px"><b>关键数据</b>：${x.data}</div>`:""}
    ${x.chg&&x.chg!=="—"?`<div class="tlb" style="margin-bottom:4px"><b>环比</b>：${x.chg}</div>`:""}
    ${x.risk&&x.risk!=="—"?`<div class="tlb" style="color:#cf1322;margin-bottom:4px"><b>风险</b>：${x.risk}</div>`:""}
    ${x.next&&x.next!=="—"?`<div class="tlb" style="color:#0958d9"><b>下周计划</b>：${x.next}</div>`:""}
    <div id="raw${i}" class="note" style="display:none;white-space:pre-wrap;max-height:420px;overflow-y:auto">${(x.raw||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>
  </div>`).join("")}</div></div>`;
  const s=document.getElementById("aQ");if(s)s.onchange=archive;
}
window.toggleRaw=i=>{const e=document.getElementById("raw"+i);if(e)e.style.display=e.style.display==="none"?"block":"none"};

function pool(){
  const P=HUB.pool||[];
  if(!P.length){document.getElementById("view").innerHTML='<div class="card"><div class="empty">需求池为空</div></div>';return}
  const DEC={"P0 立即做":"bad","P1 排期做":"warn","P2 顺手做":"info","P3 不做/线下":"","P3 待评估":""};
  const sel=window.PF||"";
  const list=sel?P.filter(x=>x.cl===sel):P;
  const cls=[...new Set(P.map(x=>x.cl))];
  const tot=P.reduce((s,x)=>s+x.md,0);
  const byDec={};P.forEach(x=>byDec[x.dec]=(byDec[x.dec]||0)+1);
  const open=P.filter(x=>x.dec.startsWith("P0")).reduce((s,x)=>s+x.md,0);
  const openP1=P.filter(x=>x.dec==="P1 排期做").reduce((s,x)=>s+x.md,0);
  const skip=P.filter(x=>x.dec.startsWith("P3")).length;

  document.getElementById("view").innerHTML=`
  <div class="kpi">
    ${[["业务侧条目",P.length,"12 建议 + 19 问题",""],
       ["聚类簇数",cls.length,"按主题聚合",""],
       ["P0 立即做",byDec["P0 立即做"]||0,`${open} 人天`,"bad"],
       ["P1 排期做",byDec["P1 排期做"]||0,`${openP1} 人天`,"warn"],
       ["P2 顺手做",byDec["P2 顺手做"]||0,"并入迭代",""],
       ["P3 不做/待评估",skip,"需业务确认",""],
       ["总预估",tot+" 人天",`约 ${Math.round(tot/20)} 周单人`,"#722ed1"]]
      .map(([t,v,dd,c])=>`<div class="kc"><div class="accent" style="background:${c||"#d9d9d9"}"></div><div class="t">${t}</div><div class="v">${v}</div><div class="d">${dd}</div></div>`).join("")}
  </div>
  <div class="card"><div class="ch"><h3>聚类视图 <span class="s">按主题聚合，点簇名看明细</span></h3>
  <div class="bar"><select id="pC"><option value="">全部簇</option>${cls.map(c=>`<option ${c===sel?"selected":""}>${c}</option>`).join("")}</select>
  <button class="btn" onclick="window.PF='';pool()">重置</button></div></div>
  <div class="cb" style="padding:0">
  ${cls.map(c=>{const g=P.filter(x=>x.cl===c);const d=g.reduce((s,x)=>s+x.md,0);
    if(sel&&c!==sel)return "";
    return `<div style="border-bottom:1px solid #fafafa">
    <div style="display:flex;align-items:center;gap:10px;padding:11px 16px;background:#fafafa;cursor:pointer" onclick="window.PF='${sel===c?'':c}';pool()">
      <b style="font-size:13px">${c}</b><span class="tag">${g.length} 条</span>
      <span class="fnt">${d} 人天</span>
      <div style="display:flex;gap:3px;margin-left:12px">${["P0 立即做","P1 排期做","P2 顺手做","P3 不做/线下","P3 待评估"].map(k=>{
        const n=g.filter(x=>x.dec===k).length;
        return n?`<span class="tag ${DEC[k]}" style="font-size:11px">${k.split(" ")[0]} ${n}</span>`:""}).join("")}</div>
      <span class="fnt" style="margin-left:auto">${sel===c?"收起 ▾":"展开 ▸"}</span></div>
    ${sel===c?`<table><thead><tr><th style="width:26%">条目</th><th>来源</th><th>模块</th><th>决策</th><th>人天</th><th>为什么</th><th>怎么做</th><th>关联</th></tr></thead><tbody>
    ${g.map(x=>`<tr><td><b>${x.t}</b></td><td>${x.src==="业务建议"?tag("建议","info"):tag("问题","warn")}</td>
      <td><span class="tag line">${x.mod}</span></td><td>${tag(x.dec,DEC[x.dec])}</td><td>${x.md||"—"}</td>
      <td style="max-width:230px" class="fnt">${x.why}</td>
      <td style="max-width:280px" class="fnt">${x.how}</td>
      <td style="max-width:130px" class="fnt">${x.rel}</td></tr>`).join("")}</tbody></table>`:""}
    </div>`}).join("")}
  </div></div>`;
  const s=document.getElementById("pC");if(s)s.onchange=e=>{window.PF=e.target.value;pool()};
}

function resview(){
  const R=HUB.res, K=HUB.rsk;
  const inP=R.filter(x=>x.inProj==="是"), outP=R.filter(x=>x.inProj==="否");
  const sum=a=>a.reduce((s,x)=>s+x.q4,0);
  const mk=(lv)=>K.filter(x=>x.lv===lv);
  document.getElementById("view").innerHTML=kpis()+`
  <div class="card"><div class="ch"><h3>资源与人天 <span class="s">${R.length} 人/团队 · 本周投入 ${R.reduce((s,x)=>s+x.week,0)} 人天</span></h3></div>
  <div class="cb gwrap"><table><thead><tr>
    <th>人员/团队</th><th>角色</th><th>所属线</th><th>是否立项内</th><th>Q3 实际</th><th>Q4 计划</th><th>本周投入</th><th>备注</th>
  </tr></thead><tbody>
  ${R.map(x=>`<tr><td><b>${x.who}</b></td><td>${x.role}</td><td><span class="tag line">${x.line}</span></td>
  <td>${x.inProj==="是"?tag("已立项","ok"):tag("未立项","bad")}</td>
  <td>${x.q3||"—"}</td><td><b>${x.q4||"—"}</b></td>
  <td>${x.week||"—"}</td>
  <td style="max-width:280px" class="fnt">${x.note||"—"}</td></tr>`).join("")}
  </tbody><tfoot><tr style="background:#fafafa;font-weight:500">
    <td colspan="4">合计　已立项 ${sum(inP)} 人天 ｜ 未立项 ${sum(outP)} 人天</td>
    <td>${R.reduce((s,x)=>s+x.q3,0)}</td><td>${sum(R)}</td><td>${R.reduce((s,x)=>s+x.week,0)}</td>
    <td class="${sum(outP)>70?"fnt":""}" style="${sum(outP)>70?"color:#cf1322":""}">${sum(outP)>70?`超 70 人天免上升线`:""}</td></tr></tfoot>
  </table></div></div>

  <div class="card"><div class="ch"><h3>风险与待决 <span class="s">${K.length} 项 · P0 ${mk("P0").length} 项</span></h3></div>
  <div class="cb"><table><thead><tr>
    <th>事项</th><th>类别</th><th>等级</th><th>状态</th><th>应对方案</th><th>影响</th><th>责任人</th><th>要求解决</th>
  </tr></thead><tbody>
  ${[...K].sort((a,b)=>(a.lv+a.st).localeCompare(b.lv+b.st)).map(x=>`<tr>
    <td style="max-width:300px"><b>${x.item}</b></td>
    <td>${tag(x.cat,x.cat==="阻塞"?"bad":x.cat==="待决"?"warn":"info")}</td>
    <td>${tag(x.lv,x.lv)}</td>
    <td>${tag(x.st,x.st==="待处理"?"bad":x.st==="处理中"?"warn":"ok")}</td>
    <td style="max-width:260px" class="fnt">${x.plan}</td>
    <td style="max-width:220px" class="fnt">${x.impact}</td>
    <td style="font-size:12px">${x.own||"—"}</td>
    <td style="font-size:12px;white-space:nowrap">${x.due?md(x.due):"—"}${x.due&&dd(TODAY,x.due)>0?`<div class="fnt" style="color:#cf1322">超 ${dd(TODAY,x.due)} 天</div>`:""}</td>
  </tr>`).join("")}</tbody></table></div></div>`;
}

function modal(id){
  const d=HUB.dem.find(x=>x.id===id);if(!d)return;
  const L=[["BRD",d.brd],["PRD",d.prd],["原型",d.proto]].filter(([,v])=>v);
  const m=mk(`<div class="mk"><div class="modal"><h3>${d.name}</h3>
    ${[["阶段",`<select class="inp" id="mS">${STAGES.map(s=>`<option ${s===d.stage?"selected":""}>${s}</option>`).join("")}</select>`],
      ["主线",`<select class="inp" id="mL">${LINES.map(s=>`<option ${s===d.line?"selected":""}>${s}</option>`).join("")}</select>`],
      ["优先级",`<select class="inp" id="mP">${["P0","P1","P2","P3"].map(s=>`<option ${s===d.pri?"selected":""}>${s}</option>`).join("")}</select>`],
      ["健康度",`<select class="inp" id="mH">${["正常","有风险","阻塞","已延期"].map(s=>`<option ${s===d.health?"selected":""}>${s}</option>`).join("")}</select>`],
      ["开始",`<input class="inp" type="date" id="mB" value="${d.start||""}">`],
      ["结束",`<input class="inp" type="date" id="mE" value="${d.end||""}">`],
      ["进度",`<input class="inp" type="number" id="mG" min="0" max="100" value="${d.prog}">%`],
      ["风险卡点",`<textarea class="inp" id="mR" rows="2">${d.risk||""}</textarea>`],
      ["负责人",`${owner(d)}<div class="fnt">业务方 / 产品PM / 开发负责人，需调整请到飞书表格修改</div>`],
      ["文档",L.length?L.map(([k,v])=>`<a class="lnk" href="${v}" target="_blank">${k} ↗</a>`).join(" · "):'<span class="fnt">未关联</span>'],
    ].map(([k,v])=>`<div class="frow"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
    <div class="note">改动保存在本机浏览器。要同步给梦瑶、文飞，请到飞书多维表格改：<br>
    <a class="lnk" href="https://mi.feishu.cn/base/WXGsbPgJcawUtGsHkoOcD12Bnjd" target="_blank">EP 一体化工作台 ↗</a></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" id="mC">关闭</button><button class="btn pri" id="mOk">保存</button></div>
  </div></div>`);
  document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m)m.remove()};
  document.getElementById("mC").onclick=()=>m.remove();
  document.getElementById("mOk").onclick=()=>{
    d.stage=document.getElementById("mS").value;d.line=document.getElementById("mL").value;
    d.pri=document.getElementById("mP").value;d.health=document.getElementById("mH").value;
    d.start=document.getElementById("mB").value;d.end=document.getElementById("mE").value;
    d.prog=+document.getElementById("mG").value;d.risk=document.getElementById("mR").value;
    localStorage.setItem("hub",JSON.stringify(HUB));m.remove();render();alert("已保存到本机");
  };
}
window.modal=modal;
window.exportData=()=>{const b=new Blob([JSON.stringify(HUB,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ep-hub-"+TODAY+".json";a.click()};

const REND={overview,demand,plan,pool,weekly,archive,res:resview};
function render(){nav();document.getElementById("view").innerHTML="";REND[PAGE]()}
const _s=localStorage.getItem("hub");if(_s){try{Object.assign(HUB,JSON.parse(_s))}catch(e){}}
render();
</script>
</body>
