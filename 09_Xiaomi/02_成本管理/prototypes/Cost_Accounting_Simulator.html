<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP 成本核算模拟器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
        .slider { -webkit-appearance: none; height: 6px; border-radius: 5px; background: #e2e8f0; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #0070f2; cursor: pointer; }
        .result-card { transition: all 0.3s ease; }
        .result-card.updated { transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">成本核算模拟器</h1>
        <p class="text-slate-500 mb-8">调整下方参数，实时查看标准成本的卷积过程。</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Input Panel -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-sm">1</span>
                    输入参数
                </h2>

                <!-- Material 1 -->
                <div class="mb-6">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-700">电芯成本 (元/度)</label>
                        <span id="val-cell" class="text-sm font-bold text-slate-900">500</span>
                    </div>
                    <input type="range" min="200" max="800" value="500" class="w-full slider" oninput="updateCalc()" id="slider-cell">
                    <div class="flex justify-between text-xs text-slate-400 mt-1"><span>200</span><span>800</span></div>
                </div>

                <!-- Material 2 -->
                <div class="mb-6">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-700">壳体成本 (元/套)</label>
                        <span id="val-shell" class="text-sm font-bold text-slate-900">2000</span>
                    </div>
                    <input type="range" min="500" max="5000" value="2000" class="w-full slider" oninput="updateCalc()" id="slider-shell">
                </div>

                <!-- Labor -->
                <div class="mb-6">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-700">组装工时 (小时)</label>
                        <span id="val-labor" class="text-sm font-bold text-slate-900">2.0</span>
                    </div>
                    <input type="range" min="0.5" max="5" step="0.1" value="2" class="w-full slider" oninput="updateCalc()" id="slider-labor">
                </div>

                <!-- OH Rate -->
                <div class="mb-6">
                    <div class="flex justify-between mb-2">
                        <label class="text-sm font-medium text-slate-700">制造费率 (元/小时)</label>
                        <span id="val-oh" class="text-sm font-bold text-slate-900">100</span>
                    </div>
                    <input type="range" min="50" max="300" value="100" class="w-full slider" oninput="updateCalc()" id="slider-oh">
                </div>
            </div>

            <!-- Result Panel -->
            <div class="space-y-6">
                <!-- Total Card -->
                <div id="total-card" class="bg-gradient-to-br from-blue-600 to-indigo-600 p-6 rounded-2xl shadow-lg text-white result-card">
                    <div class="text-sm font-medium opacity-80 mb-1">标准成本合计 (STD)</div>
                    <div id="total-val" class="text-4xl font-bold mb-4">¥ 52,250.00</div>
                    <div class="flex justify-between items-center text-xs opacity-90">
                        <span>物料占比: <span id="mat-pct">99%</span></span>
                        <span>人工/费占比: <span id="lr-pct">1%</span></span>
                    </div>
                </div>

                <!-- Breakdown -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-700 mb-4">成本拆解明细</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-600 text-sm">电芯 (10kWh)</span>
                            <span id="cost-cell" class="font-mono font-medium text-slate-900">50,000</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                            <div id="bar-cell" class="bg-blue-500 h-full" style="width: 95%"></div>
                        </div>

                        <div class="flex justify-between items-center mt-4">
                            <span class="text-slate-600 text-sm">壳体</span>
                            <span id="cost-shell" class="font-mono font-medium text-slate-900">2,000</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                            <div id="bar-shell" class="bg-emerald-500 h-full" style="width: 5%"></div>
                        </div>

                        <div class="flex justify-between items-center mt-4">
                            <span class="text-slate-600 text-sm">人工+费用</span>
                            <span id="cost-lr" class="font-mono font-medium text-slate-900">250</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                            <div id="bar-lr" class="bg-orange-500 h-full" style="width: 1%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateCalc() {
            const cell = parseFloat(document.getElementById('slider-cell').value);
            const shell = parseFloat(document.getElementById('slider-shell').value);
            const labor = parseFloat(document.getElementById('slider-labor').value);
            const oh = parseFloat(document.getElementById('slider-oh').value);

            document.getElementById('val-cell').innerText = cell;
            document.getElementById('val-shell').innerText = shell;
            document.getElementById('val-labor').innerText = labor.toFixed(1);
            document.getElementById('val-oh').innerText = oh;

            const costCell = cell * 10;
            const costShell = shell;
            const costLR = (labor * 100) + (labor * oh);
            const total = costCell + costShell + costLR;

            document.getElementById('total-val').innerText = `¥ ${total.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('cost-cell').innerText = costCell.toLocaleString();
            document.getElementById('cost-shell').innerText = costShell.toLocaleString();
            document.getElementById('cost-lr').innerText = costLR.toLocaleString();

            const matPct = ((costCell + costShell) / total * 100).toFixed(0);
            const lrPct = (100 - matPct).toFixed(0);

            document.getElementById('mat-pct').innerText = `${matPct}%`;
            document.getElementById('lr-pct').innerText = `${lrPct}%`;

            // Update bars
            document.getElementById('bar-cell').style.width = `${(costCell/total)*100}%`;
            document.getElementById('bar-shell').style.width = `${(costShell/total)*100}%`;
            document.getElementById('bar-lr').style.width = `${(costLR/total)*100}%`;

            // Animation
            const card = document.getElementById('total-card');
            card.classList.add('updated');
            setTimeout(() => card.classList.remove('updated'), 300);
        }
    </script>
</body>
</html>
